name: CI

# Runs on pull requests and non-main branches, and is called by pages.yml for main,
# so the gate in front of a deployment is exactly the gate in front of a merge.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    env:
      # Last commit imported from the platform monorepo; its history predates the convention.
      IMPORT_BASE: 45cee7644201dd94fba3d942e79f823288333811
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$GITHUB_SHA}"
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$head"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$head"
          else
            range="$IMPORT_BASE..$head"
          fi
          scripts/lint-commits.sh "$range"

  supervision:
    name: Majordomus supervision
    runs-on: ubuntu-latest
    env:
      MAJORDOMUS_VERSION: v1.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install majordomus (pinned; the installer verifies the SHA-256 of the release)
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: majordomus doctor
        run: |
          git config core.hooksPath .githooks
          majordomus version
          majordomus doctor

  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    # Měřeno: běh 42814054658 visel v gate ploch 51 min (opraveno: smyčka průjezdu stránkou).
    # Běh 43014704735 (větev katalogů, +559 stránek) byl useknut na 45 min bez jediné chyby:
    # testy nástrojů 21:21, plochy 14:06, audit ještě běžel. Limit = naměřený běh + rezerva;
    # zaseknutý běh i tak skončí s čitelným logem, ne po výchozích 6 h.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Content migration is complete and idempotent
        run: python3 scripts/migrate-content.py --check
      - name: References page is current
        run: python3 scripts/build-references.py --check
      - name: Link graph and metrics are current
        run: python3 scripts/build-graph.py --check
      - name: Shell data (navigation, terms, search, viz libraries) is current
        run: python3 scripts/build-ui-data.py --check
      - name: Engine contract fixtures (kompendium-engine/v1) are current
        run: python3 scripts/build-engine-fixtures.py --check
      - name: Graphics (lattice SVG, section SVG and OG images) are current
        run: python3 scripts/render-graphics.py --check
      - name: README scope table is current
        run: python3 scripts/build-readme.py --check
      - name: Every visualisation goes through the component layer
        run: python3 scripts/check-viz-layer.py
      - name: Front matter is normalised
        run: python3 scripts/normalize-front-matter.py --check
      - name: Markdown is polished
        run: python3 scripts/polish-markdown.py --check
      - name: Terms are linked
        run: python3 scripts/link-terms.py --check
      - name: Information architecture does not regress
        run: python3 scripts/check-ia.py
      - name: Content tooling tests
        run: bash test/run.sh
      - name: Build (internal links are errors)
        run: npm run build
      # Belongs with build-ui-data, but reads the built site (views of the pages, derived()
      # scenarios), so it runs after the build.
      - name: Surfaces catalogue is current; every page class has a covered view (ratchet)
        run: python3 scripts/build-surfaces.py --check
      - name: Stamp the revision
        run: printf '%s\n' "$GITHUB_SHA" > public/revision.txt
      - name: Interactive surfaces render (charts, components, no console errors, phone width)
        run: |
          # Jen prohlížeč z CDN Playwrightu, bez apt závislostí: běh 43044986995 (605a87c5) je
          # nenainstaloval ani na třetí pokus (zrcadla Ubuntu nešla přeložit) a celá sada včetně
          # auditu přesto prošla, takže je nepotřebuje. Chybí-li někdy knihovna, gate selže na ní.
          npx playwright-core install chromium
          root="$RUNNER_TEMP/e2e"
          zola build --base-url http://127.0.0.1:18790/kompendium-epistemicke-anihilace --output-dir "$root/kompendium-epistemicke-anihilace"
          (cd "$root" && python3 -m http.server 18790 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 2
          BASE_URL=http://127.0.0.1:18790/kompendium-epistemicke-anihilace/ \
            SITE_DIR="$root/kompendium-epistemicke-anihilace" npm run --silent test:surfaces
      - name: Accessibility, layout and links (axe-core WCAG 2.2 AA, CLS, overflow, internal links)
        run: |
          BASE_URL=http://127.0.0.1:18790/kompendium-epistemicke-anihilace/ \
            SITE_DIR="$RUNNER_TEMP/e2e/kompendium-epistemicke-anihilace" npm run --silent test:audit
      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7
