name: Pages

# main: validate -> deploy -> verify production. Each stage runs only if the previous one passed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Pages base URL matches zola.toml
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("zola.toml", "rb"))["base_url"])')"
          echo "configure-pages: $PAGES_BASE_URL"
          echo "zola.toml:       $expected"
          test "${PAGES_BASE_URL%/}" = "${expected%/}"
      - name: Download the validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-1-${{ github.run_attempt }}
      # Pages při synchronizaci souborů kolísá: úspěšná nasazení trvají 7–15 s, neúspěšná visí ve
      # stavu finished_file_sync až do limitu (deploy-pages ho ořízne na MAX_TIMEOUT = 600000).
      # Měřeno na běhu 42764915790 a devíti předchozích: opakování nad TÝMŽ artefaktem neuspělo
      # ani jednou (5 z 5 selhalo), další běh s nově nahraným artefaktem téže velikosti uspěl
      # pokaždé. Proto každý další pokus nahraje web znovu jako nový artefakt a nasadí ten.
      # Ani to nestačí vždy (běh 42782839991 selhal ve všech třech pokusech); pak pomůže nový
      # běh (workflow_dispatch). Opakování běhu (rerun) drží artefakty dřívějších pokusů, proto
      # nese název artefaktu číslo pokusu (github.run_attempt), jinak se jména srazí.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-1-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
      - name: Upload Pages artifact (druhý pokus)
        if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-2-${{ github.run_attempt }}
      - name: Deploy (druhý pokus)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-2-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
      - name: Upload Pages artifact (třetí pokus)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-3-${{ github.run_attempt }}
      - name: Deploy (třetí pokus)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-3-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30

  verify:
    name: Verify production
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Production serves this commit
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS "${BASE_URL}revision.txt?nocache=${GITHUB_SHA}" | grep -qx "$GITHUB_SHA"; then
              echo "production serves $GITHUB_SHA (attempt $attempt)"
              break
            fi
            [ "$attempt" = 40 ] && { echo "production does not serve $GITHUB_SHA after 10 minutes" >&2; exit 1; }
            sleep 15
          done
      - name: Smoke test
        run: |
          set -e
          for path in "" kompendium/ kompendium/01-predmluva/ kompendium/techniques/ glossary/ references/ about/ tags/ galerie/ mapa/ stav/ search_index.cs.json data/graph.json data/metrics.json data/search.json data/nav.json data/terms.json data/viz-deps.json css/app.css js/site.js js/viz/kompendium-viz.js js/viz/jadro.js js/viz/jadro-wasm.js wasm/kompendium_engine.wasm js/vendor/flowbite.min.js js/vendor/cytoscape.min.js js/vendor/echarts.min.js js/vendor/alpine.min.js img/og.png; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}${path}")"
            echo "$code ${BASE_URL}${path}"
            test "$code" = 200
          done
          curl -fsS "${BASE_URL}" | grep -q 'Kompendium epistemické a kognitivní anihilace'
      # The engine that answered the header search is the wasm build (ADR 0011): a page that
      # silently fell back to the JS engine (module missing, failed contract check, MIME) fails
      # here, not in a reader's browser. Browser only, no system packages (as in ci.yml).
      - name: Header search answers through the wasm engine
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --silent playwright-core@1.63.0
          npx playwright-core install chromium
          node -e "
          const { chromium } = require('playwright-core');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
            await p.goto(process.env.BASE_URL + 'glossary/', { waitUntil: 'load' });
            await p.locator('[data-search-input]:visible').first().fill('gas');
            await p.waitForFunction(() => document.documentElement.dataset.engine, null, { timeout: 20000 });
            const engine = await p.evaluate(() => document.documentElement.dataset.engine);
            await b.close();
            if (engine !== 'wasm') { console.error('engine=' + engine + ' (expected wasm)'); process.exit(1); }
            console.log('engine=wasm');
          })().catch((e) => { console.error(e.message); process.exit(1); });
          "
