name: Pages

# main: validate -> deploy -> verify production. Each stage runs only if the previous one passed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Pages base URL matches zola.toml
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("zola.toml", "rb"))["base_url"])')"
          echo "configure-pages: $PAGES_BASE_URL"
          echo "zola.toml:       $expected"
          test "${PAGES_BASE_URL%/}" = "${expected%/}"
      - name: Download the validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Pages při synchronizaci souborů kolísá: úspěšná nasazení 23–45 s, jedno 514 s; neúspěšná
      # visí ve stavu finished_file_sync (běhy 42750395044, 42756308971). actions/deploy-pages
      # strop `timeout` neposouvá: MAX_TIMEOUT = 600000 v src/internal/deployment.js, vyšší
      # hodnota se tiše ořízne. Proto limit 600 s, error_count 30 a dva další pokusy nad týmž
      # artefaktem; 42756308971 selhal v obou ze dvou pokusů.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 30
      - name: Deploy (druhý pokus)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 30
      - name: Deploy (třetí pokus)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 30

  verify:
    name: Verify production
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Production serves this commit
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS "${BASE_URL}revision.txt?nocache=${GITHUB_SHA}" | grep -qx "$GITHUB_SHA"; then
              echo "production serves $GITHUB_SHA (attempt $attempt)"
              break
            fi
            [ "$attempt" = 40 ] && { echo "production does not serve $GITHUB_SHA after 10 minutes" >&2; exit 1; }
            sleep 15
          done
      - name: Smoke test
        run: |
          set -e
          for path in "" kompendium/ kompendium/01-predmluva/ kompendium/techniques/ glossary/ references/ about/ tags/ galerie/ mapa/ stav/ search_index.cs.json data/graph.json data/metrics.json data/search.json data/nav.json data/terms.json data/viz-deps.json css/app.css js/site.js js/viz/kompendium-viz.js js/vendor/flowbite.min.js js/vendor/cytoscape.min.js js/vendor/echarts.min.js js/vendor/alpine.min.js img/og.png; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${BASE_URL}${path}")"
            echo "$code ${BASE_URL}${path}"
            test "$code" = 200
          done
          curl -fsS "${BASE_URL}" | grep -q 'Kompendium epistemické a kognitivní anihilace'
