# Bezpečnostní rámec — jeden zdroj pro celou knihu.
#
# Tento soubor je kanonickým textem sedmi pojistek, které se dřív opakovaly jako
# vložená tabulka na 40 technických stránkách. Seznam pojistek je společné
# upozornění, ne obsah jednotlivé techniky, a společné upozornění patří na jedno
# místo. Každá stránka si proto píše vlastní úvodní odstavec — ten je specifický —
# a tabulku vykresluje shortcode `bezpecnostni_ramec` z těchto dat.
#
# Druhý sloupec říká, co čtenář pozná, když pojistka chybí. Nikdy neříká, co
# zařídit: kniha popisuje rozpoznatelnou strukturu a odmítá postup. Do políček
# proto nepatří prahy, počty, lhůty ani pořadí kroků.
#
# Při úpravě textu se mění všech 40 stránek zároveň; to je smysl toho zdroje.

