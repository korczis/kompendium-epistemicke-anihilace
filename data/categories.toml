# Categories of the book: page types (typ), domains (oblast) and the EA families and
# subfamilies (rodina, podrodina), all derived — never written on a page.
#
# The single source for scripts/build-graph.py, which gives every node of static/data/graph.json
# its `typ`, `oblasti` and (for EA-coded pages) `rodina` and `podrodina`, and writes the
# `categories` index (label, description, members) the site's category hubs and page chips read.
# `build-graph.py --check` fails when a section of content/ has no `typ` row, so a new section
# is introduced by adding a row here (extensible, enforced). Subfamily names come from the
# technique registry (08-prilohy/rejstrik-technik.md: "### N.M Name" headings and the
# "| `EA-N.M` | Name |" rows of its group tables); a subfamily without a name keeps its code.
#
# Row fields:
#   typ.sections   section paths (relative to content/, as graph.json `section`); the longest
#                  match wins; "root" is a page directly under content/
#   oblast.sections / oblast.families   a node belongs to the domain when its section matches
#                  or its EA family (EA-N) is listed; a node can belong to several domains

schema = "kompendium-categories/v1"

