# Pages that name a drug class to RECOGNISE, never to offer (owner, ADR 0013 doplněk 3).
#
# Read by scripts/check-ia.py (rule drug-name). A page listed here may name a drug class where the
# sentence lets a reader recognise an emergency, a cause to rule out first or a harm; offering,
# planning or requiring medication stays refused on every page. Each entry says why. An entry
# whose page no longer names any drug is stale and fails the gate, so an exemption cannot outlive
# its reason. Historical cases are exempt by path instead (doplněk 2).

