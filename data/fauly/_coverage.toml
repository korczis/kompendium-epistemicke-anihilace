entry = "potvrzeni-dusledku"

[[term]]
name = "Non causa pro causa (Aristotelovo pojetí)"
sources = ["hamblin-1970"]
excluded = "U Aristotela jde o úzký případ: v důkazu sporem se za příčinu absurdity vydá premisa, která ji nezpůsobila. Moderní rodinu chybného přisouzení příčiny pokrývají hesla post hoc, cum hoc a klam jediné příčiny."

[[term]]
name = "Mnoho otázek (many questions, complex question)"
sources = ["hamblin-1970", "copi-cohen-mcmahon-2014"]
entry = "slozena-otazka"

