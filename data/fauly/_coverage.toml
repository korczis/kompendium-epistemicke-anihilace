# Pokrytí standardních přehledů klamů (pravidlo project.content-catalogs). Každý [[term]] je
# název, který uvádí standardní přehled oboru (díla v data/sources.toml), a vede buď na heslo
# katalogu (`entry`, slug kteréhokoli katalogu, i kanonické heslo), nebo nese důvod, proč heslo
# nemá (`excluded`, aspoň 40 znaků). scripts/catalogs.py --check odmítne název bez hesla i bez
# důvodu, neznámé heslo nebo dílo mimo bibliografii; tabulku pokrytí na rozcestníku katalogu a
# pole `coverage` v exportu odvozuje engine. Přehled se rozšiřuje přidáním dalších názvů, které
# dílo prokazatelně uvádí – nikdy ne názvy, které dílo neobsahuje.
#
# Hamblin 1970 vykládá Aristotelových třináct sofistických vyvrácení (O sofistických důkazech)
# i Lockovy argumenty „ad“; Copi, Cohen a McMahon 2014 je učebnicový přehled neformálních klamů
# (relevance, vadná indukce, předpoklad, dvojznačnost) a pravidel sylogismu a hypotetických
# úsudků.

# --- Aristotelova vyvrácení závislá na řeči (in dictione) ------------------------------------

[[term]]
name = "Ekvivokace (equivocation)"
sources = ["hamblin-1970", "copi-cohen-mcmahon-2014"]
entry = "ekvivokace"

[[term]]
name = "Amfibolie (amphiboly)"
sources = ["hamblin-1970", "copi-cohen-mcmahon-2014"]
entry = "amfibolie"

[[term]]
name = "Spojení a složení (combination, composition)"
sources = ["hamblin-1970", "copi-cohen-mcmahon-2014"]
entry = "klam-skladani"

[[term]]
name = "Rozdělení (division)"
sources = ["hamblin-1970", "copi-cohen-mcmahon-2014"]
entry = "klam-deleni"

[[term]]
name = "Přízvuk (accent)"
sources = ["hamblin-1970", "copi-cohen-mcmahon-2014"]
entry = "klam-duraznu"

[[term]]
name = "Tvar výrazu (form of expression, figura dictionis)"
sources = ["hamblin-1970"]
excluded = "Aristotelův klam stojí na řecké tvarosloví (rod, slovní druh, kategorie podle koncovky); mimo řečtinu nemá samostatný protějšek a jeho moderní příbuzné pokrývají hesla ekvivokace a reifikace."

# --- Aristotelova vyvrácení nezávislá na řeči (extra dictionem) ------------------------------

[[term]]
