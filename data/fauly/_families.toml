# Rodiny katalogu argumentačních faulů (pravidlo project.content-catalogs; deklarace
# data/catalogs.toml). Pořadí rodin je pořadí v tomto souboru; `code` je neměnná dvoumístná část
# identifikátoru AF-FF.NN. Hesla rodiny jsou v data/fauly/<slug>.toml, stránky v
# content/kompendium/argumentacni-fauly/<slug>/. Nic z toho se nepíše na stránky ručně.

