[[pattern.trainer]]
utterance = "Vaše stížnost na šikanu v laboratoři nebyla podána na formuláři platném od září, proto ji komise nemůže projednat. Doporučujeme podat ji znovu v příštím semestru."
context = "Odpověď fakultní komise na třetí opakovanou stížnost doktorandky."
benign = false
marker = "Formální vada se stává důvodem neprojednat obsah, oprava se odkládá a nikdo nepřevezme odpovědnost za samotné tvrzení."
response = "Žádat písemně, aby komise vadu konkrétně označila, umožnila ji odstranit v přiměřené lhůtě a mezitím se zabývala doloženými skutečnostmi."

[[pattern.trainer]]
utterance = "Než začneme hlasovat o rozpočtu, upozorňuji, že podklady nebyly členům rozeslány v termínu daném jednacím řádem; navrhuji odložit bod o týden, aby je všichni mohli přečíst."
context = "Člen zastupitelstva na začátku zasedání."
benign = true
marker = "Procedurální námitka chrání možnost věcného posouzení, má konkrétní nápravu a krátký termín."
response = "Jde o legitimní procedurální argument: pravidlo existuje, aby se o věci rozhodovalo informovaně, a návrh k věcné debatě vede, ne od ní."

