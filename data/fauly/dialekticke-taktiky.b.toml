[[pattern.trainer]]
utterance = "Ráno to byla nehoda, odpoledne sabotáž ze zahraničí, večer se prý nic nestalo a zítra už nikdo nebude vědět, čemu věřit. Tak co vlastně chcete vyvracet?"
context = "Shrnutí sledu protichůdných verzí jedné události, které během dne šířila síť propojených kanálů."
benign = false
marker = "Množství, rychlost a vzájemná nekonzistence verzí nemají přesvědčit o jedné z nich, ale zahltit a vyvolat rezignaci na rozlišování."
response = "Nevyvracet každou verzi zvlášť, ale pojmenovat vzorec, sledovat jeho zdroje a opřít se o několik ověřených bodů, které se nemění."

[[pattern.trainer]]
utterance = "Během prvních hodin po výbuchu jsme opravili tři údaje, protože se změnily informace hasičů; každou opravu jsme označili a ponechali původní znění viditelné."
context = "Zpravodajský server vysvětluje čtenářům změny v průběžném zpravodajství o neštěstí."
benign = true
marker = "Změny výpovědi jsou přiznané, zdůvodněné a dohledatelné, takže nesměřují ke zmatení, ale k přesnosti."
response = "Jde o běžnou korekci: průběžné zpravodajství se mění s novými fakty a transparentní oprava je znakem důvěryhodnosti, ne palby nepravd."

