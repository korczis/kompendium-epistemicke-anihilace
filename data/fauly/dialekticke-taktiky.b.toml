[[pattern.trainer]]
utterance = "Kdyby se to opravdu stalo, řekla by to už tehdy. Mlčela dva roky, takže si to nejspíš vymyslela."
context = "Kolega komentuje opožděné oznámení obtěžování na pracovišti."
benign = false
marker = "Z toho, že se o události dlouho nemluvilo, se vyvozuje, že nenastala, aniž by se zvážilo, proč by svědek mohl mlčet."
response = "Ptát se, zda by za daných okolností bylo okamžité oznámení pravděpodobné, a posuzovat oznámení podle dostupných stop, ne podle jeho načasování."

[[pattern.trainer]]
utterance = "Celní záznamy přístavu jsou pro to období úplné a vedly se denně; o lodi toho jména v nich není ani zmínka, takže tvrzení, že tu tehdy kotvila, je málo pravděpodobné."
context = "Historik posuzuje legendu o příjezdu lodi do přístavu."
benign = true
marker = "Mlčení pochází ze zdroje, který by událost s vysokou pravděpodobností zaznamenal, a úplnost zdroje je doložena."
response = "Jde o oprávněný úsudek: síla argumentu z mlčení roste s tím, jak pravděpodobně by zdroj událost zachytil, a závěr je formulován opatrně."

