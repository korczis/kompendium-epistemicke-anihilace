[[pattern.trainer]]
utterance = "Jsem úplně na vaší straně, ale opravdu si myslíte, že zveřejnit ty nálezy teď je dobrý nápad? Lidé vám přestanou věřit a celé věci to spíš uškodí."
context = "Neznámý účet v diskusi pod oznámením výzkumníka, že zveřejní zjištění o nesrovnalostech v datech."
benign = false
marker = "Deklarovaná sounáležitost slouží jako vstupenka a obava vždy směřuje k mlčení nebo odkladu, bez konkrétního rizika a bez alternativy."
response = "Posoudit obavu podle obsahu, ne podle prohlášené loajality, a ptát se, jaké konkrétní riziko a jaký lepší postup mluvčí navrhuje."

[[pattern.trainer]]
utterance = "Podporuji zveřejnění, jen bych doporučila nejdřív dát univerzitě deset dní na vyjádření, jak to žádá její řád; jinak by mohla napadnout postup místo obsahu."
context = "Kolegyně s prokazatelnou historií spolupráce komentuje plán na zveřejnění zjištění."
benign = true
marker = "Obava je konkrétní, opírá se o ověřitelné pravidlo a nabízí cestu, jak cíle dosáhnout, ne důvod se ho vzdát."
response = "Jde o skutečnou starost: má adresu, zdroj a konstruktivní návrh a nemíří k tomu, aby věc zůstala nevyslovena."

