[[pattern.trainer]]
utterance = "Stačí se podívat, co píše ten anonym pod článkem o cyklostezkách: chce zakázat auta ve všech městech. Takhle prostě uvažují zastánci cyklistiky."
context = "Komentátor místního zpravodaje píše o návrhu nové cyklostezky."
benign = false
marker = "Výrok jednoho výstředního a neoznačeného diskutujícího se vydává za typický postoj celé skupiny, jejíž skutečné argumenty zůstanou stranou."
response = "Ptát se, kdo skupinu skutečně zastupuje a co tvrdí její oficiální návrh, a posuzovat ten, ne nejextrémnější hlas, který šlo najít."

[[pattern.trainer]]
utterance = "Ukázky extrémních komentářů z obou táborů uvádíme jako ilustraci tónu diskuse, ne jako vzorek názorů; ty měří průzkum, jehož výsledky jsou v příloze."
context = "Výzkumná zpráva o polarizaci online diskuse."
benign = true
marker = "Extrémní příklady jsou výslovně označeny jako netypické a reprezentativnost se opírá o samostatné měření."
response = "Jde o poctivé užití: autor odděluje ilustraci od zobecnění a rozložení názorů dokládá daty, ne vybranými citáty."

