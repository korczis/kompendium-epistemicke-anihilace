[[pattern.trainer]]
utterance = "V dnešní debatě o bezpečnosti očkování dostane stejný prostor imunoložka z fakultní nemocnice i autor populárního videa, aby si diváci mohli udělat názor sami."
context = "Moderátor uvádí televizní diskusi o tématu, k němuž existuje široká shoda odborné literatury."
benign = false
marker = "Stejný čas pro obě strany vytváří dojem rovnocenného sporu, ačkoli váha důkazů a odbornosti na obou stranách rovnocenná není."
response = "Ptát se, jak je rozložena shoda v odborné literatuře, a žádat, aby rámec pořadu tento stav sdělil dřív, než se strany střídají u mikrofonu."

[[pattern.trainer]]
utterance = "O tom, zda nový zákon sníží byrokracii, se ekonomové skutečně přou, proto jsme pozvali dva odborníky s opačným závěrem a oba uvedou data, ze kterých vycházejí."
context = "Redakce připravuje rozhovor k otázce, kde se odborná literatura opravdu rozchází."
benign = true
marker = "Vyváženost odpovídá skutečnému stavu odborného sporu a obě strany předkládají ověřitelné podklady."
response = "Jde o legitimní vyvážení: rozdělení prostoru odráží rozdělení odborné obce, ne pouhou existenci dvou názorů."

