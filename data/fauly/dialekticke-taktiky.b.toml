[[pattern.trainer]]
utterance = "Tady nejde o žádné chyby ve výkazech. Jde o to, že mi kolegyně od začátku nemůže přijít na jméno a teď si hledá záminku."
context = "Vedoucí oddělení reaguje na upozornění auditorky na nesrovnalosti v účetnictví."
benign = false
marker = "Otázka, zda jsou ve výkazech chyby, se nahrazuje otázkou vztahu a motivů osob, takže se tvrzení přestane posuzovat."
response = "Vrátit rozhovor k ověřitelnému předmětu: které položky jsou sporné a co o nich říkají doklady, bez ohledu na vztahy mezi lidmi."

[[pattern.trainer]]
utterance = "Váš návrh je podle mě nákladný a důvody uvedu v tabulce; zároveň oznamuji, že jsem s jeho autorem v příbuzenském vztahu, a proto se zdržím hlasování."
context = "Člen hodnoticí komise při projednání grantového návrhu."
benign = true
marker = "Osobní vztah se zmiňuje jako střet zájmů, který se procedurálně ošetří, a věcná kritika zůstává oddělena a doložena."
response = "Jde o poctivé zacházení s osobní rovinou: vztah se pojmenuje, aby neovlivnil rozhodnutí, místo aby nahradil věcné důvody."
