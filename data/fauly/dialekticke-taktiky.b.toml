[[pattern.trainer]]
utterance = "Všechny časopisy můj článek o léčbě magnety odmítly. Přesně tak to ale dopadlo s každým, kdo přinesl převratný objev, a právě to dokazuje, že mám pravdu."
context = "Autor alternativní léčebné metody reaguje na odmítnutí rukopisu."
benign = false
marker = "Odmítnutí odbornou obcí se vydává za doklad pravdivosti, protože ho prý zažili i průkopníci, ačkoli ho zažila i většina omylů."
response = "Oddělit otázku odmítnutí od otázky důkazů: ptát se, jaká data tvrzení podporují a jak obstojí v nezávislém ověření."

[[pattern.trainer]]
utterance = "Moje hypotéza jde proti převažujícímu názoru, a proto jsem data zveřejnila celá a navrhla pokus, který by ji mohl jednoznačně vyvrátit."
context = "Výzkumnice prezentuje neobvyklý výsledek na odborné konferenci."
benign = true
marker = "Menšinové postavení se netvrdí jako důkaz; autorka nabízí cestu k vyvrácení a přenechává rozhodnutí datům."
response = "Jde o legitimní nesouhlas s konsenzem: vědecká změna vychází z testovatelných předpovědí, ne z odkazu na vlastní pronásledování."

