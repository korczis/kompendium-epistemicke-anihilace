[[pattern.trainer]]
utterance = "Říkám to už po desáté a budu to opakovat, dokud to nepochopíte: ta čistička znečišťuje řeku. Kolikrát to ještě mám říct?"
context = "Občanské shromáždění k rozšíření průmyslové zóny, mluvčí nepředložil žádné měření."
benign = false
marker = "Místo nového dokladu přichází jen další opakování téhož tvrzení a počet opakování se vydává za jeho sílu."
response = "Oddělit četnost tvrzení od jeho opory a zeptat se na měření nebo jiný doklad; desáté opakování má stejnou důkazní hodnotu jako první."

[[pattern.trainer]]
utterance = "Připomínám znovu to, co jsem uvedl minule: odběr vzorků proběhl jen jednou. Než rozhodneme, potřebujeme aspoň druhé měření."
context = "Zasedání komise, která má rozhodnout o povolení."
benign = true
marker = "Opakuje se nevyřízená námitka, která zatím nedostala odpověď, a spolu s ní konkrétní návrh, jak ji vyřešit."
response = "Jde o legitimní připomenutí: opakování neslouží jako důkaz, ale upozorňuje, že věcná námitka zůstala bez odpovědi."

