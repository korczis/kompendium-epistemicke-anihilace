benign = true
marker = "Chyba je nejdřív ukázána v obsahu argumentu a zájem autora slouží jen jako důvod ke zvýšené kontrole, ne jako vyvrácení."
response = "Jde o legitimní postup: střet zájmů zvyšuje nároky na ověření, ale závěr o chybě stojí na doložené metodické vadě."
