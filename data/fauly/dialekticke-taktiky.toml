[[pattern.trainer]]
utterance = "Tvrdím jen, že léky mají vedlejší účinky, a to přece nikdo nepopře. Takže moje rada vysadit veškerou léčbu je oprávněná."
context = "Diskusní fórum o chronickém onemocnění."
benign = false
marker = "Pod tlakem se mluvčí stáhne k triviální a nesporné tezi a pak z jejího přijetí vyvozuje platnost původního, mnohem silnějšího tvrzení."
response = "Oddělit obě tvrzení nahlas: s triviální tezí lze souhlasit, ale silné tvrzení o vysazení léčby zůstává nedoložené a vyžaduje vlastní důkazy."

[[pattern.trainer]]
utterance = "Původně jsem tvrdil, že metoda funguje u všech pacientů. To neobhájím; data podporují jen účinek u lehčích forem."
context = "Výzkumník na semináři reaguje na kritiku své interpretace."
benign = true
marker = "Mluvčí výslovně opouští silnější tvrzení a hlásí se jen k slabšímu, které data podporují; nevrací se k původnímu."
response = "Jde o poctivé zúžení teze: oprava je přiznaná a další diskuse se vede už jen o slabším, doloženém tvrzení."

