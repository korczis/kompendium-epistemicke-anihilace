[[pattern.trainer]]
utterance = "Jen bych rád viděl zdroj. A k tomu zdroji metodiku. A k metodice nezávislé ověření. Proč mi pořád neodpovídáte, když se ptám slušně?"
context = "Komentáře pod článkem lékařky, která už odkázala na přehledovou studii."
benign = false
marker = "Zdvořilé požadavky na důkazy pokračují i po jejich splnění, každá odpověď vyvolá novou žádost a mlčení se vykládá jako přiznání slabosti."
response = "Ukázat, co už bylo doloženo, vyžádat si konkrétní námitku k předloženému zdroji a rozhovor ukončit, pokud žádná nepřijde; mlčení není důkaz."

[[pattern.trainer]]
utterance = "Přečetl jsem tu přehledovou studii, kterou jste uvedla. Nerozumím, proč vylučuje pacienty nad sedmdesát let. Mohla byste to vysvětlit?"
context = "Diskuse po přednášce, posluchač se ptá autorky."
benign = true
marker = "Otázka navazuje na předložený zdroj, míří na konkrétní bod a mluvčí ukazuje, že s odpovědí bude pracovat."
response = "Jde o legitimní dotaz: je konkrétní, vychází z přečteného materiálu a nevede k nekonečnému řetězu nových požadavků."

