[[pattern.trainer]]
utterance = "Netvrdím, že ta ředitelka kradla. Jen se ptám, proč si za poslední rok koupila nové auto. To se snad ještě smí, ne?"
context = "Příspěvek v místní facebookové skupině o hospodaření školy."
benign = false
marker = "Otázka nese obvinění, které mluvčí nevyslovuje, a dovolání se práva ptát se slouží k tomu, aby za insinuaci nemusel nést důkazní břemeno."
response = "Převést otázku na tvrzení, které implikuje, a zeptat se, jaký doklad pro to tvrzení existuje; bez dokladu otázka nic nesděluje o ředitelce."

[[pattern.trainer]]
utterance = "V rozpočtu školy je položka na vozidlo, ale v seznamu majetku žádné auto není. Může vedení vysvětlit, kam ta částka šla?"
context = "Člen školské rady na veřejném zasedání."
benign = true
marker = "Otázka vychází z konkrétního doloženého nesouladu, je adresována tomu, kdo může odpovědět, a odpověď je možné ověřit."
response = "Jde o legitimní kontrolní dotaz: má věcný podklad, nevyvozuje vinu předem a spokojí se s ověřitelným vysvětlením."

