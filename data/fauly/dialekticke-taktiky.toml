[[pattern.trainer]]
utterance = "Tvoje kritika reformy nemocnic je pochopitelná: jsi lékař a bojíš se o své příjmy. Proto ji nemusíme brát vážně."
context = "Debata o zdravotní politice mezi známými."
benign = false
marker = "Mluvčí vysvětluje, proč druhý zastává svůj názor, a z domnělého motivu vyvozuje, že názor je chybný, aniž by se dotkl jeho obsahu."
response = "Připustit, že motiv může existovat, a přesto trvat na posouzení argumentů samotných; i zainteresovaný člověk může mít pravdu."

[[pattern.trainer]]
utterance = "Studie dospěla k chybnému závěru, protože porovnává skupiny různého věku. To, že ji financoval výrobce, je důvod prověřit ji pečlivěji."
