[[pattern.trainer]]
utterance = "Za dvě minuty jsem uvedl dvacet důvodů, proč je ta vakcína nebezpečná, a vy jste vyvrátil sotva dva. Zbytek tedy platí."
context = "Veřejná debata s časovým limitem, odborník proti oponentovi."
benign = false
marker = "Počet nevyvrácených tvrzení se vydává za důkaz jejich pravdivosti, ačkoli vyvrácení stojí řádově víc času než vyslovení."
response = "Upozornit na nepoměr času, vybrat nejsilnější tvrzení oponenta, rozebrat ho do hloubky a připomenout, že důkazní břemeno nese ten, kdo tvrzení vyslovil."

[[pattern.trainer]]
utterance = "Mám k návrhu pět výhrad. Pošlu je písemně se zdroji a na schůzce bych rád probral ty dvě nejvážnější."
context = "Člen pracovní skupiny reaguje na návrh nového postupu."
benign = true
marker = "Více námitek je podáno tak, aby je druhá strana mohla v klidu ověřit, a rozhovor se soustředí na nejvážnější z nich."
response = "Jde o poctivou kritiku: námitky jsou doložené, druhá strana má čas odpovědět a nikdo z jejich počtu nevyvozuje pravdivost."

