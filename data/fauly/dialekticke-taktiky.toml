[[pattern.trainer]]
utterance = "Tvoje pochybnosti o vedení jsou jen hlas ega. Ego vždycky hledá důvody. Až ho pustíš, uvidíš, že žádný problém není."
context = "Starší člen duchovní komunity odpovídá novějšímu členovi na otázku o financích skupiny."
benign = false
marker = "Konkrétní otázka se nezodpoví, ale přejmenuje na projev nežádoucího stavu, a tím se ukončí; fráze funguje stejně na jakoukoli námitku."
response = "Vrátit se k původní otázce v běžné řeči a trvat na odpovědi k věci; výklad pochybnosti jako vady tazatele neříká nic o financích skupiny."

[[pattern.trainer]]
utterance = "Je pozdě a oba jsme unavení. Nechme to být do zítřka a ráno se k tomu vrátíme s čistou hlavou."
context = "Dva kolegové po dlouhé neshodě o plánu projektu."
benign = true
marker = "Rozhovor se odkládá, ne ukončuje: návrat k tématu je výslovně slíben a obě strany si ponechávají své námitky."
response = "Jde o legitimní přerušení: fráze nezneplatňuje ničí stanovisko a neodnímá právo k věci se vrátit."

