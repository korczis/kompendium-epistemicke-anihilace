[[pattern.trainer]]
utterance = "Už to, jak se bráníš, dokazuje, že to v tobě je. Člověk, který by s tím problém neměl, by se vůbec necítil dotčen."
context = "Vedoucí týmového workshopu reaguje na účastníka, který odmítl obvinění z předsudků."
benign = false
marker = "Popření obvinění se samo počítá jako důkaz viny, takže žádná možná odpověď obviněného nemůže tvrzení vyvrátit."
response = "Pojmenovat, že tvrzení nemá žádný představitelný vyvracející doklad, a požádat o konkrétní chování nebo výrok, o který se obvinění opírá."

[[pattern.trainer]]
utterance = "Tvrdíte, že jste ty peníze nepřevedl. Výpis z účtu ale ukazuje převod s vaším podpisem. Jak to vysvětlíte?"
context = "Interní šetření ve firmě, vyšetřovatel se ptá zaměstnance."
benign = true
marker = "Popření se posuzuje proti nezávislému dokladu, ne samo o sobě, a obviněný má prostor vysvětlit rozpor."
response = "Jde o legitimní postup šetření: tvrzení je vyvratitelné doklady a popření není samo o sobě považováno za přiznání."

