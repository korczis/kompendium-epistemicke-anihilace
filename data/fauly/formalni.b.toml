[[pattern.trainer]]
utterance = "Svědkyně souseda z vedlejšího bytu dobře zná a za násilníka by ho nikdy neoznačila. Muže z nahrávky ale za násilníka označila. Nemůže to tedy být soused."
context = "Obhajoba zpochybňuje identifikaci pachatele z nekvalitního videozáznamu."
benign = false
marker = "Z toho, co si svědkyně myslí o osobě pod jedním popisem a pod druhým, se vyvozuje, že jde o dvě různé osoby."
response = "Postoj svědkyně závisí na popisu, pod kterým osobu zná; totožnost musí potvrdit nebo vyloučit nezávislé důkazy."

[[pattern.trainer]]
utterance = "Soused měl v době činu sádru na pravé ruce. Muž na nahrávce oběma rukama zvedá těžkou bednu. Soused to tedy nejspíš nebyl."
context = "Vyšetřovatel porovnává lékařskou zprávu se záznamem z kamery."
benign = true
marker = "Odlišnost se opírá o vlastnost samotných osob, ne o to, co si o nich kdo myslí, takže zákon totožnosti se uplatňuje oprávněně."
response = "Platné užití: má-li jedna osoba vlastnost, kterou druhá nemá, nejde o tutéž osobu; zbývá ověřit spolehlivost obou údajů."

