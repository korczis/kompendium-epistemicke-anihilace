[[pattern.trainer]]
utterance = "Za každou z posledních krizí někdo stál a měl z ní prospěch. Je tedy zřejmé, že existuje skupina, která řídí všechny krize."
context = "Komentátor ve videu shrnuje sérii ekonomických a zdravotních krizí posledních let."
benign = false
marker = "Z tvrzení, že každá krize měla nějakého původce, se přechází k tvrzení, že jeden původce stojí za všemi krizemi."
response = "Pořadí „každý – nějaký“ nelze obrátit: různí původci různých krizí nedokládají jednoho společného. Ten by musel být doložen zvlášť."

[[pattern.trainer]]
utterance = "Každý vzorek z šarže prošel stejnou plnicí linkou číslo tři a všechny vykazují stejnou kontaminaci. Prověříme proto právě tuto linku."
context = "Vedoucí kontroly kvality hledá zdroj vady léčivého přípravku."
benign = true
marker = "Společný prvek všech případů je doložen přímo v premise (jedna konkrétní linka), ne vyvozen z toho, že každý případ měl nějaký zdroj."
response = "Úsudek je oprávněný: tvrzení „existuje linka společná všem vzorkům“ je zjištěno, ne odvozeno záměnou kvantifikátorů."

