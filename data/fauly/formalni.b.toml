[[pattern.trainer]]
utterance = "Ten tvůj argument je klasický útok na autoritu, to je učebnicový klam. Takže pravdu nemáš a lék je bezpečný, jak tvrdí výrobce."
context = "Diskuse pod článkem o vedlejších účincích nového léku."
benign = false
marker = "Z toho, že argument pro tvrzení je vadný, se vyvozuje, že tvrzení je nepravdivé, a navíc že platí jeho opak."
response = "Vadný argument jen nic nedokazuje. Bezpečnost léku je samostatná otázka, kterou rozhodují data o účincích, ne kvalita jedné námitky."

[[pattern.trainer]]
utterance = "Tvůj argument pro zdražení je vadný, protože z jednoho dražšího měsíce vyvozuješ trend. Neznamená to, že ceny nerostou; jen to z tohohle neplyne."
context = "Ekonomka v redakční poradě reaguje na návrh titulku o zdražování."
benign = true
marker = "Kritika míří na spojení premis se závěrem a výslovně ponechává otázku pravdivosti závěru otevřenou."
response = "Správné užití kritiky: vadnost argumentu se odliší od nepravdivosti závěru, o kterém rozhodnou další data."
