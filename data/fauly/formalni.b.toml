[[pattern.trainer]]
utterance = "Každý, kdo porušil interní směrnici, bude kázeňsky potrestán. Kdo porušil směrnici, bude potrestán. Z toho je jasné, že někteří zaměstnanci směrnici porušili."
context = "Vedoucí oddělení na poradě shrnuje výsledek interního šetření, které žádné porušení nezjistilo."
benign = false
marker = "Ze dvou obecných pravidel o tom, co platí pro každého porušitele, se vyvozuje, že nějaký porušitel existuje, ačkoli to žádná premisa netvrdí."
response = "Oddělit pravidlo od faktu: obecná věta o porušitelích platí i tehdy, když žádný není. Existenci porušení musí doložit samostatné zjištění."

[[pattern.trainer]]
utterance = "Šetření zjistilo dva případy porušení směrnice. Každý, kdo směrnici porušil, bude kázeňsky řešen. Proto budou kázeňsky řešeni nejméně dva zaměstnanci."
context = "Personalista vysvětluje odborové organizaci další postup po uzavřeném šetření."
benign = true
marker = "Existence členů třídy je doložena samostatnou premisou o zjištěných případech, takže částečný závěr má oporu."
response = "Úsudek je platný: obecné pravidlo se uplatňuje na třídu, o jejíchž členech existuje samostatné zjištění."

