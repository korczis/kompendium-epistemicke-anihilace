[[pattern.trainer]]
utterance = "Jestliže to vím, pak je to pravda, to snad uznáš. A já to vím. Takže to jinak být nemohlo a nemá smysl se o tom dál bavit."
context = "Partner ukončuje rozhovor o tom, co se odehrálo při včerejší hádce."
benign = false
marker = "Nutnost spojení mezi věděním a pravdou se přenáší na samotný obsah: z „nutně, když vím p, pak p“ se dělá „p je nutně pravda“."
response = "Nutná je jen vazba mezi skutečným věděním a pravdou; zda mluvčí skutečně ví, je otevřená otázka, kterou lze ověřovat."

[[pattern.trainer]]
utterance = "Nutně platí jen tohle: konala-li se zkouška ve čtvrtek, nekonala se v pátek. Neříkám tím, že musela být ve čtvrtek; termín se dal klidně přesunout."
context = "Studijní referentka vysvětluje studentovi, proč nemůže uplatnit páteční omluvenku."
benign = true
marker = "Mluvčí výslovně drží nutnost jen u vztahu mezi oběma tvrzeními a odmítá ji přenést na samotný termín zkoušky."
response = "Správné rozlišení rozsahu: nutné je spojení, ne jednotlivá událost, která mohla proběhnout jinak."

