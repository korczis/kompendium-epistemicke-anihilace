[[pattern.trainer]]
utterance = "Obžalovaný v době činu nebyl v kanceláři a pachatel v kanceláři také nebyl, protože vnikl do skladu. Obžalovaný tedy pachatelem být nemůže."
context = "Obhájce v závěrečné řeči shrnuje, co podle něj vyplývá z kamerových záznamů."
benign = false
marker = "Obě premisy jsou záporné: říkají jen, kde obžalovaný a pachatel nebyli, a o jejich vzájemném vztahu tak nevyplývá nic."
response = "Ze dvou vyloučení nelze vyvodit třetí. Rozhodující je, zda obžalovaný mohl být ve skladu, a to musí doložit jiný důkaz."

[[pattern.trainer]]
utterance = "Pachatel byl v době činu ve skladu. Obžalovaný v té době ve skladu nebyl, jak ukazuje záznam z jiného města. Obžalovaný tedy pachatelem není."
context = "Soudkyně zdůvodňuje, proč považuje alibi za prokázané."
benign = true
marker = "Jedna premisa je kladná a určuje, kde pachatel byl; teprve díky ní záporná premisa o obžalovaném vede k závěru."
response = "Platný úsudek se střední podmínkou „být ve skladu“, kterou jedna premisa přisuzuje a druhá upírá."

