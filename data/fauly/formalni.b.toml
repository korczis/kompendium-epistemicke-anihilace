[[pattern.trainer]]
utterance = "Bolesti na hrudi mají buď psychický, nebo tělesný původ. U pacientky je doložená úzkostná porucha, takže tělesnou příčinu můžeme pustit z hlavy."
context = "Lékař na příjmu probírá s kolegou pacientku se známou psychiatrickou diagnózou."
benign = false
marker = "Potvrzení jedné možnosti v disjunkci se bere jako vyloučení druhé, přestože obě příčiny mohou působit současně."
response = "Spojka „nebo“ tu možnosti nevylučuje: doložená úzkost nevyvrací tělesnou příčinu a ta se musí vyšetřit samostatně."

[[pattern.trainer]]
utterance = "Smlouva připouští jen jeden způsob ukončení, buď výpovědí, nebo dohodou, a obojí současně vylučuje. Nájem skončil dohodou, takže výpověď podána nebyla."
context = "Advokátka vysvětluje klientovi, proč se spor nemůže týkat výpovědní lhůty."
benign = true
marker = "Výlučnost obou možností je výslovně stanovena v premise, takže potvrzení jedné oprávněně vylučuje druhou."
response = "Úsudek je platný, protože výlučná disjunkce je doložena textem smlouvy, ne jen předpokládána."

