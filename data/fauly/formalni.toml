[[pattern.trainer]]
utterance = "Extremisté kritizují nové bezpečnostní opatření. Vy to opatření kritizujete taky, takže jste jeden z nich."
context = "Moderátor veřejné debaty reaguje na námitku člověka z publika."
benign = false
marker = "Společný znak (kritika opatření) sdílí extremisté i mnoho dalších lidí; střední termín není v žádné premise vztažen na všechny kritiky, takže spojení obou skupin neplyne."
response = "Zeptat se, zda každý, kdo opatření kritizuje, je extremista; protože tak premisa nezní, závěr z ní nevyplývá a o námitce je třeba jednat věcně."

[[pattern.trainer]]
utterance = "Všichni podvodní správci, které jsme dosud odhalili, slibovali mimořádně vysoké výnosy. Tento správce slibuje vysoké výnosy, takže je to podvodník."
context = "Analytik dozorového orgánu shrnuje první dojem z nabídky investičního fondu."
benign = false
marker = "Znak sdílený podvodníky i částí poctivých nabídek se vydává za doklad příslušnosti ke skupině; jako dedukce úsudek neplatí, nanejvýš jde o důvod k prověření."
response = "Brát společný znak jako varovný signál, který odůvodňuje prověrku, a závěr o podvodu stavět až na znacích, které poctivé nabídky nemají."

[[pattern.trainer]]
utterance = "Každá látka na tomto seznamu je ve sportu zakázaná. Látka nalezená ve vzorku je na seznamu uvedena, takže je zakázaná."
context = "Člen disciplinární komise vysvětluje závěr komise."
benign = true
marker = "Střední termín (látka na seznamu) je v první premise vztažen na všechny látky na seznamu, je tedy rozložený a závěr platně plyne."
response = "Platný sylogismus: spor se může vést jen o pravdivost premis, tedy o správnost seznamu a o spolehlivost analýzy vzorku."

