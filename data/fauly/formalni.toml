[[pattern.trainer]]
utterance = "Terapie má být prostor, kde se nikdo nehodnotí. Vaše výtka k mému postupu je hodnocení, takže do terapie nepatří."
context = "Terapeut odpovídá klientce, která si stěžuje na průběh sezení."
benign = false
marker = "Slovo „hodnocení“ znamená v první premise posuzování klienta, ve druhé zpětnou vazbu k práci terapeuta; úsudek má čtyři termíny místo tří."
response = "Rozlišit oba významy: zásada nehodnotit klienta neříká nic o právu klienta posoudit postup odborníka a stížnost je třeba vyřídit věcně."

[[pattern.trainer]]
utterance = "Zákon chrání svobodný projev. Šíření smyšlených obvinění o sousedech je také projev, takže je zákonem chráněné."
context = "Účastník sporu v obecní diskusní skupině."
benign = false
marker = "„Projev“ v první premise je právně vymezená svoboda s mezemi, ve druhé jakékoli sdělení; střední termín mění význam a závěr neplyne."
response = "Zeptat se, v jakém smyslu se slovo užívá v každé premise; svoboda projevu v právním smyslu nezahrnuje vše, co je sdělením."

[[pattern.trainer]]
utterance = "Normální v lékařském smyslu znamená v rozmezí referenčních hodnot. Vaše hodnota v něm je, takže je v tomto smyslu normální; jak se cítíte, to ale neříká."
context = "Lékař vysvětluje pacientce výsledek krevního testu."
benign = true
marker = "Klíčové slovo je výslovně definováno a v celém úsudku se užívá v jednom významu; mluvčí sám označí, co z úsudku neplyne."
response = "Platný úsudek: termín si drží jeden význam a mluvčí odděluje laboratorní normu od prožívání pacientky."
