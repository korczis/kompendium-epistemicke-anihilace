[[pattern.trainer]]
utterance = "Kdo něco skrývá, ten se při výslechu vyhýbá pohledu do očí. Svědek se celou dobu díval do stolu, takže je jasné, že něco skrývá."
context = "Vyšetřovatel shrnuje dojem z podání vysvětlení."
benign = false
marker = "Z tvrzení, že skrývání vede k uhýbání pohledem, se usuzuje obráceně; uhýbání pohledem však mohou způsobit i stres, stud nebo kulturní zvyklost."
response = "Zeptat se, jak často se týž znak objevuje u lidí, kteří nic neskrývají; znak, který vzniká i bez hledané příčiny, ji sám nedokládá."

[[pattern.trainer]]
utterance = "Kdyby ten přípravek opravdu působil, pacientům by se během měsíce ulevilo. Ulevilo se jim, takže přípravek funguje."
context = "Příspěvek v diskusi o doplňku stravy pro lidi s chronickou bolestí."
benign = false
marker = "Úleva je důsledkem, který by nastal i při přirozeném kolísání obtíží, očekávání nebo současné léčbě; její výskyt předchůdce nepotvrzuje."
response = "Ptát se, co by se stalo bez přípravku: srovnávací skupina nebo jiný doklad musí vyloučit ostatní cesty k úlevě."

[[pattern.trainer]]
utterance = "Tyto nálezy by odpovídaly zánětu, ale stejně tak dvěma jiným příčinám. Zánět je zatím nejpravděpodobnější, zítra ho ověříme krevním testem."
context = "Lékařka vysvětluje pacientovi předběžnou diagnózu."
benign = true
marker = "Úsudek od nálezu k příčině je podán jako pravděpodobnostní hypotéza, výslovně se zvažují jiné příčiny a následuje ověření, ne jako dedukce."
response = "Legitimní úsudek k nejlepšímu vysvětlení: nepředstírá jistotu, jmenuje alternativy a nechává se opravit dalším testem."

