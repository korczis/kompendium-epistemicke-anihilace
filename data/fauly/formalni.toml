[[pattern.trainer]]
utterance = "Každý, kdo zfalšoval ten výkaz, musel mít přístup do účetního systému. Kolegyně z fakturace do systému přístup má, takže výkaz zfalšovala ona."
context = "Vedoucí oddělení na poradě shrnuje interní šetření."
benign = false
marker = "Závěr stojí jen na znaku, který s hledaným pachatelem sdílí každý, kdo má přístup; stavba úsudku závěr nezaručuje ani při pravdivých premisách."
response = "Ukázat stejnou formu s jiným obsahem, kde premisy platí a závěr zjevně ne, a žádat doklad, který odliší pachatele od ostatních lidí s přístupem."

[[pattern.trainer]]
utterance = "Ten argument je postavený na logické chybě, takže jeho závěr je nepravdivý a o návrhu už nemusíme jednat."
context = "Člen komise reaguje na návrh, jehož zdůvodnění obsahovalo neplatný úsudek."
benign = false
marker = "Z neplatnosti jednoho zdůvodnění se vyvozuje nepravdivost závěru; neplatný úsudek však závěr jen nechává nedoloženým, nevyvrací ho."
response = "Oddělit hodnocení zdůvodnění od hodnocení závěru: vadné zdůvodnění odmítnout a zeptat se, zda pro návrh existují jiné, platné důvody."

[[pattern.trainer]]
utterance = "Kdyby byl výkaz zfalšovaný tímto způsobem, musel by se lišit od bankovního výpisu. Neliší se od něj, takže tímto způsobem zfalšovaný není."
context = "Auditor vysvětluje výsledek porovnání dokladů."
benign = true
marker = "Úsudek popírá důsledek podmínky, a ne její předchůdce; tato forma je platná a sporná může být jen pravdivost samotné podmínky."
response = "Jde o platný úsudek: pokud podmínka i zjištění obstojí, závěr plyne. Diskutovat lze jen o tom, zda podmínka nepřehlíží jiný způsob falšování."

