[[pattern.trainer]]
utterance = "Každý, kdo má přístup k serveru s osobními údaji, podepsal mlčenlivost. Brigádníci k serveru přístup nemají, takže žádný z nich mlčenlivost nepodepsal."
context = "Správce systému odpovídá na otázku pověřence pro ochranu osobních údajů."
benign = false
marker = "Závěr se vyjadřuje o všech, kdo podepsali mlčenlivost, ale premisa mluví jen o těch s přístupem; mlčenlivost mohli podepsat i lidé bez přístupu."
response = "Ověřit evidenci podpisů přímo; z premis plyne jen to, že brigádníci nejsou mezi lidmi s přístupem, ne nic o jejich podpisech."

[[pattern.trainer]]
utterance = "Všichni lékaři tohoto oddělení prošli kurzem resuscitace. Sanitáři lékaři nejsou, takže kurzem resuscitace neprošel nikdo z nich."
context = "Diskuse o personálním zajištění noční služby."
benign = false
marker = "Termín „ti, kdo prošli kurzem“ je v závěru vztažen na všechny absolventy kurzu, kdežto v premise jen na lékaře; kurz mohli absolvovat i jiní."
response = "Zjistit, kdo kurz skutečně absolvoval; z toho, kdo kurz povinně má, nelze vyvodit, kdo ho nemá."

[[pattern.trainer]]
utterance = "Každý, kdo podepsal mlčenlivost, má do archivu přístup. Žádný externista do archivu přístup nemá, takže mlčenlivost nepodepsal žádný externista."
context = "Správce archivu vysvětluje stav evidence auditorovi."
benign = true
marker = "Termín „ti, kdo podepsali mlčenlivost“ je rozložený už v první premise, kde mluví o všech signatářích; závěr ho tedy rozšiřuje oprávněně."
response = "Platný sylogismus: pokud obě premisy platí, závěr plyne. Ověřovat lze jen pravdivost premis, tedy úplnost evidence přístupů."

