[[pattern.trainer]]
utterance = "Všechny případy, které kontrola letos odhalila, byly podvody. Všechny odhalené případy se týkaly žadatelů z jednoho kraje. Takže všichni žadatelé z toho kraje podvádějí."
context = "Zastupitel komentuje výroční zprávu kontrolního odboru."
benign = false
marker = "Premisy mluví jen o odhalených případech, závěr o všech žadatelích z kraje; menší termín se v závěru rozšiřuje na celek, o němž premisy nic neříkají."
response = "Zeptat se, kolik žadatelů z kraje bylo kontrolováno a jak se vybírali; z odhalených případů plyne nanejvýš to, že někteří žadatelé podváděli."

[[pattern.trainer]]
utterance = "Všechny oběti té série telefonických podvodů byly mimořádně důvěřivé. Všechny oběti byly senioři. Takže senioři jsou mimořádně důvěřiví."
context = "Komentář v místním zpravodaji k sérii podvodů."
benign = false
marker = "Premisy popisují jen oběti, závěr všechny seniory; menší termín se v závěru vztahuje na celou skupinu, o jejíž většině premisy nic neříkají."
response = "Zeptat se na seniory, kteří podvodníkům nenaletěli; z vlastností obětí plyne nanejvýš to, že někteří senioři byli důvěřiví, ne soud o celé generaci."

[[pattern.trainer]]
utterance = "Všechny případy odhalené letos byly podvody a všechny se týkaly žadatelů z jednoho kraje. Někteří žadatelé z toho kraje tedy podváděli; víc o nich z toho nevyplývá."
context = "Analytička kontrolního odboru shrnuje výroční zprávu."
benign = true
marker = "Závěr je omezen na „některé“, což premisy o skutečně odhalených případech unesou; menší termín se nerozšiřuje na všechny žadatele."
response = "Platný a opatrný úsudek: závěr nepřekračuje rozsah premis a výslovně odmítá zobecnění na celý kraj."

