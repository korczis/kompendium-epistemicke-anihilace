[[pattern.trainer]]
utterance = "Kdyby tě uhodil, bylo by to násilí. Jenže on tě nikdy neuhodil, takže to, co doma dělá, žádné násilí není."
context = "Známá komentuje vztah, v němž partner kontroluje peníze, telefon a kontakty druhé osoby."
benign = false
marker = "Z toho, že úder k závěru stačí, se vyvozuje, že bez úderu závěr neplatí; násilí však může mít i jiné podoby, například kontrolu a izolaci."
response = "Zeptat se, zda je uvedená podmínka jedinou cestou k závěru; nátlakovou kontrolu lze popsat a doložit i bez fyzického napadení."

[[pattern.trainer]]
utterance = "Když máte lékařskou zprávu s diagnózou, náleží vám úprava pracovní doby. Zprávu s diagnózou nemáte, takže vám žádná úprava nepřísluší."
context = "Personalista odpovídá zaměstnankyni, která pečuje o nemocného rodiče."
benign = false
marker = "Jeden důvod nároku se vydává za jediný možný; z jeho nesplnění se usuzuje na neexistenci nároku, přestože pravidla mohou znát i jiné důvody."
response = "Ověřit, zda je podmínka v pravidlech uvedena jako postačující, nebo jako nutná; jen nutná podmínka dovoluje z jejího nesplnění něco vyvodit."

[[pattern.trainer]]
utterance = "Do laboratoře smí jen ten, kdo absolvoval bezpečnostní školení. Školení jste zatím neabsolvoval, takže vás dovnitř pustit nemůžeme."
context = "Vedoucí laboratoře mluví s novým kolegou."
benign = true
marker = "Podmínka je formulována jako nutná („jen ten, kdo“); úsudek z jejího nesplnění je proto platný a nejde o popření předchůdce."
response = "Platný úsudek: nutná podmínka chybí, takže závěr plyne. Lze se nanejvýš ptát, zda pravidlo opravdu zní takto přísně."

