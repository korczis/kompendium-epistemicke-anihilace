[[pattern.trainer]]
utterance = "Náš program synchronizuje kvantové frekvence mozku s epigenetickými vzorci, a proto je jeho účinnost vědecky nezpochybnitelná."
context = "Reklama na víkendový seminář osobního rozvoje."
benign = false
marker = "Odborné termíny z nesouvisejících oborů se skládají bez vymezení a místo dat se uvádí jejich zvuk jako doklad."
response = "Žádat, co přesně termíny znamenají, jak se měřily a kde je publikované srovnání; bez toho tvrzení nic netvrdí."

[[pattern.trainer]]
utterance = "Vaše úzkost je jen dysregulace dopaminergní osy, takže diskuse o tom, jak se s vámi doma jedná, je zbytečná."
context = "Partner uzavírá rozhovor o konfliktech odkazem na článek o neurovědách."
benign = false
marker = "Neurovědní slovník se používá k ukončení rozhovoru o zkušenosti a k přesunu odpovědnosti na biologii druhého."
response = "Odmítnout, aby biologický popis nahradil posouzení vztahu; obě roviny se mohou týkat téhož a žádná druhou neruší."

[[pattern.trainer]]
utterance = "Odborně se tomu říká regrese k průměru; jednoduše řečeno, po výjimečně špatném měření bývá další bližší obvyklé hodnotě."
context = "Statistik vysvětluje novinářům kolísání výsledků."
benign = true
marker = "Odborný termín se zavádí a hned vysvětluje běžným jazykem, takže ho lze ověřit a zpochybnit."
response = "Platné užití terminologie: pojem je vymezený, přeložený a slouží porozumění, ne zastrašení."

