[[pattern.trainer]]
utterance = "Můj děda kouřil celý život a dožil se devadesáti let, takže ty řeči o škodlivosti kouření jsou přehnané."
context = "Rozhovor v rodině o odvykání kouření."
benign = false
marker = "Jeden živý případ se staví proti statistice velkých souborů, jako by výjimka vyvracela zvýšené riziko."
response = "Rozlišit riziko od jistoty: zvýšené riziko nikdy neznamená, že onemocní každý, a jeden případ o četnosti nic neříká."

[[pattern.trainer]]
utterance = "Znám tři lidi, kterým ta terapie pomohla, takže kdo o její účinnosti pochybuje, nezná realitu."
context = "Přednáška alternativního terapeuta."
benign = false
marker = "Několik vybraných příběhů se podává jako důkaz účinnosti a pochybnost se odbývá odkazem na osobní zkušenost."
response = "Ptát se na ty, kterým nepomohla, na srovnání s neléčenými a na to, jak byly příběhy vybrány."

[[pattern.trainer]]
utterance = "U tohoto pacienta se po léku objevila neobvyklá reakce; hlásím ji jako podezření, aby se dalo zjistit, zda se opakuje i jinde."
context = "Lékař vyplňuje hlášení nežádoucího účinku."
benign = true
marker = "Jednotlivý případ se používá jako signál k ověření, ne jako důkaz obecného závěru."
response = "Platné: kazuistika a hlášení jednotlivých případů jsou legitimní zdroj hypotéz, které se pak ověřují systematicky."

