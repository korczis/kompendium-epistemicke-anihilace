[[pattern.trainer]]
utterance = "Většina zaměstnanců v oboru pracuje přesčas bez proplacení, takže tak to u nás má fungovat i nadále."
context = "Personalista odpovídá na stížnost na neproplacené přesčasy."
benign = false
marker = "Ze statistického popisu praxe se přímo vyvozuje norma; chybí premisa, proč by běžná praxe měla být závazná."
response = "Vyslovit chybějící premisu a ptát se, zda ji mluvčí skutečně zastává; teprve pak o ní lze věcně diskutovat."

[[pattern.trainer]]
utterance = "Vždycky se to tak dělalo a lidé to tak chtějí, takže to tak správně je."
context = "Starosta odmítá změnu pravidel obecní zakázky."
benign = false
marker = "Dvě popisná tvrzení (tradice a přání) se podávají jako dostatečný důvod normativního závěru bez hodnotící premisy."
response = "Rozlišit, co se děje a co lidé chtějí, od toho, co je správné, a žádat zdůvodnění právě té třetí části."

[[pattern.trainer]]
utterance = "Lék snižuje riziko komplikací a pacientka si přeje komplikacím předejít, proto jí ho doporučuji."
context = "Lékařka zdůvodňuje doporučení léčby v propouštěcí zprávě."
benign = true
marker = "Normativní závěr opírá o výslovnou hodnotící premisu (přání pacientky) spolu s fakty o účinku."
response = "Platný praktický úsudek: hodnotící premisa je vyslovená a dá se zpochybnit, není propašovaná."

