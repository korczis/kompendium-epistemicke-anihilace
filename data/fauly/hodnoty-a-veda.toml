[[pattern.trainer]]
utterance = "Existují studie pro i proti, takže věda v téhle otázce nemá jasno a je to padesát na padesát."
context = "Politik odpovídá na dotaz k regulaci znečištění."
benign = false
marker = "Z pouhé existence studií na obou stranách se vyvozuje rovnováha; počet, kvalita a váha studií se nezvažují."
response = "Ptát se, kolik studií je na které straně, jak jsou kvalitní a co říkají systematické přehledy, ne jen zda nějaké existují."

[[pattern.trainer]]
utterance = "Máme deset studií, které účinek našly, a jen tři, které ne, takže účinek je prokázaný."
context = "Výrobce doplňku stravy v tiskové zprávě."
benign = false
marker = "Rozhodnutí se dělá počítáním hlasů studií bez ohledu na jejich velikost, kvalitu a publikační zkreslení."
response = "Žádat vážené shrnutí: velké a kvalitní studie mají větší váhu a neúspěšné studie často zůstávají nepublikované."

[[pattern.trainer]]
utterance = "Systematický přehled zvážil velikost a kvalitu všech dostupných studií a převážná váha důkazů ukazuje na malý, ale skutečný účinek."
context = "Shrnutí doporučení odborné společnosti."
benign = true
marker = "Závěr stojí na váženém zhodnocení celku, ne na pouhé existenci nebo počtu studií."
response = "Platné: váha důkazů se určuje kvalitou a velikostí studií a zohledňuje i ty, které účinek nenašly."

