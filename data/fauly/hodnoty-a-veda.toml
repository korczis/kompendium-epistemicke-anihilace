[[pattern.trainer]]
utterance = "Soutěž mezi lidmi je stejně přirozená jako soutěž mezi zvířaty, a proto je správné, aby slabší v naší firmě prostě odpadli."
context = "Vedoucí obhajuje na poradě plošné propouštění bez sociálního programu."
benign = false
marker = "Z tvrzení o tom, co se v přírodě děje, se bez dalšího zdůvodnění vyvozuje, co je správné; hodnotící premisa chybí."
response = "Oddělit popis od hodnocení a žádat výslovné zdůvodnění, proč by to, co je přirozené, mělo být i spravedlivé."

[[pattern.trainer]]
utterance = "Dobré je přece to, co lidem přináší slast, a tahle aplikace jim slast přináší, takže o její dobrotě není co diskutovat."
context = "Produktový manažer odmítá etickou revizi návykového designu aplikace."
benign = false
marker = "Pojem dobra se definicí ztotožní s přirozenou vlastností (slastí), a otázka, zda je slastné také dobré, se tím prohlásí za uzavřenou."
response = "Ukázat, že otázka zůstává smysluplná: dává smysl ptát se, zda je dobré i to, co přináší slast, takže definice spor nerozhodla."

[[pattern.trainer]]
utterance = "Kojení má podle dostupných studií zdravotní přínosy, ale to, že je přirozené, samo nic nedokazuje; přínosy dokládají data, ne přirozenost."
context = "Pediatr vysvětluje rodičům doporučení a zároveň odmítá moralizování vůči matkám, které nekojí."
benign = true
marker = "Hodnocení se opírá o doložené důsledky a mluvčí výslovně odmítá, aby přirozenost sama sloužila jako důvod."
response = "Platná argumentace: hodnotící závěr stojí na výslovné premise o zdraví a na datech, ne na přirozenosti."

