[[pattern.trainer]]
utterance = "Tuhle bylinnou směs používali léčitelé po tisíce let, takže je jistě účinnější než léky, které existují pár desetiletí."
context = "Prodejce doplňků stravy na přednášce pro seniory."
benign = false
marker = "Stáří praxe se podává jako doklad účinnosti; chybí srovnání výsledků a otázka, proč se praxe udržela."
response = "Ptát se, jak by staletí užívání odlišila účinek od přirozeného průběhu nemoci, a žádat srovnávací data."

[[pattern.trainer]]
utterance = "Naše učení pochází ze starověkého tajného spisu, a proto nemusí obstát před dnešními metodami, které jsou jen módou."
context = "Vedoucí duchovního kurzu odpovídá na kritický dotaz účastníka."
benign = false
marker = "Starobylost se používá jako štít proti přezkoumání a soudobé ověřování se předem znehodnocuje jako móda."
response = "Oddělit původ od platnosti: starý i nový obsah se posuzuje stejnými měřítky a výjimka pro starobylé učení není zdůvodněná."

[[pattern.trainer]]
utterance = "Tohle pravidlo silničního provozu platí desítky let a za tu dobu se jeho přínos opakovaně měřil, takže ho neměníme bez nových dat."
context = "Úředník dopravního odboru odpovídá na návrh změny."
benign = true
marker = "Dlouhé trvání se uvádí jen spolu s opakovaným měřením výsledků; argumentem jsou data, ne stáří."
response = "Platné: dlouhá zkušenost je důkazem, když byla průběžně vyhodnocována a když je známo, co se měřilo."

