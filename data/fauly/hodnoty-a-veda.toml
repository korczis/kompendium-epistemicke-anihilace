[[pattern.trainer]]
utterance = "Po třech sezeních se mi bolest zad zmírnila, takže metoda prokazatelně funguje a doporučím ji všem."
context = "Recenze terapeutické služby na internetu."
benign = false
marker = "Zlepšení po zásahu se připisuje specifickému účinku metody bez srovnání s přirozeným průběhem, očekáváním a regresí."
response = "Ptát se, zda by se bolest zmírnila i bez metody nebo s napodobeninou zásahu; to rozhodne jen srovnání se skupinou bez metody."

[[pattern.trainer]]
utterance = "I kdyby to byl jen placebo efekt, pacientům to pomáhá, takže je správné naši léčbu dál prodávat za plnou cenu jako účinnou."
context = "Poskytovatel alternativní léčby reaguje na negativní výsledky kontrolované studie."
benign = false
marker = "Po neúspěchu specifického tvrzení se tvrzení mění na obecné ‚pomáhá to‘, ale propagace a cena zůstávají vázány na původní tvrzení."
response = "Upozornit na posun tvrzení a na otázky informovaného souhlasu; očekávací účinky nejsou vlastností konkrétní metody."

[[pattern.trainer]]
utterance = "Ve skupině s lékem i ve skupině s placebem se stav zlepšil; lék tedy účinkuje jen tolik, o kolik je zlepšení větší než u placeba."
context = "Výklad výsledků klinické studie studentům medicíny."
benign = true
marker = "Účinek se odhaduje rozdílem proti kontrolní skupině, ne zlepšením po léčbě samotným."
response = "Platné: srovnání s placebem odděluje specifický účinek od očekávání, přirozeného průběhu a regrese k průměru."
