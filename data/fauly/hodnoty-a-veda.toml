[[pattern.trainer]]
utterance = "Studie o rozdílech v agresivitě mezi skupinami nemůže být pravdivá, protože by ji někdo mohl zneužít k diskriminaci."
context = "Člen etické komise odmítá posoudit metodiku výzkumu."
benign = false
marker = "Z toho, že by závěr byl morálně nežádoucí nebo zneužitelný, se vyvozuje, že je nepravdivý; metodika se neposuzuje."
response = "Oddělit otázku pravdivosti od otázky užití: posoudit metodiku a zvlášť diskutovat, jak výsledky interpretovat a chránit."

[[pattern.trainer]]
utterance = "Lidé by měli být od přírody laskaví, takže zprávy o šikaně na této škole musí být přehnané."
context = "Ředitel školy reaguje na stížnost rodičů."
benign = false
marker = "Normativní představa, jací by lidé měli být, se používá jako důkaz o tom, co se skutečně stalo."
response = "Trvat na prošetření faktů nezávisle na tom, jak by svět měl vypadat; ideál není doklad."

[[pattern.trainer]]
utterance = "Ten výsledek se mi nelíbí a bojím se jeho zneužití, ale nejdřív ověříme, zda platí, a pak budeme řešit, jak o něm psát."
context = "Vedoucí výzkumné skupiny na interní poradě."
benign = true
marker = "Mluvčí přiznává morální nepohodlí, ale výslovně ho odděluje od posouzení pravdivosti."
response = "Platný postoj: hodnotové obavy vstupují do rozhodnutí o komunikaci, ne do rozhodnutí o tom, co je pravda."

