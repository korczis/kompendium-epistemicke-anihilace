[[pattern.trainer]]
utterance = "Vyšla studie, že káva prodlužuje život, takže všechny dosavadní pochybnosti o kávě jsou definitivně vyvráceny."
context = "Titulek a perex populárního webu."
benign = false
marker = "Jediný výsledek se podává jako konečné rozhodnutí sporu a starší výzkum se mlčky ruší."
response = "Ptát se, jak výsledek zapadá do souhrnu dosavadních studií, jaký byl design a zda byl zopakován."

[[pattern.trainer]]
utterance = "Jedna studie tvrdí, že očkování škodí, a dokud ji nikdo nevyvrátí, nemůžete tvrdit, že je bezpečné."
context = "Diskusní příspěvek pod článkem o očkovací kampani."
benign = false
marker = "Jediná studie se staví proti souboru důkazů a důkazní břemeno se přesouvá na celý obor."
response = "Posoudit váhu jedné studie vůči souhrnům a přehledům a zjistit, zda nebyla stažena nebo vyvrácena opakováním."

[[pattern.trainer]]
utterance = "Nová studie naznačuje přínos, ale jde o první výsledek na malém vzorku; doporučení změníme, až ho potvrdí nezávislé opakování."
context = "Odborná společnost komentuje novou publikaci."
benign = true
marker = "Výsledek se zařazuje do kontextu a závěr je přiměřeně opatrný, s výslovnou podmínkou replikace."
response = "Platné: jedna studie se bere jako důvod k dalšímu ověření, ne jako rozhodnutí."

