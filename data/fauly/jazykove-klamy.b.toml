[[pattern.trainer]]
utterance = "Řada odborníků se shoduje, že náš doplněk může přispět k podpoře imunity a pomáhá až o polovinu rychleji zvládat sezónní únavu."
context = "Reklamní leták na doplněk stravy rozdávaný v lékárně."
benign = false
marker = "Nepojmenovaní „odborníci“, slovesa „může přispět“ a „pomáhá“ a horní mez „až o polovinu“ vytvářejí dojem silného účinku, ale netvrdí nic, co by šlo vyvrátit."
response = "Ptát se, kdo přesně co zjistil, u kolika lidí a ve srovnání s čím; dokud chybí jméno studie a velikost účinku, výrok nedokládá žádný účinek."

[[pattern.trainer]]
utterance = "Dvě randomizované studie s celkem zhruba čtyřmi sty účastníky nenašly rozdíl oproti placebu; menší třetí studie malý účinek zaznamenala. Důkazy jsou zatím slabé."
context = "Lékárnice odpovídá zákazníkovi na otázku po témže doplňku."
benign = true
marker = "Výhrada „zatím slabé“ je spojena s konkrétním popisem důkazů, takže nejistota je pojmenovaná, a ne využitá k zamlžení."
response = "Legitimní opatrnost: zdrženlivé formulace tu přesně odpovídají kvalitě důkazů a lze je ověřit podle uvedených studií."

