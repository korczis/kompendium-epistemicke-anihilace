[[pattern.trainer]]
utterance = "Rada města dnes odsouhlasila další drancování veřejné pokladny, když její klika poslala peníze svým kamarádům z neziskovek."
context = "Komentář na zpravodajském webu k rozhodnutí o grantech pro místní spolky."
benign = false
marker = "Slova „drancování“, „klika“ a „kamarádi“ předem vynášejí verdikt o nekalosti, aniž text uvádí jediný fakt o tom, kdo peníze dostal a podle jakých pravidel."
response = "Přeložit sdělení do neutrálního popisu (rada schválila granty spolkům) a ptát se po faktech, která by teprve mohla oprávnit tvrzení o protekci nebo zneužití."

[[pattern.trainer]]
utterance = "Rada města schválila granty dvanácti spolkům. Tři z nich vede příbuzný radního, který o grantech hlasoval; podle jednacího řádu se měl hlasování zdržet."
context = "Zpravodajský článek o témže rozhodnutí."
benign = true
marker = "Kritické hodnocení stojí na uvedených a ověřitelných faktech a na pravidle, které bylo porušeno; slova sama verdikt nenesou."
response = "Legitimní kritika: obvinění ze střetu zájmů je doložené a čtenář může fakta i pravidlo nezávisle ověřit."

