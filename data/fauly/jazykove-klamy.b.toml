[[pattern.trainer]]
utterance = "Spravedlivé je prostě to, co schválí většina. Tenhle zákon schválila většina, takže otázka, jestli je spravedlivý, nedává smysl."
context = "Diskuse studentů práv o zákoně, který omezuje práva menšiny."
benign = false
marker = "Hodnotový pojem „spravedlivé“ je ztotožněn s jinou vlastností (schválením většinou), čímž se otázka po spravedlnosti zákona předem uzavírá."
response = "Zeptat se, zda dává smysl otázka „je spravedlivé všechno, co schválí většina?“; když ano, obě vlastnosti nejsou totéž a spravedlnost zákona je třeba teprve doložit."

[[pattern.trainer]]
utterance = "Navrhuji, abychom v posudku pod pojmem „dostupnost péče“ rozuměli dojezdové době do třiceti minut; je to jen jedno měřítko a neříká nic o kvalitě péče."
context = "Člen pracovní skupiny ministerstva navrhuje ukazatel pro analýzu sítě nemocnic."
benign = true
marker = "Pracovní definice je výslovně omezená, nepředstírá, že vyčerpává obsah pojmu, a ponechává otevřené hodnocení, které měřítko nepostihuje."
response = "Legitimní operacionalizace: měřítko se zavádí otevřeně jako zjednodušení, které lze kritizovat a doplnit jinými ukazateli."
