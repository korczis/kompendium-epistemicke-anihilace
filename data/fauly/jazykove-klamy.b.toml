[[pattern.trainer]]
utterance = "Skutečná loajalita k týmu znamená nikdy nezpochybňovat rozhodnutí vedoucího. Kdo se ptá, proč to děláme, ten loajální prostě není."
context = "Vedoucí oddělení na poradě reaguje na kolegyni, která se zeptala na důvody reorganizace."
benign = false
marker = "Kladně zabarvené slovo „loajalita“ dostává nový, úzký obsah (bezpodmínečný souhlas), takže otázka se bez dalšího argumentu ocitá na straně nelojality."
response = "Oddělit slovo od jeho nového obsahu: zeptat se, proč by loajalita měla vylučovat otázky, a připomenout běžný význam, v němž loajální člověk upozorňuje na problémy."

[[pattern.trainer]]
utterance = "Pro účely této studie označujeme jako pravidelné cvičení aspoň tři třicetiminutové tréninky týdně; ostatní respondenty řadíme do skupiny nepravidelně cvičících."
context = "Metodická část výzkumné zprávy o pohybové aktivitě."
benign = true
marker = "Definice je výslovně ohlášená, omezená na účel studie a hodnotově neutrální; nikdo z ní nevyvozuje, že kdo cvičí méně, je horší člověk."
response = "Jde o legitimní upřesňující definici: je zveřejněná předem, lze ji kritizovat a výsledky lze přepočítat při jiné hranici."

