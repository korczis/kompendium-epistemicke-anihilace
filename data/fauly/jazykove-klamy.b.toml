[[pattern.trainer]]
utterance = "Sama ředitelka nemocnice na konferenci řekla: „Tahle léčba pacientům škodí.“ Víc k tomu snad není co dodat."
context = "Příspěvek na sociální síti; v záznamu ředitelka pokračovala: „…pokud se podává bez předchozího vyšetření ledvin, a proto ho zavádíme povinně.“"
benign = false
marker = "Citát končí uprostřed věty a vynechává podmínku, která obrací jeho smysl; z varování před chybným postupem se stává odmítnutí léčby."
response = "Vyhledat celý záznam nebo přepis, číst větu až do konce a posuzovat, co mluvčí tvrdil v celém kontextu, ne v nejkratším úryvku."

[[pattern.trainer]]
utterance = "Ředitelka uvedla, že léčba „pacientům škodí, pokud se podává bez předchozího vyšetření ledvin“, a nemocnice proto vyšetření zavádí povinně. Celý záznam je v odkazu."
context = "Zpráva regionálního zpravodajství o téže konferenci."
benign = true
marker = "Citát zachovává podmínku, uvádí, k čemu se vztahuje, a odkazuje na úplný zdroj, takže čtenář může shodu ověřit."
response = "Legitimní zkrácení: krácení citátu je v pořádku, dokud nemění smysl výroku a zdroj je dostupný ke kontrole."

