[[pattern.trainer]]
utterance = "Nešlo o žádné bití. Byla to jen výchovná korekce, když se syn choval nepřijatelně, a ty modřiny vznikly spíš nešťastnou souhrou okolností."
context = "Otec vysvětluje sociální pracovnici modřiny na těle dítěte."
benign = false
marker = "Zjemňující výrazy („výchovná korekce“, „nešťastná souhra okolností“) nahrazují popis jednání a z popisu mizí ten, kdo jednal, i to, co dítě utrpělo."
response = "Vrátit se k popisu jednání: kdo co udělal, čím a s jakým následkem; posouzení se má opírat o lékařský nález a výpověď dítěte, ne o zvolené pojmenování."

[[pattern.trainer]]
utterance = "Je mi líto, váš otec dnes v noci zemřel. Odešel klidně, sestra u něj byla a bolesti neměl."
context = "Lékař na oddělení oznamuje úmrtí pacienta jeho dceři."
benign = true
marker = "Zjemňující slovo „odešel“ následuje až po jasném sdělení „zemřel“, takže ohleduplnost nic nezastírá a fakta zůstávají úplná."
response = "Legitimní užití: šetrné vyjádření slouží citu příjemce, ale nezakrývá skutečnost, kterou má člověk znát."

