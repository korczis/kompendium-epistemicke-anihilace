[[pattern.trainer]]
utterance = "Náš program prokazatelně zlepšuje kvalitu života seniorů. Kdo tvrdí opak, ať nám ukáže jediného účastníka, kterému se život ničím nezlepšil."
context = "Zástupce soukromé agentury obhajuje na zasedání obce žádost o dotaci pro svůj program."
benign = false
marker = "Výraz „kvalita života“ není vymezen žádným měřítkem, takže tvrzení o zlepšení nelze ověřit ani vyvrátit; každá drobná změna se dá vydávat za doklad."
response = "Zeptat se, čím agentura kvalitu života měří, jaké hodnoty byly před programem a po něm a ve srovnání s jakou skupinou; bez toho tvrzení o účinku nic nedokládá."

[[pattern.trainer]]
utterance = "Pro tuto zprávu počítáme jako zlepšení kvality života nárůst skóre dotazníku o alespoň pět bodů po šesti měsících; tohoto prahu dosáhlo 41 ze 120 účastníků."
context = "Hodnotící zpráva téhož programu, kterou zadala obec."
benign = true
marker = "Vágní pojem je pro účel zprávy zpřesněn ohlášenou definicí a výsledek je uveden v číslech, která lze zkontrolovat a kritizovat."
response = "Legitimní zacházení s vágním pojmem: zpřesnění je výslovné, práh lze zpochybnit a výsledek lze přepočítat při jiné hranici."

[[pattern.trainer]]
utterance = "Slíbil jste, že přijdete brzy. Přišel jste v sedm a dvě minuty, tedy ne brzy, takže jste slib porušil a nemáte nárok na odměnu za večer."
context = "Pořadatel spolkového večera odmítá zaplatit dobrovolníkovi, který přišel dvě minuty po začátku příprav."
benign = false
marker = "Neurčitému slovu „brzy“ se dodatečně přiřadí přesná hranice, kterou nikdo předem nestanovil, a z jejího překročení se vyvozuje porušení dohody."
response = "Připomenout, že výraz žádnou přesnou hranici neměl, a zeptat se, zda dvě minuty v dané situaci něčemu skutečně uškodily; posouzení patří k tomu, co strany rozumně mínily."

