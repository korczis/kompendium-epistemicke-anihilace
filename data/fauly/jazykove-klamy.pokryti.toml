[[pattern.trainer]]
utterance = "Nikoho jsme nepropustili. Jen jsme dvaceti zaměstnancům nenabídli prodloužení smlouvy, takže o žádném snižování stavů nemůže být řeč."
context = "Mluvčí firmy odpovídá novinářce na dotaz, zda podnik po ztrátové sezóně snižuje počet zaměstnanců."
benign = false
marker = "Rozdíl mezi „propuštěním“ a „neprodloužením smlouvy“ je vydáván za podstatný, ale pro otázku po snižování stavů nic nemění: dvacet lidí v podniku dál nepracuje."
response = "Uznat, že právní forma ukončení se liší, a vrátit se k otázce samé: kolik lidí podnik po sezóně zaměstnává a proč jich je méně."

[[pattern.trainer]]
utterance = "Odstupné se liší: zaměstnanec propuštěný pro nadbytečnost má zákonný nárok na odstupné, kdežto u smlouvy na dobu určitou, která uplynula, tento nárok nevzniká."
context = "Pracovní právnička vysvětluje odborové organizaci rozdíl mezi oběma způsoby skončení pracovního poměru."
benign = true
marker = "Rozlišení je spojeno s konkrétním odlišným důsledkem, který lze ověřit v předpisu, a nepoužívá se k popření skutečnosti, že lidé o práci přišli."
response = "Legitimní rozlišení: uvádí, v čem se oba případy skutečně liší a pro jakou otázku je rozdíl podstatný."
