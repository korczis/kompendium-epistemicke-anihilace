[[pattern.trainer]]
utterance = "Každý z pěti léků, které pan doktor předepsal, je sám o sobě bezpečný, takže i jejich kombinace musí být bezpečná."
context = "Pacient odmítá konzultaci s klinickým farmaceutem."
benign = false
marker = "Vlastnost jednotlivých částí (bezpečnost samostatně užitého léku) se bez dalšího přenáší na celek, u něhož mohou vzniknout interakce."
response = "Rozlišit vlastnosti, které se sčítají, od vlastností, které vznikají až vzájemným působením částí, a bezpečnost kombinace posoudit samostatně."

[[pattern.trainer]]
utterance = "Každá z dvaceti beden váží nejvýš padesát kilogramů, takže náklad jako celek nepřekročí tunu, kterou výtah unese."
context = "Skladník plánuje přepravu nákladním výtahem."
benign = true
marker = "Hmotnost je vlastnost, která se z částí na celek prostě sčítá, takže přenos z částí na celek je zde oprávněný."
response = "Jde o platnou argumentaci: dvacet krát padesát kilogramů je nejvýš tuna a závěr plyne z aditivní povahy hmotnosti."

