[[pattern.trainer]]
utterance = "Do denního záznamu sestra napsala „Dnes pacient spolupracoval“ a to slovo „dnes“ podtrhla. Z toho je jasné, že jindy nespolupracuje."
context = "Porada týmu o propuštění pacienta; jiné záznamy o nespolupráci neexistují."
benign = false
marker = "Ze zvýraznění jednoho slova se vyvozuje tvrzení, které záznam neobsahuje a které není doloženo jinými záznamy."
response = "Oddělit, co záznam říká, od toho, co důraz naznačuje, a ověřit domněnku v ostatní dokumentaci nebo dotazem u autorky záznamu."

[[pattern.trainer]]
utterance = "V nadpisu zprávy je tučně „riziko klesá o polovinu“, ale v tabulce stojí, že jde o pokles z dvou případů na tisíc na jeden. Uvádím obě čísla vedle sebe."
context = "Lékař vysvětluje pacientce výsledky studie, o níž četla v novinách."
benign = true
marker = "Mluvčí důraz nadpisu nepřebírá, ale vrací do výkladu i údaj, který zvýraznění odsunulo."
response = "Jde o platnou argumentaci: relativní i absolutní údaj jsou podány stejně viditelně a závěr se opírá o oba."

