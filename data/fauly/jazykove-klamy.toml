[[pattern.trainer]]
utterance = "Trh si nepřeje, aby se mzdy v nemocnicích zvyšovaly, a proti vůli trhu nemá smysl se stavět."
context = "Vyjádření manažera k požadavkům zaměstnanců."
benign = false
marker = "Souhrnný název pro rozhodnutí mnoha lidí se líčí jako jednající bytost s vůlí, takže otázka, kdo konkrétně rozhoduje a proč, mizí."
response = "Přeložit výrok zpět na jednající osoby a mechanismy: kdo stanovuje mzdy, podle jakých pravidel a jaké jsou možnosti volby."

[[pattern.trainer]]
utterance = "Když v knize mluvím o dvou systémech myšlení, jde o zkratku pro dva typy procesů; nejsou to dvě místa v mozku ani dvě osoby v hlavě."
context = "Přednášející úvodem k výkladu teorie duálních procesů."
benign = true
marker = "Abstrakce je výslovně označena za pojmovou zkratku a mluvčí odmítá přisoudit jí samostatnou existenci."
response = "Jde o legitimní užití: metafora slouží výkladu a její meze jsou ohlášeny, takže se z ní nevyvozuje nic, co by platilo jen o věcech."

