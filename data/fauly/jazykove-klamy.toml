[[pattern.trainer]]
utterance = "Ta nemocnice je v žebříčku nejlepší v kraji, takže i její kardiologie musí být nejlepší kardiologií v kraji."
context = "Příbuzný vybírá pracoviště pro plánovaný zákrok."
benign = false
marker = "Hodnocení celku, které je průměrem mnoha oddělení, se přenáší na jednu jeho část, o níž samo nic neříká."
response = "Hledat údaje přímo o dané části (výsledky oddělení, počty výkonů), protože výborný celek může zahrnovat i průměrné části."

[[pattern.trainer]]
utterance = "Komise rozhodla většinou hlasů, takže z rozhodnutí neplyne, jak hlasoval kterýkoli jednotlivý člen; to ukáže až zápis o hlasování."
context = "Advokát odpovídá klientovi, který chce žalovat konkrétního člena komise."
benign = true
marker = "Mluvčí výslovně odmítá přenést vlastnost rozhodnutí celku na jednotlivé členy a odkazuje na údaj o částech."
response = "Jde o platnou argumentaci: o části se usuzuje z dokladu o části, ne z vlastnosti celku."

