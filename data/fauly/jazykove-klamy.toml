[[pattern.trainer]]
utterance = "Slovo terapie pochází z řeckého výrazu pro službu, takže terapeut je ve skutečnosti sluha klienta a má udělat cokoli, co si klient přeje."
context = "Klient zpochybňuje, že terapeut odmítl porušit pravidla terapeutického vztahu."
benign = false
marker = "Z historického původu slova se vyvozuje závazný dnešní význam i normativní důsledek pro jednání."
response = "Odlišit původ slova od jeho současného užití a od pravidel profese, která se odvozují z etiky a práva, ne z řečtiny."

[[pattern.trainer]]
utterance = "Slovo diagnóza kdysi znamenalo rozpoznání; dnes ho používáme pro závěr vyšetření, a v tomto dnešním významu ho píšeme i do zprávy."
context = "Vyučující vysvětluje medikům odbornou terminologii."
benign = true
marker = "Etymologie slouží jako zajímavost a výklad, ale význam termínu se určuje podle současného odborného užití."
response = "Jde o legitimní užití: původ slova se zmiňuje bez nároku, že by určoval, co termín znamená nebo co z něj plyne."
