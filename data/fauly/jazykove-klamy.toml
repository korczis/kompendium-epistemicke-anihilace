[[pattern.trainer]]
utterance = "Ve smlouvě stojí, že nájemce hradí škody způsobené zaměstnanci pronajímatele. Takže když pronajímatelův údržbář rozbije okno, platí to nájemce."
context = "Spor o výklad nájemní smlouvy."
benign = false
marker = "Tvar „zaměstnanci“ může být sedmý pád množného čísla (škody, které zaměstnanci způsobili) i třetí pád jednotného čísla (škody způsobené zaměstnanci); mluvčí mlčky volí výklad, který mu vyhovuje."
response = "Upozornit, že věta připouští dvě skladby, a hledat rozhodnutí v kontextu smlouvy, v jejím účelu a v jednání stran, ne v pohodlnějším čtení."

[[pattern.trainer]]
utterance = "Formulace „všichni pacienti nedostali lék“ je nejasná: může znamenat, že ho nedostal nikdo, nebo že ho nedostali všichni. Opravme ji v protokolu na jednoznačnou."
context = "Kontrola textu protokolu studie před odesláním etické komisi."
benign = true
marker = "Mluvčí dvojí skladbu odhaluje a odstraňuje, místo aby z ní vyvozoval závěr."
response = "Jde o platný postup: dvojznačná věta se před dalším usuzováním nahradí formulací s jedním čtením."

