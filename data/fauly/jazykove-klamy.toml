[[pattern.trainer]]
utterance = "Výsledek vašeho testu je negativní. A s negativními výsledky se u nás nic neoslavuje, takže byste měl počítat s horší zprávou."
context = "Laik vykládá příbuznému lékařskou zprávu, kterou sám nečetl celou."
benign = false
marker = "Slovo „negativní“ přechází mezi dvěma premisami z odborného významu (hledaný nález nebyl prokázán) do hodnotícího významu (špatný)."
response = "Rozlišit oba významy a ověřit, co výraz znamená ve zprávě samé: negativní test zde znamená, že nález nebyl zjištěn, což bývá dobrá zpráva."

[[pattern.trainer]]
utterance = "Rozdíl mezi skupinami je statisticky signifikantní, ale je malý; o tom, zda je významný i pro pacienty, musí rozhodnout klinická kritéria."
context = "Recenzent komentuje výsledky klinické studie."
benign = true
marker = "Mluvčí oba významy slova „významný“ výslovně odděluje a z jednoho neusuzuje na druhý."
response = "Jde o platnou argumentaci: termín má v celém výroku jeden ohlášený význam a druhý význam se posuzuje samostatně."

[[pattern.trainer]]
utterance = "Zákon zakazuje diskriminaci. Každé přijímací řízení diskriminuje mezi lepšími a horšími uchazeči. Zákon tedy ve skutečnosti zakazuje přijímací řízení."
context = "Diskuse o pracovním právu na odborném semináři."
benign = false
marker = "„Diskriminace“ znamená v první premise nezákonné rozlišování podle chráněného znaku, ve druhé jakékoli rozlišování."
response = "Ukázat, že v jednom významu je pravdivá jen první premisa a ve druhém jen druhá, takže závěr z nich neplyne."

