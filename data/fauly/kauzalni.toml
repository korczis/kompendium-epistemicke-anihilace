[[pattern.trainer]]
utterance = "Podívejte se na mapu: v téhle ulici měli rakovinu tři sousedé během deseti let a hned vedle stojí vysílač. Víc důkazů snad netřeba."
context = "Petice za odstranění vysílače mobilního operátora."
benign = false
marker = "Shluk se vybral až po prohlédnutí dat a hranice oblasti i období se nakreslily tak, aby ho obepínaly; chybí srovnání s očekávaným výskytem."
response = "Zeptat se, kolik podobných shluků by vzniklo náhodou ve stejně velkých oblastech bez vysílače a zda byla hypotéza stanovena před pohledem na data."

[[pattern.trainer]]
utterance = "Předem jsme v protokolu určili oblast, období a hranici pro poplach; teprve pak jsme spočítali výskyt a porovnali ho s celostátním očekáváním."
context = "Pracovník krajské hygienické stanice popisuje šetření hlášeného shluku onemocnění."
benign = true
marker = "Terč je stanoven před výstřelem: hypotéza, hranice a srovnávací míra jsou dány předem, ne podle toho, kde se data shlukují."
response = "Jde o správný postup: předem stanovená hypotéza a srovnání s očekáváním brání tomu, aby se náhodný shluk vydával za nález."

