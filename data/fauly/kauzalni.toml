benign = false
marker = "Mnohovrstevný jev se vysvětluje jedním řetězem příčin vedoucím přímo k jednoduchému opatření a jiné faktory se předem odbývají jako výmluvy."
response = "Ptát se, jaké další podmínky se na vývoji kriminality podílejí a co o účinku přísnějších trestů říkají data; jednoduchý řetěz je třeba zasadit do sítě příčin."

[[pattern.trainer]]
utterance = "Pro veřejnost to zjednoduším: hlavním důvodem rostoucí obezity je dostupnost levného kaloricky bohatého jídla, ale podílí se i pohyb, spánek, příjmy a genetika."
context = "Lékařka vysvětluje výsledky výzkumu v rozhlasovém pořadu."
benign = true
