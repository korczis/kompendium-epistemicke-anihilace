[[pattern.trainer]]
utterance = "Do kurzu jsme poslali deset obchodníků s nejhoršími čísly za čtvrtletí a další čtvrtletí měli skoro všichni lepší výsledky. Kurz zjevně funguje."
context = "Personální ředitel hodnotí vzdělávací program."
benign = false
marker = "Výběr podle mimořádně špatného výkonu a následné zlepšení se připisují zásahu, ačkoli by se extrémní výsledky k průměru vracely i bez něj."
response = "Zeptat se, jak se v dalším čtvrtletí vedlo srovnatelně slabým obchodníkům, kteří kurz nedostali; bez srovnávací skupiny nelze účinek oddělit od regrese k průměru."

[[pattern.trainer]]
utterance = "Pacienty zařazujeme podle dvou měření tlaku a výsledek léčby porovnáváme s kontrolní skupinou, protože při jednom vysokém měření se hodnoty často samy vracejí k obvyklé úrovni."
context = "Vedoucí klinické studie vysvětluje její design etické komisi."
benign = true
marker = "Regrese k průměru je předvídána a design studie ji odděluje od účinku léčby opakovaným měřením a kontrolní skupinou."
response = "Jde o správný postup: kontrolní skupina vybraná stejným způsobem zachytí regresi k průměru a o účinku vypovídá teprve rozdíl mezi skupinami."

