[[pattern.trainer]]
utterance = "Kdybys nebyla tak úzkostná a podezíravá, nemusel bych ti nic tajit. Moje mlčení je jen reakce na tvoje výslechy."
context = "Partner reaguje na otázky po zjištění, že skrývá dluhy."
benign = false
marker = "Následek (úzkost a otázky po odhalení tajemství) se vydává za příčinu tajení, takže odpovědnost přechází na toho, kdo na skutečnou příčinu reaguje."
response = "Vrátit se k časové ose: co bylo dřív, tajení, nebo otázky. Úzkost, která následuje po zjištění skrývaných dluhů, je pochopitelná reakce, ne jejich příčina."

[[pattern.trainer]]
utterance = "Lidé s chronickou bolestí méně cvičí, ale z toho nevíme, zda nečinnost bolest zhoršuje, nebo bolest brání pohybu; nejspíš platí obojí, a proto to ověřujeme v intervenční studii."
context = "Fyzioterapeut vysvětluje studentům výsledek observační studie."
benign = true
marker = "Oba směry vztahu jsou výslovně zváženy, včetně možné vzájemné smyčky, a rozhodnutí se odkládá na vhodný design studie."
response = "Jde o správné užití: kdo připustí oba směry a hledá data, která je rozliší, se obrácené kauzalitě vyhýbá."

