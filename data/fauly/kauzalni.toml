[[pattern.trainer]]
utterance = "Děti, které mají doma hodně knih, mají lepší známky. Rozdávejme proto rodinám knihovny a školní výsledky se zlepší samy."
context = "Návrh na zasedání obecní rady."
benign = false
marker = "Souvislost dvou jevů, které mohou obě vycházet ze vzdělání a zájmů rodičů, se vykládá jako přímý účinek jednoho na druhý."
response = "Zeptat se, co mají rodiny s mnoha knihami společného jinak než knihy; dokud se vliv vzdělání a příjmu rodičů nezohlední, nelze od darovaných knih čekat stejný efekt."

[[pattern.trainer]]
utterance = "Ve vzorku byly ženy, které užívaly doplněk, zdravější, ale byly také mladší a víc sportovaly; po zohlednění věku a pohybu se rozdíl téměř ztratil."
context = "Statistička komentuje observační studii pro redakci odborného časopisu."
benign = true
marker = "Kandidáti na společnou příčinu jsou pojmenováni a jejich vliv na souvislost je zkoumán, nikoli přehlížen."
response = "Jde o správný postup analýzy: kontrola věku a pohybu ukázala, že původní souvislost byla z velké části dána společnými faktory."

