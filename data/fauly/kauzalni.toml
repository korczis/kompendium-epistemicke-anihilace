[[pattern.trainer]]
utterance = "Tvoje nemoc se vrátila, protože jsi přestala věřit naplno. Když se uzdravíš, bude to síla víry; když ne, pochybovala jsi."
context = "Vedoucí duchovní skupiny mluví s členkou, které se zhoršila diagnóza."
benign = false
marker = "Vnitřní stav (víra, myšlenky) se vydává za příčinu tělesného děje a každý výsledek se vyloží jako potvrzení, takže tvrzení nelze vyvrátit a vina dopadá na nemocnou."
response = "Pojmenovat, že výklad je nastaven tak, aby platil při jakémkoli výsledku, a vrátit rozhodování o léčbě k lékařskému posouzení; průběh nemoci není měřítkem víry ani viny."

[[pattern.trainer]]
utterance = "Před zkouškou si vždycky beru stejné tričko pro štěstí. Vím, že na výsledek nemá vliv, ale uklidní mě to a líp se soustředím."
context = "Student vysvětluje kamarádovi svůj rituál."
benign = true
marker = "Rituál je vědomě odlišen od příčinného působení na výsledek; jeho funkce je uklidňující a nikomu neškodí."
response = "Jde o neškodné užití: člověk ví, že tričko výsledek neovlivňuje, a rituál nenahrazuje přípravu ani nepřesouvá odpovědnost."
