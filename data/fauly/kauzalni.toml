[[pattern.trainer]]
utterance = "Okresy, kde je víc kaváren, mají vyšší průměrné příjmy. Kdo chce zbohatnout region, ať tam podporuje otevírání kaváren."
context = "Komentář k návrhu regionální hospodářské politiky."
benign = false
marker = "Ze souběhu dvou veličin se vyvozuje, že jedna působí druhou, a z toho rovnou opatření; směr vztahu ani společné příčiny nejsou zváženy."
response = "Ukázat, že vyšší příjmy mohou vést ke vzniku kaváren a že obojí může souviset s velikostí a hustotou města; souběh sám nevypovídá o tom, co by změnilo zásah."

[[pattern.trainer]]
utterance = "V našich datech jde vyšší spotřeba alkoholu ruku v ruce s vyšším krevním tlakem. Sama korelace příčinu neprokazuje, proto ji porovnáváme s intervenčními studiemi."
context = "Epidemioložka komentuje výsledek průřezové studie."
benign = true
marker = "Souvislost je popsána jako korelace a závěr o příčině se odkládá, dokud ji nepodpoří jiný typ důkazu."
response = "Jde o správné užití: korelace slouží jako hypotéza a o příčinnosti se rozhoduje až nezávislými důkazy, které vylučují obrácený směr a matoucí faktory."

