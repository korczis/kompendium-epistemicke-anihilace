[[pattern.trainer]]
utterance = "Za krachem firmy je jediná věc: nový finanční ředitel. Před jeho příchodem jsme byli v pořádku, takže stačí najít viníka a máme hotovo."
context = "Člen dozorčí rady na mimořádném jednání po insolvenčním návrhu."
benign = false
marker = "Složitý výsledek s mnoha souběžnými podmínkami (trh, úvěry, předchozí rozhodnutí) se připisuje jedné osobě a hledání dalších příčin se výslovně uzavírá."
response = "Ptát se, které další podmínky musely být přítomny, aby rozhodnutí jednoho člověka vedla ke krachu, a zda by bez nich k němu došlo; podíl jednotlivce se tím nepopírá, jen zasazuje."

[[pattern.trainer]]
utterance = "Kouření je u tohoto pacienta hlavním rizikovým faktorem, ale k infarktu přispěla i neléčená hypertenze, rodinná zátěž a dlouhodobý stres."
context = "Kardiolog shrnuje anamnézu na konziliu."
benign = true
marker = "Zdůrazní se nejvýznamnější faktor, aniž by se ostatní příčiny vytěsnily; vysvětlení zůstává vícečetné."
response = "Jde o přiměřené vážení příčin: určení hlavního faktoru je legitimní, pokud se zároveň neztrácí ostatní podmínky, které k výsledku vedly."

