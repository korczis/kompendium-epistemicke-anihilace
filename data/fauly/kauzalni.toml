[[pattern.trainer]]
utterance = "Den poté, co jsem začala nosit ten náramek, mě přestala bolet záda. Lékaři tomu můžou říkat jak chtějí, ale mně pomohl náramek."
context = "Účastnice internetové diskuse o bolestech zad doporučuje výrobek ostatním."
benign = false
marker = "Jediným důkazem příčinné souvislosti je to, že zlepšení přišlo po začátku nošení; přirozený průběh potíží a jiné změny nejsou zváženy."
response = "Zeptat se, jak by vypadal průběh bez náramku: bolesti zad často samy odeznívají, a o účinku vypovídá až srovnání se skupinou, která výrobek nenosila."

[[pattern.trainer]]
utterance = "Po každém z pěti podání léku se do hodiny objevila stejná vyrážka a po vysazení zmizela; při opětovném podání se vrátila. Lék proto považuji za pravděpodobnou příčinu."
context = "Lékař zapisuje podezření na nežádoucí účinek do dokumentace."
benign = true
marker = "Časová posloupnost je jen výchozí stopa; přidává se opakovatelnost, vymizení po vysazení a návrat po opětovném podání."
response = "Jde o rozumný úsudek: opakované střídání expozice a jejího odnětí vylučuje velkou část náhodných souběhů a závěr je formulován jako pravděpodobný, ne jistý."

