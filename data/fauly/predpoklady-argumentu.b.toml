[[pattern.trainer]]
utterance = "Je naprosto jasné a každý soudný člověk to ví, že ta zpráva je zmanipulovaná. Nebudu to vysvětlovat, je to prostě tak, a opakuji: je zmanipulovaná."
context = "Politik v televizní debatě reaguje na nepříznivou zprávu kontrolního úřadu."
benign = false
marker = "Místo důvodů zaznívají výrazy jistoty a opakování téhož tvrzení; odmítnutí vysvětlit se vydává za samozřejmost, ne za mezeru v argumentu."
response = "Zeptat se, na jakých konkrétních zjištěních tvrzení stojí a která část zprávy je chybná. Dokud důvody nezazní, zůstává jen tvrzení, jakkoli sebejistě opakované."

[[pattern.trainer]]
utterance = "Voda vře při sto stupních Celsia za normálního tlaku. Pokud o tom někdo pochybuje, rád ukážu měření i to, proč se bod varu s nadmořskou výškou mění."
context = "Učitel fyziky na hodině."
benign = true
marker = "Tvrzení patří do sdíleného, snadno ověřitelného poznání a mluvčí je na požádání připraven doložit, místo aby pochybnost odbyl."
response = "Jde o legitimní tvrzení bez rozsáhlého zdůvodnění: je obecně přijímané, ověřitelné a důkazní břemeno mluvčí na výzvu nese."
