[[pattern.trainer]]
utterance = "Přípravek vyzkoušelo dvanáct pacientů naší kliniky a deset z nich hlásí zlepšení. Výsledky jsou jednoznačné a doporučujeme ho všem."
context = "Propagační leták soukromé kliniky; neuvádí, kolik pacientů léčbu přerušilo ani jak se vedlo srovnatelné skupině bez přípravku."
benign = false
marker = "Závěr o účinnosti stojí na části údajů, zatímco informace, které by ho mohly oslabit (odpadlí pacienti, srovnávací skupina, spontánní zlepšení), chybějí, ačkoli je mluvčí musí mít."
response = "Zeptat se na úplný soubor: kolik lidí léčbu začalo, kolik ji dokončilo, co se stalo s ostatními a jak se vedlo lidem bez přípravku. Bez těchto údajů závěr nelze posoudit."

[[pattern.trainer]]
utterance = "Ve dvou ze tří studií se účinek neprokázal. Uvádím všechny tři, včetně té, která naši hypotézu podporuje, a vysvětluji, čím se od ostatních liší."
context = "Doktorand prezentuje přehled literatury na semináři."
benign = true
marker = "Mluvčí výslovně uvádí i údaje, které jeho závěru nesvědčí, a nechává posluchače posoudit celek."
response = "Jde o poctivé užití: úplná prezentace důkazů včetně nepříznivých je přesně to, co zamlčení důkazů porušuje."

