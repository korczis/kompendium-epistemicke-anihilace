[[pattern.trainer]]
utterance = "Laboratoř tvrdí, že voda ze studny obsahuje nebezpečné množství dusičnanů, soused tvrdí, že je úplně čistá. Pravda bude někde uprostřed, takže dětem ji klidně můžeme dávat ředěnou."
context = "Rodina rozhoduje o pitné vodě pro malé děti."
benign = false
marker = "Mezi měřením a neověřeným názorem se hledá střed, jako by obě tvrzení měla stejnou váhu a pravda o faktu se dala vyjednat."
response = "U faktické otázky rozhoduje kvalita důkazu, ne poloha mezi stanovisky. Ověřit měření, případně nechat vodu otestovat znovu, a podle výsledku jednat."

[[pattern.trainer]]
utterance = "Vy chcete rozpočet na opravy dvacet milionů, my patnáct. Navrhuji sedmnáct a půl a zbytek doplnit příští rok, pokud se ukáže potřeba."
context = "Jednání zastupitelů o rozpočtu, kde obě částky jsou obhajitelné a jde o rozdělení omezených prostředků."
benign = true
marker = "Jde o vyjednávání o rozdělení zdrojů mezi oprávněnými zájmy, ne o spor o to, co je pravda; kompromis je zde legitimním výsledkem."
response = "Kompromis je v dialogu vyjednávání rozumný, protože obě strany hájí přijatelné zájmy a nikdo netvrdí, že střed je pravdivější."

