[[pattern.trainer]]
utterance = "Za ty roky jsi do skupiny vložil úspory, přátele i celou kariéru. Kdybys teď odešel, bylo by to všechno k ničemu. Opravdu chceš, aby to byla ztráta?"
context = "Starší člen hnutí odpovídá členovi, který zvažuje odchod."
benign = false
marker = "Rozhodnutí o budoucnosti se opírá o to, co už bylo nevratně vynaloženo, a ne o to, co pokračování přinese nebo bude stát; minulé oběti se mění v důvod dalších."
response = "Oddělit minulost od rozhodnutí: vložené prostředky se nevrátí v žádném případě. Rozhoduje, co dalších pět let ve skupině přinese a vezme, ve srovnání s odchodem."

[[pattern.trainer]]
utterance = "Na vývoji jsme strávili dva roky, ale testy ukazují, že po dokončení by systém stál víc, než ušetří. Navrhuji projekt ukončit a použít, co se z něj dá převzít."
context = "Vedoucí projektu na jednání řídícího výboru."
benign = true
