[[pattern.trainer]]
utterance = "Nedovedu si představit, že by neviditelné částice z mobilu nic nedělaly s mozkem, když ho máme pořád u hlavy. To prostě nemůže být neškodné."
context = "Rodič v diskusi o mobilních telefonech u dětí."
benign = false
marker = "Závěr o tom, jak se věci mají, se opírá jen o to, že si mluvčí opak nedovede představit; vlastní představivost se vydává za měřítko skutečnosti."
response = "Oddělit to, co si člověk dokáže představit, od toho, co ukazují měření a studie. Zeptat se, jaké údaje o účincích existují a co z nich plyne."

[[pattern.trainer]]
utterance = "Tvrdíte, že váš doplněk stravy vyléčí rakovinu za tři týdny. To je v rozporu se vším, co o nádorech víme, takže budu potřebovat velmi silné důkazy, než to přijmu."
context = "Onkolog odpovídá prodejci doplňků stravy."
benign = true
marker = "Skepse se neopírá o osobní představivost, ale o rozsáhlé předchozí poznání, a mluvčí neuzavírá, nýbrž stanoví, jaké důkazy by ho přesvědčily."
response = "Jde o legitimní užití: mimořádné tvrzení s nízkou předchozí pravděpodobností vyžaduje silnější důkazy, a mluvčí nechává otázku otevřenou pro ně."

