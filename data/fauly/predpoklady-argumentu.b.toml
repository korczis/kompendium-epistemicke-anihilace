[[pattern.trainer]]
utterance = "Ano, doložila jste potvrzení od lékaře, ale to nic nedokazuje. Potřebovala bych posudek specialisty. A ten od specialisty není z naší nemocnice, takže ho nemůžu uznat."
context = "Vedoucí posuzuje žádost zaměstnankyně o úpravu pracovní doby ze zdravotních důvodů."
benign = false
marker = "Pokaždé, když druhá strana splní požadavek, objeví se nový, přísnější požadavek, který předem nezazněl; kritérium se mění podle toho, zda bylo splněno."
response = "Požádat o písemné stanovení kritérií předem a o vysvětlení, proč původní požadavek přestal stačit. Splněná podmínka se má posoudit podle pravidla, které platilo, když byla stanovena."

[[pattern.trainer]]
utterance = "Původně jsme za dostatečný považovali jeden menší experiment. Nová metaanalýza ale ukázala, že malé studie v oboru přeceňují účinky, proto teď chceme replikaci na větším vzorku."
context = "Recenzent vysvětluje autorům, proč žádá doplnění."
benign = true
marker = "Změna kritéria je zdůvodněná novou informací, platí obecně, ne jen pro tohoto autora, a je předem oznámená."
response = "Jde o legitimní revizi standardu: důvod změny je veřejný, týká se metody, ne výsledku, a uplatní se na všechny stejně."

