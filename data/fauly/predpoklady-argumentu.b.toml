[[pattern.trainer]]
utterance = "Tvrdím, že ten očkovací program zvyšuje výskyt autismu. Dokud mi nedokážete, že ne, nemáte právo ho doporučovat."
context = "Diskuse na veřejném zasedání o zdravotní politice."
benign = false
marker = "Ten, kdo přichází s novým tvrzením, odmítá je doložit a povinnost důkazu přenáší na druhou stranu, jako by nevyvrácené tvrzení bylo tím pravdivé."
response = "Připomenout, že kdo tvrdí, dokládá. Požádat o konkrétní údaje, na nichž tvrzení stojí, a teprve je posoudit; nevyvrácení není doklad pravdivosti."

[[pattern.trainer]]
utterance = "Výrobce chce lék uvést na trh, takže musí on prokázat jeho bezpečnost a účinnost. Úřad nemusí dokazovat, že je nebezpečný."
context = "Přednáška o regulaci léčiv pro studenty farmacie."
benign = true
marker = "Rozložení důkazního břemene je dané předem známým pravidlem a nese ho strana, která chce změnit stav nebo získá výhodu."
response = "Jde o správné rozložení břemene: pravidlo platí pro všechny žadatele a odpovídá tomu, kdo přichází s tvrzením a nese riziko omylu."

