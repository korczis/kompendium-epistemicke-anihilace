[[pattern.trainer]]
utterance = "Když dnes dovolíme zaměstnancům jeden den home office týdně, za rok nebude nikdo chodit do kanceláře, firma ztratí soudržnost a nakonec zkrachuje."
context = "Ředitel na poradě vedení."
benign = false
marker = "Řetěz stále vážnějších důsledků se předkládá jako nevyhnutelný, ačkoli žádný mezikrok není doložen a v každém z nich lze zastavit."
response = "Ptát se po jednotlivých článcích řetězu: co by způsobilo každý další krok, jak je pravděpodobný a co mu může zabránit. Lze také navrhnout zkušební období s jasnou hranicí."

[[pattern.trainer]]
utterance = "Pokud teď výjimkou povolíme stavbu v záplavovém území, budou se na tento precedens odvolávat další žadatelé a úřad bude muset podobné žádosti posuzovat stejně."
context = "Úředník stavebního úřadu vysvětluje zamítnutí žádosti."
benign = true
marker = "Mechanismus, kterým první krok vede k dalšímu (závaznost precedentu a rovné zacházení), je pojmenovaný a doložitelný."
response = "Jde o legitimní argument z precedentu: řetěz není domnělý, ale opírá se o pravidlo, které úřad skutečně zavazuje."

