[[pattern.trainer]]
utterance = "Bezpečnostní pásy stejně nezachrání každého, lidé v nich občas umírají taky. Tak proč by měly být povinné?"
context = "Komentář pod článkem o dopravní bezpečnosti."
benign = false
marker = "Opatření se odmítá proto, že neodstraní problém úplně, a srovnává se s neexistujícím dokonalým řešením místo s reálnou alternativou, tedy s jízdou bez pásu."
response = "Srovnat skutečné možnosti: jak dopadají nehody s pásem a bez něj. Že opatření není dokonalé, neznamená, že není lepší než to, co by nastoupilo místo něj."

[[pattern.trainer]]
utterance = "Nový screeningový test zachytí víc případů, ale má tolik falešně pozitivních výsledků, že by vedl k řadě zbytečných biopsií. Navrhuji porovnat ho se současným testem na reálných datech."
context = "Odborná komise posuzuje zavedení nového diagnostického testu."
benign = true
marker = "Námitka nesrovnává test s ideálem, ale se skutečnou alternativou a váží konkrétní přínosy proti konkrétním škodám."
response = "Jde o legitimní kritiku: posuzuje reálné náklady a přínosy obou dostupných možností a navrhuje ověření."

