[[pattern.trainer]]
utterance = "Když se ti po cvičení uleví, je to důkaz, že metoda funguje. Když se ti uleví méně, metoda odhalila hlubší blok. A když se ti přitíží, čistí se staré trauma."
context = "Lektor alternativního kurzu odpovídá účastnici, která pochybuje o účinku."
benign = false
marker = "Každý myslitelný výsledek se vykládá jako potvrzení; neexistuje pozorování, které by mluvčí přijal jako doklad, že metoda nefunguje."
response = "Zeptat se, jaký výsledek by podle lektora ukázal, že metoda nepomáhá. Pokud žádný, tvrzení nic neříká o skutečném účinku a nelze ho brát jako důkaz."

[[pattern.trainer]]
utterance = "Pokud lék působí, měl by po osmi týdnech snížit skóre deprese víc než placebo. Pokud rozdíl nenajdeme, budeme hypotézu považovat za nepotvrzenou."
context = "Protokol klinické studie předem registrovaný u etické komise."
benign = true
marker = "Tvrzení předem stanoví, jaký výsledek by ho vyvrátil, a mluvčí se k tomuto kritériu zavazuje."
response = "Jde o správně formulovanou testovatelnou hypotézu: riziko vyvrácení je předem pojmenované a výsledek bude mít informační hodnotu."

