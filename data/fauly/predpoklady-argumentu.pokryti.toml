]
review = "agent"

[[pattern.trainer]]
utterance = "Stát je jako domácnost: když rodina utratí víc, než vydělá, zkrachuje. Proto si stát nesmí půjčovat ani na stavbu nemocnice."
context = "Politik v televizní debatě o rozpočtu."
benign = false
marker = "Shoda v jednom rysu (příjmy a výdaje) se vydává za shodu v rysu, na němž závěr stojí; přehlížejí se rozdíly, jako je délka trvání, vlastní měna nebo návratnost investice."
response = "Ptát se, zda stát a domácnost sdílejí právě ty vlastnosti, na nichž závěr o zákazu půjček závisí, a které rozdíly by závěr změnily."

[[pattern.trainer]]
utterance = "Lidský mozek je jako sval. Sval roste, když ho přetěžujete, takže děti by se měly učit i v noci, aby jim mozek rostl rychleji."
context = "Rodič přesvědčuje jiné rodiče na schůzce o domácí přípravě."
benign = false
marker = "Metafora, která má jen ilustrovat, se bere jako důkaz a z vlastnosti zdrojového případu (přetížení svalu) se vyvozuje vlastnost cílového, aniž by se ověřilo, že ji sdílí."
response = "Oddělit obraz od tvrzení: o tom, jak spánek a učení působí na mozek, rozhoduje výzkum mozku, ne vlastnosti svalů."

[[pattern.trainer]]
utterance = "Ten nový lék zkoušeli na myších a potkanech, jejichž metabolismus této látky se podle studií podobá lidskému. Výsledky jsou nadějné, ale bez klinické studie na lidech nic neslibujeme."
context = "Farmakoložka vysvětluje novinářům stav výzkumu."
benign = true
marker = "Analogie stojí na doložené podobnosti v rysu, na kterém závěr závisí, a její závěr je výslovně opatrný a čeká na přímé ověření."
response = "Legitimní argument analogií: podobnost je relevantní a doložená a závěr nepřekračuje to, co analogie unese."

