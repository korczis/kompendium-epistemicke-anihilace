[[pattern.trainer]]
utterance = "Ta nemoc vůbec neexistuje, je to celé vymyšlené. A mimochodem ji do země zatáhli schválně ti, kdo na ní teď vydělávají."
context = "Komentář pod článkem o epidemii."
benign = false
marker = "Dvě tvrzení si navzájem odporují: nemoc, která neexistuje, nemohl nikdo zavléct. Text nabízí obě, aby každý čtenář přijal tu, která mu vyhovuje."
response = "Postavit obě tvrzení vedle sebe a ptát se, které z nich mluvčí hájí; dokud volí podle situace, nehájí žádné."

[[pattern.trainer]]
utterance = "Nikdy jsem ti nic takového neřekl. A i kdybych to řekl, tak jsi to stejně pochopila špatně, jako vždycky."
context = "Partner reaguje na připomenutí výroku, který druhou osobu zranil."
benign = false
marker = "Popření a zároveň obrana pro případ, že popření neplatí; jedno vylučuje druhé a výsledkem je, že se o samotném výroku nemluví."
response = "Zapsat si, co bylo řečeno a kdy; rozpor mezi „neřekl“ a „pochopila špatně“ ukazuje, že odpověď nepopisuje události, ale odvádí od nich."

[[pattern.trainer]]
utterance = "Před rokem jsem tvrdil, že ten projekt se vyplatí. Nová data ukazují opak, takže svůj dřívější názor opouštím a vysvětlím proč."
context = "Ekonom na konferenci reviduje svou dřívější prognózu."
benign = true
marker = "Změna názoru v čase s vysvětlením, proč k ní došlo, není nekonzistence: mluvčí netvrdí obojí zároveň a dřívější tvrzení výslovně opouští."
response = "Legitimní revize: mluvčí jmenuje důvod změny a nové tvrzení lze posoudit podle nových dat."
