  "kompendium/forensic-legal/29-judicial-education.md",
  "kompendium/organizational-defense/_index.md",
]
review = "agent"

[[pattern.trainer]]
utterance = "Loni jsme kolegovi z vedení prominuli překročení rozpočtu o třetinu, protože mu zemřel otec. Já jsem rozpočet překročil taky, takže by mi to mělo být prominuto stejně."
context = "Vedoucí oddělení na jednání o čerpání rozpočtu."
benign = false
marker = "Dovolává se rozhodnutí, které bylo výjimkou z důvodu, jenž v novém případě chybí; shoda ve výsledku (překročení) se vydává za shodu v okolnostech, na nichž výjimka stála."
response = "Ptát se, proč byl původní případ rozhodnut právě tak, a zda nový případ sdílí tento důvod; bez něj precedens nový případ nepokrývá."

[[pattern.trainer]]
utterance = "Minulý měsíc jsi mi půjčila deset tisíc a nic se nestalo. Tak teď mi půjčíš padesát, přece si nebudeš odporovat."
context = "Partner žádá druhou osobu o další peníze, přestože první půjčku nevrátil."
benign = false
marker = "Dřívější vstřícnost se vydává za závazek k větší, zcela jiné vstřícnosti; tlak na důslednost nahrazuje posouzení nového požadavku."
response = "Dřívější rozhodnutí nezavazuje k dalšímu: nový požadavek se posuzuje podle nových okolností, včetně toho, že první půjčka vrácena nebyla."

[[pattern.trainer]]
utterance = "Ve shodné věci se stejným typem smlouvy a stejnou vadou zboží soud loni rozhodl ve prospěch kupujícího. Navrhujeme proto rozhodnout stejně, protože žádný rozdíl mezi případy nevidíme."
context = "Advokátka v závěrečné řeči ve sporu o reklamaci."
benign = true
marker = "Precedens se uvádí s výčtem rysů, v nichž se případy shodují a na nichž původní rozhodnutí stálo, a protistrana může rozdíly namítat."
response = "Legitimní argument precedentem: shoda v relevantních okolnostech je pojmenovaná a otevřená námitce, že se případy liší."

