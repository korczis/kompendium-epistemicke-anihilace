[[pattern.trainer]]
utterance = "Ta příručka je spolehlivá, protože to v ní stojí výslovně, a co v ní stojí, je pravda, protože je spolehlivá."
context = "Člen skupiny obhajuje závazný text vůči pochybnostem nováčka."
benign = false
marker = "Spolehlivost zdroje se dokazuje obsahem téhož zdroje; závěr je skrytě obsažen v premise."
response = "Ptát se po nezávislém důvodu, který by spolehlivost doložil i člověku, který textu zatím nevěří."

[[pattern.trainer]]
utterance = "Ten teploměr měří přesně: při kontrole v kalibrační laboratoři se jeho údaje shodovaly s referenčním přístrojem."
context = "Technik vysvětluje, proč lze naměřeným hodnotám důvěřovat."
benign = true
marker = "Přesnost se opírá o nezávislé srovnání s jiným měřidlem, ne o údaje samotného teploměru."
response = "Platná argumentace: důvod leží mimo tvrzení, které má podpořit, a dá se samostatně ověřit."

