[[pattern.trainer]]
utterance = "Tři pacienti, kterým metoda pomohla, svědčí na našem webu. Lepší důkaz, že funguje, si nelze přát."
context = "Prodejce alternativní terapie odpovídá na dotaz po výsledcích výzkumu."
benign = false
marker = "Ukazují se jen příznivé případy, zatímco počet těch, kterým metoda nepomohla, a srovnání s kontrolní skupinou chybí."
response = "Ptát se po celém souboru: kolik lidí metodu podstoupilo, kolika nepomohla a jak dopadli lidé bez ní."

[[pattern.trainer]]
utterance = "Do přehledu jsme zařadili všech dvanáct studií, které splnily předem zveřejněná kritéria, včetně tří, které účinek nenašly."
context = "Autorka systematického přehledu popisuje výběr studií."
benign = true
marker = "Výběr dokladů se řídí kritérii stanovenými předem a zahrnuje i nepříznivé výsledky."
response = "Platný postup: výběr nezávisí na tom, zda doklad podporuje závěr, a vynechané práce jsou dohledatelné."

