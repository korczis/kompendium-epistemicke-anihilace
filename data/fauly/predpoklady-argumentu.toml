[[pattern.trainer]]
utterance = "Kdy jste si poprvé uvědomila, že vás vaše rodina celé roky držela zpátky?"
context = "Vedoucí rozvojové skupiny se ptá nové členky na její minulost."
benign = false
marker = "Otázka předem obsahuje nedoložené tvrzení, že rodina člověka držela zpátky; ptá se jen na dobu, kdy si to uvědomil."
response = "Oddělit předpoklad od otázky: nejdřív posoudit, zda se to vůbec stalo, a teprve pak odpovídat na to, kdy."

[[pattern.trainer]]
utterance = "Popište mi prosím, co se ten večer dělo, od chvíle, kdy jste přišel domů."
context = "Vyšetřovatel zahajuje výpověď svědka podle protokolu forenzního rozhovoru."
benign = true
marker = "Otevřená otázka nevkládá žádný sporný obsah a nechává na svědkovi, co a v jakém pořadí uvede."
response = "Platná otázka: nepředpokládá skutečnost, kterou má teprve výpověď doložit."

