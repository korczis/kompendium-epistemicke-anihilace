[[pattern.trainer]]
utterance = "Buď s námi podepíšeš petici ještě dnes, nebo je ti osud těch dětí lhostejný. Třetí cesta neexistuje."
context = "Aktivista oslovuje kolemjdoucího u stánku."
benign = false
marker = "Dvě možnosti se vydávají za jediné myslitelné, ačkoli existují další (rozmyslet se, pomáhat jinak, nesouhlasit s formou)."
response = "Pojmenovat vynechané možnosti a trvat na tom, že odmítnutí jednoho kroku neznamená postoj, který se mu přisuzuje."

[[pattern.trainer]]
utterance = "Spínač má jen dvě polohy: buď je obvod zapojený, nebo rozpojený, a podle kontrolky je teď rozpojený."
context = "Elektrikář vysvětluje, proč zařízení nejde zapnout."
benign = true
marker = "Výčet dvou možností je skutečně úplný, protože ho zaručuje konstrukce zařízení."
response = "Platná disjunkce: alternativy jsou vyčerpávající a vzájemně se vylučují, takže závěr je oprávněný."

