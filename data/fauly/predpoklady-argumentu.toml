[[pattern.trainer]]
utterance = "Od vás čekám, že každý výdaj doložíte účtenkou. U mě je to jiné, já mám přehled a vysvětlovat se nemusím."
context = "Partner kontroluje výdaje druhého v domácnosti."
benign = false
marker = "Pravidlo platí pro druhého, ale mluvčí se z něj vyjímá bez důvodu, který by se týkal podstaty pravidla."
response = "Ptát se, čím se situace mluvčího liší v tom, kvůli čemu pravidlo existuje; bez takového rozdílu platí pravidlo pro oba."

[[pattern.trainer]]
utterance = "Rychlost v obci je omezená pro všechny, ale sanitka se zapnutým majákem ji smí překročit, protože veze pacienta v ohrožení života."
context = "Instruktor autoškoly vysvětluje výjimky z pravidel provozu."
benign = true
marker = "Výjimka se opírá o rozdíl, který souvisí s účelem pravidla, a je předem veřejně vymezená."
response = "Platné odlišení: důvod výjimky je relevantní, obecný a stejný pro každého, kdo je v téže situaci."

