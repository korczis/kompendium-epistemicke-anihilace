[[pattern.trainer]]
utterance = "Dva pacienti z té čtvrti mi minulý měsíc lhali o užívání léků. Lidé odtamtud zkrátka nejsou spolehliví."
context = "Lékař na poradě komentuje svou zkušenost s pacienty."
benign = false
marker = "Ze dvou případů se usuzuje na celou skupinu, aniž by se zvážila velikost a reprezentativnost vzorku."
response = "Ptát se, kolik pacientů odtamtud lékař vůbec léčil a jak se chovali ostatní; dva případy nestačí k závěru o skupině."

[[pattern.trainer]]
utterance = "V reprezentativním vzorku dvou tisíc domácností z celého kraje uvedlo vytápění dřevem přibližně dvacet procent, takže v kraji půjde zhruba o pětinu."
context = "Analytička krajského úřadu shrnuje výsledky šetření."
benign = true
marker = "Zobecnění vychází z velkého, náhodně vybraného vzorku a je formulováno jako přibližný odhad."
response = "Platná indukce: velikost a výběr vzorku odpovídají závěru a závěr nese přiměřenou míru nejistoty."

