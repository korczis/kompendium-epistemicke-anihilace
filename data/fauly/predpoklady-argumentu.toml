[[pattern.trainer]]
utterance = "On ji tehdy zbil, ona na něj zase křičela. Oba se chovali špatně, takže jde o vzájemný konflikt a vina je napůl."
context = "Známý komentuje rozchod páru, v němž docházelo k násilí."
benign = false
marker = "Dva jevy se staví na roveň podle jediného společného rysu („chovali se špatně“), ačkoli se zásadně liší povahou a závažností."
response = "Pojmenovat rozdíl v povaze, závažnosti a moci a odmítnout závěr o poloviční vině, který z povrchní podobnosti plyne."

[[pattern.trainer]]
utterance = "Oba léky snižují tlak srovnatelně a mají podobný profil nežádoucích účinků, takže pro tohoto pacienta jsou rovnocennou volbou."
context = "Lékárník odpovídá lékaři na dotaz o záměně přípravku."
benign = true
marker = "Srovnání se opírá o vlastnosti, které jsou pro rozhodnutí relevantní, a o doložené údaje."
response = "Platná ekvivalence: shoda se týká právě těch rysů, na nichž závěr stojí."
