[[pattern.trainer]]
utterance = "Lidé v léčbě závislosti mají sklon k manipulaci, takže to, co tvrdí tahle pacientka o násilí doma, nemusíme brát vážně."
context = "Sociální pracovník posuzuje oznámení pacientky."
benign = false
marker = "Obecná, navíc sporná tendence skupiny se uplatní na konkrétní výpověď bez ohledu na okolnosti, které ji odlišují."
response = "Posoudit konkrétní výpověď podle jejích vlastních znaků a dokladů; statistická tendence skupiny o jednotlivém případu nerozhoduje."

[[pattern.trainer]]
utterance = "Většina dospělých tento lék snáší dobře, ale u vás kvůli onemocnění ledvin dávku upravíme a budeme sledovat hodnoty."
context = "Lékař předepisuje léčbu pacientovi s chronickým onemocněním."
benign = true
marker = "Obecné pravidlo se použije s ohledem na okolnost, která konkrétní případ odlišuje."
response = "Platné užití obecného pravidla: zobecnění slouží jako výchozí bod a relevantní výjimka se bere v úvahu."

