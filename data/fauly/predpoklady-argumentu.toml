[[pattern.trainer]]
utterance = "Kdo z hnutí odešel a teď o nás mluví špatně, nikdy opravdu nepochopil učení. Skutečný člen by nic takového neudělal."
context = "Mluvčí skupiny reaguje na kritiku od bývalých členů."
benign = false
marker = "Protipříklad k tvrzení o členech se odstraní tím, že se dotyčnému dodatečně upře členství; kritérium se objeví až po kritice."
response = "Žádat definici „skutečného člena“ stanovenou předem a nezávisle na tom, zda dotyčný kritizuje; pak teprve posuzovat výpověď."

[[pattern.trainer]]
utterance = "Kdo nemá platnou licenci, není podle zákona lékař, i když nosí bílý plášť a radí pacientům."
context = "Právník vysvětluje rozhodnutí o neoprávněném výkonu povolání."
benign = true
marker = "Vymezení příslušnosti stojí na předem daném a veřejně ověřitelném kritériu, ne na tom, zda se člověk zachoval žádoucím způsobem."
response = "Platná definice: hranice skupiny existovala před sporem a uplatňuje se na každého stejně."

