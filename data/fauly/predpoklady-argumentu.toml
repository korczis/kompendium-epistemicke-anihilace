[[pattern.trainer]]
utterance = "Odpovězte jen ano, nebo ne: souhlasíte s novým rozpočtem a s tím, že dosavadní vedení zklamalo?"
context = "Předsedající na schůzi spolku žádá člena o rychlé vyjádření."
benign = false
marker = "Dvě samostatná tvrzení se spojí do jedné otázky s jedinou povolenou odpovědí, takže souhlas s jedním se počítá jako souhlas s druhým."
response = "Rozdělit otázku na části a odpovídat na každou zvlášť; trvat na tom, že jednoslovná odpověď na dvě věci nic nevypovídá."

[[pattern.trainer]]
utterance = "Budu se ptát na dvě věci zvlášť: zaprvé, viděl jste toho muže odcházet? A zadruhé, pokud ano, kterým směrem šel?"
context = "Soudce klade svědkovi doplňující otázky."
benign = true
marker = "Otázky jsou oddělené a druhá je výslovně podmíněna kladnou odpovědí na první."
response = "Platné kladení otázek: každá má vlastní odpověď a žádná nepředpokládá, co ještě nebylo řečeno."

