[[pattern.trainer]]
utterance = "Tvoje data jsou možná v pořádku, ale jestli ten článek pošleš s tímhle závěrem, doporučující dopis ode mě nedostaneš. Rozmysli si, jestli máš pravdu."
context = "Školitel doktorandovi před odesláním rukopisu."
benign = false
marker = "Hrozba sankcí se objevuje na místě protiargumentu k datům; „rozmysli si, jestli máš pravdu“ spojuje pravdivost s osobními náklady."
response = "Zaznamenat, že k obsahu závěru nezazněl žádný věcný důvod, a obrátit se na nezávislé konzultanty nebo etickou komisi instituce; hrozba je samostatný problém, ne argument."

[[pattern.trainer]]
utterance = "Pokud budete v laboratoři dál pracovat bez ochranných brýlí, budu to muset podle řádu nahlásit a přístup vám bude pozastaven."
context = "Bezpečnostní technik upozorňuje zaměstnance na porušení předpisu."
benign = true
marker = "Sankce je předem známé pravidlo, vztahuje se k jednání, ne k pravdivosti názoru, a důvod předpisu je ověřitelný."
response = "Nejde o klam: oznámení důsledku porušení pravidla nemá zastoupit argument o tom, co je pravda, ale vymáhat dohodnutou normu."

