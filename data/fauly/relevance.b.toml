[[pattern.trainer]]
utterance = "Po tom všem, co jsem kvůli tobě obětoval, mi nemůžeš říct, že ta zpráva o mně je pravdivá. To by mě zničilo."
context = "Kolega reaguje na výsledek interního auditu, který ho usvědčuje z chyb."
benign = false
marker = "Utrpení, které by pravda mluvčímu způsobila, se předkládá jako důvod, proč pravdou není; otázka pravdivosti a otázka ohleduplnosti splývají."
response = "Oddělit, co se stalo, od toho, jak s výsledkem naložit: soucit může ovlivnit podobu nápravy, ne závěr o faktech."

[[pattern.trainer]]
utterance = "Obžalovaná se činu dopustila, to nezpochybňujeme. Žádáme ale, aby soud při ukládání trestu přihlédl k její nemoci a k péči o dvě malé děti."
context = "Závěrečná řeč obhajoby ve fázi rozhodování o trestu."
benign = true
marker = "Okolnosti vzbuzující soucit se vztahují k otázce, pro kterou jsou relevantní (výměra trestu), ne k otázce viny."
response = "Legitimní užití: soucit je zde relevantní premisa, protože právo počítá s polehčujícími okolnostmi při ukládání trestu."

