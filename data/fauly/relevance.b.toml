response = "Ptát se na složení, dávku, doložené účinky a interakce s užívanými léky, a ověřit je u lékaře nebo lékárníka; přírodní původ neznamená bezpečnost."

[[pattern.trainer]]
utterance = "Spánek v noci a pohyb přes den odpovídají tomu, jak je řízen náš biologický rytmus, a studie spánku ukazují, že jeho narušení zhoršuje soustředění."
context = "Lékař pracovního lékařství vysvětluje doporučení ke směnnému provozu."
benign = true
marker = "Odkaz na přirozený rytmus je spojen s empirickými doklady o důsledcích; „přirozené“ neslouží jako samostatná hodnota."
response = "Platná argumentace: hodnocení se opírá o doložené účinky na zdraví, ne o samotný fakt, že je něco přirozené."

