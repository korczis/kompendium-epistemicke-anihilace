[[pattern.trainer]]
utterance = "Kolegyně navrhuje omezit přesčasy rezidentů. Takže podle ní mají pacienti v noci zůstat bez lékaře? To je přece nezodpovědné."
context = "Diskuse na poradě nemocničního vedení."
benign = false
marker = "Návrh na omezení přesčasů se přepisuje na extrémní stanovisko „nechat pacienty bez lékaře“, které navrhovatelka nevyslovila, a vyvrací se místo původního."
response = "Vrátit se k původnímu znění návrhu a požádat o námitky právě k němu; ptát se, zda kritik dokáže návrh shrnout tak, aby s tím navrhovatelka souhlasila."

[[pattern.trainer]]
utterance = "Jestli tomu rozumím správně, navrhujete omezit přesčasy a výpadek pokrýt najmutím dalších lékařů. Je to tak? Pak mám otázku k financování."
context = "Ředitel nemocnice reaguje na návrh primářky."
benign = true
marker = "Kritik před námitkou shrne stanovisko a ověří si u autorky, že ho vystihl; námitka míří na skutečný návrh."
response = "Platná argumentace: shrnutí je přesné, potvrzené autorkou a kritika se týká skutečné slabiny návrhu."
