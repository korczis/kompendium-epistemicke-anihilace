[[pattern.trainer]]
utterance = "Ta diagnóza nemůže být správná, protože kdyby byla, musel bych zavřít ordinaci a rodina by přišla o příjem."
context = "Lékař odmítá výsledek vyšetření, které ukazuje jeho vlastní pracovní neschopnost."
benign = false
marker = "Nepříjemné důsledky tvrzení se předkládají jako důvod, proč tvrzení není pravdivé; otázka „co je pravda“ splývá s otázkou „co by se mi hodilo“."
response = "Rozdělit dvě otázky: zda je diagnóza správná, rozhodují vyšetření a druhý názor; jak naložit s jejími důsledky, je další, oddělené rozhodnutí."

[[pattern.trainer]]
utterance = "Kdybychom ten lék stáhli, přišlo by o léčbu tisíce pacientů bez alternativy. Proto navrhuji nejdřív zúžit indikace a sbírat data o nežádoucích účincích."
context = "Jednání odborné komise o léku s novým bezpečnostním signálem."
benign = true
marker = "Důsledky se posuzují u rozhodnutí, co dělat, ne u otázky, zda jsou nežádoucí účinky skutečné; jejich existence se nepopírá."
response = "Legitimní praktický argument: u volby jednání jsou důsledky přímo relevantní, a mluvčí jimi nezpochybňuje fakta."

