benign = false
marker = "Silná emoce nad obrazem se staví na místo argumentu o obsahu zákona a nesouhlas se označuje za morální vadu."
response = "Uznat, že situace na fotografii je skutečně tíživá, a zároveň se ptát, zda navrhovaný zákon právě tuto situaci řeší a s jakými dalšími dopady."

[[pattern.trainer]]
utterance = "Chápu, že vás to rozčiluje, mě taky. Ale podívejme se, co přesně v té smlouvě stojí, než se rozhodneme, jestli ji vypovědět."
context = "Právník s klientem po obdržení nečekané faktury."
benign = true
marker = "Emoce je pojmenována a uznána, ale rozhodnutí se váže na obsah dokumentu, ne na sílu rozčilení."
response = "Zdravé zacházení s emocí: emoce signalizuje, že na věci záleží, a rozhovor se vrací k ověřitelnému obsahu."

