response = "Ptát se, s čím byla metoda srovnávána, na kom, s jakým výsledkem a kdo studii provedl; datum vzniku o účinnosti nic neříká."

[[pattern.trainer]]
utterance = "Novější verze směrnice vychází z randomizovaných studií, které v době původního doporučení neexistovaly, proto jsme dávkování upravili."
context = "Klinický farmakolog vysvětluje změnu standardu."
benign = true
marker = "Za změnou stojí nová evidence, ne novost sama; mluvčí jmenuje druh dokladu, který se změnil."
response = "Legitimní argument: novější doporučení je lepší proto, že opírá o silnější data, a to lze ověřit v uvedených studiích."

