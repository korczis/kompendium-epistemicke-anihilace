[[pattern.trainer]]
utterance = "Ptáte se na nevyúčtované dotace, ale podívejte se, kolik nových míst jsme v kraji vytvořili a jak se zlepšila nezaměstnanost. Tohle lidi doopravdy zajímá."
context = "Politik odpovídá novináři na otázku po zmizelých prostředcích."
benign = false
marker = "Odpověď se přesouvá k jinému, příjemnějšímu tématu, které s otázkou po vyúčtování nesouvisí, a nové téma se prohlašuje za důležitější."
response = "Zaznamenat, že na původní otázku nezazněla odpověď, a zopakovat ji v přesné podobě; zásluhy v jiné oblasti nevysvětlují chybějící vyúčtování."

[[pattern.trainer]]
utterance = "Než odpovím na otázku po rozpočtu, musím upozornit, že čísla v podkladu jsou za jiný rok, než o kterém mluvíme. Pak se k té otázce vrátím."
context = "Ředitel úřadu na veřejném zasedání zastupitelstva."
benign = true
marker = "Odbočka je ohlášená, týká se přesnosti podkladů k téže otázce a mluvčí se k původní otázce výslovně vrací."
response = "Nejde o odvedení pozornosti: upozornění na vadný podklad je relevantní pro odpověď a otázka zůstává otevřená."

