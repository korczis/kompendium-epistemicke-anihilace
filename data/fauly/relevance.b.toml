[[pattern.trainer]]
utterance = "Jestli ze skupiny odejdeš, ztratíš ochranu a všechno, co se ti v životě pokazí, bude důsledek toho, žes nás opustil. Nikdo, kdo odešel, nebyl šťastný."
context = "Vedoucí uzavřené skupiny mluví s členem, který zvažuje odchod."
benign = false
marker = "Představa katastrofy po odchodu se nabízí místo důvodů pro setrvání; tvrzení o osudu odešlých nelze ověřit, protože kontakt s nimi je přerušen."
response = "Rozpoznat, že strach nahrazuje důkaz, a hledat přímé informace od lidí, kteří skupinu opustili, případně od odborníků na odchod ze skupin."

[[pattern.trainer]]
utterance = "Při těchto příznacích hrozí do několika hodin nevratné poškození, proto doporučuji okamžitě jet na pohotovost. Pokud chcete, vysvětlím, proč si to myslím."
context = "Praktický lékař po telefonu s pacientem, který popisuje náhlé příznaky."
benign = true
marker = "Obava je úměrná doložitelnému riziku, mluvčí uvádí důvod a nabízí vysvětlení, rozhodnutí zůstává pacientovi."
response = "Oprávněné varování: hrozba je skutečná a relevantní pro rozhodnutí, a mluvčí z ní nevyvozuje nic, co by nesouviselo s jejím odvrácením."

