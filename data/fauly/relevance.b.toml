[[pattern.trainer]]
utterance = "Na tomhle oddělení se pacienti po operaci vždycky budili až druhý den ráno a nikdy se nic nestalo, takže žádné nové schéma tišení bolesti nepotřebujeme."
context = "Porada ošetřujícího týmu o změně pooperačního režimu."
benign = false
marker = "Délka trvání praxe a absence zaznamenaných potíží se nabízejí jako důkaz, že praxe je správná, bez srovnání s alternativou."
response = "Oddělit otázku, jak dlouho se něco dělá, od otázky, jak dobře to funguje, a žádat data o výsledcích obou postupů včetně komplikací, které se dosud nesledovaly."

[[pattern.trainer]]
utterance = "Tenhle postup kontroly dávek používáme patnáct let a máme k němu záznamy o chybách. Nový systém nejdřív vyzkoušíme souběžně, abychom měli s čím srovnávat."
context = "Vedoucí lékárník reaguje na návrh nového softwaru."
benign = true
marker = "Tradice se neuvádí jako důvod pravdivosti, ale jako zdroj doložené zkušenosti, se kterou se novinka poměří."
response = "Jde o rozumné užití: dlouhodobá praxe má evidenci výsledků a návrh nezakazuje změnu, jen ji podmiňuje srovnáním."

