[[pattern.trainer]]
utterance = "Tenhle princip lékařské etiky formulovali lidé, kteří ještě nevěděli nic o genetice, takže pro dnešní medicínu nemůže mít žádný význam."
context = "Debata o etice nových terapií na studentském semináři."
benign = false
marker = "Stáří myšlenky a nevědomost jejích autorů v jiných věcech se berou jako vyvrácení, aniž by se ukázalo, v čem je princip mylný."
response = "Ptát se, které předpoklady principu novější poznání skutečně zpochybnilo, a odlišit zastaralé faktické údaje od úvahy, která na nich nezávisí."

[[pattern.trainer]]
utterance = "Učebnice z padesátých let uvádí tuto dávku léku, ale pozdější klinické studie ukázaly vážné nežádoucí účinky, proto se dnes doporučuje nižší dávka."
context = "Lékárník vysvětluje studentovi rozdíl mezi starým a novým doporučením."
benign = true
marker = "Starší tvrzení se neodmítá pro své stáří, ale proto, že ho novější doklady konkrétně vyvrátily."
response = "Jde o platné odmítnutí: rozhoduje obsah pozdějších dokladů, nikoli datum vzniku starší učebnice."

