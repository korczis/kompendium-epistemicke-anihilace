[[pattern.trainer]]
utterance = "Obžalovaný se dopustil hrozného činu a rodina oběti si zaslouží spravedlnost, a proto je zřejmé, že vinu nese právě on."
context = "Závěrečná řeč v trestní věci, kde je sporná totožnost pachatele."
benign = false
marker = "Premisy dokládají závažnost činu a nárok obětí na spravedlnost, ale závěr se týká něčeho jiného: kdo čin spáchal."
response = "Upozornit, že závažnost činu nikdo nezpochybňuje a že sporná otázka je totožnost pachatele, ke které je třeba předložit doklady."

[[pattern.trainer]]
utterance = "Navrhovaná dálnice zkrátí dojezd do krajské nemocnice o dvacet minut, a protože časová dostupnost péče je hlavním kritériem zadání, plán tomu kritériu vyhovuje."
context = "Projektant obhajuje variantu trasy před komisí."
benign = true
marker = "Premisa se přímo týká kritéria, podle kterého se o závěru rozhoduje, a závěr netvrdí víc, než premisa unese."
response = "Jde o relevantní argument: spojení mezi důvodem a závěrem je výslovné a dá se ověřit, i když k celkovému rozhodnutí mohou být potřeba další kritéria."
