[[pattern.trainer]]
utterance = "Kritizujete naše vedení za zatajení havárie ve skladu? A co vaše radnice a ta zpráva o kanalizaci, kterou jste před lety také nezveřejnili?"
context = "Mluvčí podniku odpovídá zastupiteli na otázku k nezveřejněné havárii."
benign = false
marker = "Na otázku po konkrétním selhání se neodpovídá; místo toho se vytáhne jiné, nesouvisející selhání tazatele, jako by tím otázka zanikla."
response = "Připustit, že druhý případ lze projednat zvlášť, a vrátit se k původní otázce: co se ve skladu stalo, kdo o tom věděl a proč to nebylo zveřejněno."

[[pattern.trainer]]
utterance = "Navrhujete nám za tuto chybu pokutu, ale loni jste stejné porušení u jiného dodavatele řešili jen napomenutím. Chceme vědět, podle jakého měřítka se rozhoduje."
context = "Dodavatel v řízení u dozorového orgánu namítá nerovné zacházení."
benign = true
marker = "Srovnání s jiným případem se nepoužívá k popření vlastní chyby, ale k otázce po jednotném měřítku, což je k projednávané věci relevantní."
response = "Jde o legitimní námitku konzistence: chyba se nepopírá a srovnatelnost případů je věcná otázka, na kterou má orgán odpovědět zdůvodněním."

