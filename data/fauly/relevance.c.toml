[[pattern.trainer]]
utterance = "Ano, četl jsem jí bez dovolení zprávy v telefonu, ale ona mi minulý měsíc taky zatajila, kolik utratila, takže jsem na to měl právo."
context = "Partner v párové terapii vysvětluje porušení soukromí."
benign = false
marker = "Vlastní jednání se neobhajuje jeho povahou, ale tím, že druhá strana se dříve dopustila jiného provinění."
response = "Oddělit obě jednání a posuzovat každé zvlášť: zatajení výdajů je téma k rozhovoru, ale nečiní tajné čtení zpráv přijatelným."

[[pattern.trainer]]
utterance = "Soused nám bez souhlasu přestavěl společný plot na naší straně, proto podáváme žalobu a žádáme soud o obnovení původního stavu."
context = "Vlastník pozemku popisuje právní postup."
benign = true
marker = "Na křivdu se reaguje cestou, která je sama přípustná a podléhá nezávislému posouzení, ne vlastní odvetou."
response = "Jde o legitimní reakci: provinění druhého zakládá nárok na nápravu v řízení, nikoli ospravedlnění vlastního provinění."

