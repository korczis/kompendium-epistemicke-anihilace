[[pattern.trainer]]
utterance = "Dokud budete mluvit takhle rozčileně, nemá smysl se vaší stížností na šikanu na oddělení vůbec zabývat. Přijďte, až se uklidníte."
context = "Personalista odpovídá zaměstnankyni, která podává stížnost."
benign = false
marker = "Projednání obsahu stížnosti se podmiňuje emocí, s jakou je podána, a pobouření se bere jako důvod stížnost neposuzovat."
response = "Trvat na oddělení obsahu od formy: stížnost má být posouzena podle skutečností, které uvádí, a forma se dá dohodnout bez odkladu jejího projednání."

[[pattern.trainer]]
utterance = "Rozumím, že vás to rozzlobilo, a stížnost přijímám. Prosím jen, abychom se na jednání nepřekřikovali, ať můžu zapsat všechny body, které uvádíte."
context = "Předsedkyně komise vede jednání o stížnosti."
benign = true
marker = "Požadavek na formu se týká průběhu jednání a nepodmiňuje přijetí ani posouzení obsahu."
response = "Jde o legitimní procesní pravidlo: forma se upravuje proto, aby obsah mohl být slyšen celý, a stížnost se projednává bez ohledu na emoci."

