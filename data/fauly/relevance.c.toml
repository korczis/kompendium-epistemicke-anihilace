[[pattern.trainer]]
utterance = "Nikdo zatím neprokázal, že ten doplněk stravy nefunguje, takže je zřejmé, že funguje, a pochybnosti jsou jen předsudek odborníků."
context = "Prodejce obhajuje výrobek na spotřebitelském fóru."
benign = false
marker = "Z toho, že chybí doklad o neúčinnosti, se vyvozuje účinnost, a důkazní břemeno se přesouvá na ty, kdo pochybují."
response = "Upozornit, že účinnost dokládá ten, kdo ji tvrdí, a zeptat se, zda byla vůbec provedena studie, která by neúčinnost mohla odhalit."

[[pattern.trainer]]
utterance = "V protokolu o kontrole kotelny za celé topné období není jediný záznam o úniku plynu a čidla byla podle revize funkční, takže únik v tomto období je nepravděpodobný."
context = "Technik vyhodnocuje provozní záznamy budovy."
benign = true
marker = "Z nepřítomnosti záznamu se usuzuje jen proto, že existoval spolehlivý způsob, jak by se únik zaznamenal, a závěr je formulován jako pravděpodobnost."
response = "Jde o rozumný závěr z negativního nálezu: hledání proběhlo citlivým nástrojem, takže chybějící záznam je skutečný doklad, nikoli pouhé nevědění."

