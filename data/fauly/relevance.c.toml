[[pattern.trainer]]
utterance = "Ten člověk vydělal na kryptoměnách miliardy, takže když říká, že inflace příští rok zmizí, asi ví, o čem mluví."
context = "Diskuse v ekonomickém podcastu o makroekonomické prognóze."
benign = false
marker = "Majetek mluvčího se bere jako doklad pravdivosti tvrzení z oboru, ke kterému jeho úspěch nemá vztah."
response = "Ptát se, na čem prognóza stojí: jaké údaje a jaký model ji podpírají, a jak se v minulosti dařilo podobným předpovědím tohoto mluvčího."

[[pattern.trainer]]
utterance = "Firma, která za deset let vybudovala tři zisková pobočková centra, má k plánu rozšíření více relevantních zkušeností než začínající konkurent bez jediné pobočky."
context = "Hodnotící komise srovnává dvě nabídky na provoz poboček."
benign = true
marker = "Úspěch se posuzuje jako doklad schopnosti právě v té činnosti, o kterou jde, a ne jako obecný znak pravdivosti."
response = "Jde o relevantní doklad: dosavadní výsledky v téže činnosti vypovídají o kompetenci, i když samy o sobě nezaručují úspěch nového plánu."

