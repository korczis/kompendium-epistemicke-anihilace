[[pattern.trainer]]
utterance = "Vy jako zkušená investorka přece hned vidíte, že tahle příležitost je výjimečná; průměrní lidé to nepochopí, ale vy na to máte."
context = "Zprostředkovatel nabízí klientce investici bez prospektu."
benign = false
marker = "Místo údajů o investici se nabízí obraz klientky jako výjimečné osoby a přijetí nabídky se spojuje s potvrzením tohoto obrazu."
response = "Oddělit pochvalu od rozhodnutí a žádat podklady: prospekt, rizika, poplatky a historii výnosů, které by přesvědčily kohokoli, ne jen 'výjimečné' lidi."

[[pattern.trainer]]
utterance = "Vaše analýza nákladů je velmi pečlivá a právě proto bych ji rád použil i pro druhý projekt; k tomu ale potřebuji ještě doplnit čísla za loňský rok."
context = "Vedoucí týmu hodnotí podklad kolegyně."
benign = true
marker = "Uznání se týká konkrétní, ověřitelné kvality práce a nenahrazuje žádný argument; žádost o doplnění stojí samostatně."
response = "Jde o věcnou zpětnou vazbu: pochvala popisuje doložitelnou vlastnost podkladu a o návrhu se rozhoduje podle čísel, ne podle pochvaly."

