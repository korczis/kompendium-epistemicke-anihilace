context = "Starostka předkládá zastupitelstvu pořadí investic při omezeném rozpočtu."
benign = true
marker = "Srovnání závažnosti slouží k rozhodnutí o pořadí při skutečně omezených prostředcích; menší problém se neprohlašuje za nedůležitý a dostává termín řešení."
response = "Legitimní stanovení priorit: důvod srovnání je uveden, kritérium (havarijní stav) je ověřitelné a druhý problém zůstává na pořadu."
