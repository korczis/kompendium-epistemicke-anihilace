benign = false
marker = "Místo čísel a výpočtů rozboru se hodnotí soukromý život a neúspěchy autora, které s věcnou správností rozpočtu nesouvisejí."
response = "Oddělit autora od textu: požádat o konkrétní položku rozboru, která je chybná, a o důvod, proč je chybná, bez ohledu na to, kdo ji napsal."

[[pattern.trainer]]
