context = "Obhájce zpochybňuje u soudu výpověď očitého svědka dopravní nehody."
benign = true
marker = "Zpochybňuje se vlastnost osoby, která přímo souvisí se spolehlivostí jejího svědectví, a to doloženým údajem."
response = "Platná úvaha: u svědectví je schopnost vnímat součástí důvodu, proč tvrzení věřit, takže námitka míří na premisu, ne vedle ní."

