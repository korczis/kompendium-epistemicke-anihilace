[[pattern.trainer]]
utterance = "Počet uzavřených spisů na pracovníka vzrostl o třetinu, takže péče o ohrožené děti se zlepšila. Spokojenost rodin neměříme, takže ji nemá smysl řešit."
context = "Výroční zpráva vedení sociálního odboru."
benign = false
marker = "Snadno spočitatelný ukazatel se vydává za cíl samotný a to, co se neměří, se prohlašuje za nedůležité."
response = "Ptát se, co uzavřený spis vypovídá o bezpečí dítěte, a požadovat i jiné, třeba kvalitativní doklady o výsledku péče."

[[pattern.trainer]]
utterance = "Počet uzavřených spisů vzrostl, ale nevíme, zda to znamená lepší péči, nebo rychlejší uzavírání. Doplníme proto namátkové kontroly a rozhovory s rodinami."
context = "Interní auditor komentuje totéž číslo ve zprávě pro vedení."
benign = true
marker = "Číslo se čte jako nepřímý ukazatel s více možnými výklady a doplňuje se o zdroje, které zachytí, co samo neměří."
response = "Jde o legitimní užití metriky: auditor ji nepovyšuje na cíl a zajišťuje, aby neměřené stránky nezmizely z hodnocení."

