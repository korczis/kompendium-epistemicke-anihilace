[[pattern.trainer]]
utterance = "Nová studie: kdo pije každý den kávu, má o polovinu vyšší riziko vzácného nádoru. Odborníci varují, že jde o dramatický nárůst."
context = "Titulek a perex zpravodajského článku."
benign = false
marker = "Uvádí se jen relativní změna rizika bez výchozí četnosti, takže čtenář nevidí, že u vzácné nemoci jde o malý absolutní rozdíl."
response = "Ptát se, z kolika případů na kolik lidí riziko stoupá, tedy po absolutních číslech, a teprve podle nich posoudit význam zjištění."

[[pattern.trainer]]
utterance = "Lék snižuje riziko infarktu asi o čtvrtinu. U lidí jako vy to znamená, že ze sta léčených za deset let infarkt odvrátí přibližně u dvou."
context = "Lékař vysvětluje pacientovi přínos preventivní léčby."
benign = true
marker = "Relativní údaj je doplněn o absolutní změnu v přirozených četnostech vztaženou k riziku konkrétního pacienta."
response = "Jde o transparentní sdělení rizika: pacient dostává obě míry a může přínos porovnat s nežádoucími účinky a náklady."
