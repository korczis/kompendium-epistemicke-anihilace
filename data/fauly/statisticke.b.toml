[[pattern.trainer]]
utterance = "Vzácnou krevní skupinu, kterou má vzorek z místa činu, sdílí v kraji tisíce lidí. Shoda s obžalovaným proto neznamená vůbec nic a soud ji má pominout."
context = "Závěrečná řeč obhajoby v trestní věci, kde je krevní skupina jedním z několika důkazů."
benign = false
marker = "Z toho, že shoda sama neurčuje pachatele, se vyvozuje, že nemá žádnou důkazní hodnotu, a stopa se vytrhává z ostatních důkazů, s nimiž by se skládala."
response = "Rozlišit dostatečnost od relevance: shoda zužuje okruh možných pachatelů a její váha se posuzuje spolu s ostatními důkazy, ne izolovaně."

[[pattern.trainer]]
utterance = "Shoda krevní skupiny okruh osob zužuje, ale sama neukazuje na jednoho člověka. Soud by měl posoudit, zda ji podporují i jiné, na ní nezávislé důkazy."
context = "Znalec odpovídá na otázku soudu, jakou váhu má shoda krevní skupiny."
benign = true
marker = "Výrok přiznává shodě omezenou, ale nenulovou váhu a výslovně ji skládá s dalšími nezávislými důkazy."
response = "Jde o platné vymezení: znalec nepřeceňuje ani nepopírá důkazní hodnotu stopy a ponechává hodnocení celku soudu."

