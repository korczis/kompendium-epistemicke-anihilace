[[pattern.trainer]]
utterance = "Studie říkají, že je ten lék bezpečný, ale já jsem viděla sousedku, jak po něm skončila na kapačkách. Tohle mi žádná tabulka nevymluví."
context = "Diskuse rodičů o očkování nebo léčbě v online skupině."
benign = false
marker = "Jediný dramatický a osobně viděný případ se staví nad soustavná data o mnoha lidech, jako by živost zážitku nahrazovala jeho četnost."
response = "Vzít případ vážně jako signál, ale ptát se, jak často k němu dochází a zda se vyskytuje častěji u léčených než u neléčených."

[[pattern.trainer]]
utterance = "Ten případ sousedky bychom měli nahlásit do systému hlášení nežádoucích účinků, aby se ukázalo, jestli se podobné reakce opakují i jinde."
context = "Lékař odpovídá rodičům, kteří mu popsali reakci známé po léku."
benign = true
marker = "Živý případ se nebere jako důkaz o četnosti, ale jako podnět k ověření v systému, který sleduje mnoho případů."
response = "Jde o platné užití: jednotlivý případ slouží jako hypotéza, kterou rozhodnou souhrnná data."

