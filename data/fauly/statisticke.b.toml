[[pattern.trainer]]
utterance = "V okresech s vyšším podílem vysokoškoláků je vyšší i podíl voličů jedné strany, takže každý vysokoškolák v tom okrese tu stranu nejspíš volí."
context = "Komentář k mapě výsledků voleb po okresech."
benign = false
marker = "Souvislost naměřená mezi okresy se bez dat o jednotlivcích přenáší na chování každého jednotlivce v okrese."
response = "Upozornit, že stejný vzorec mezi okresy může vzniknout z různých individuálních vztahů, a ptát se po datech na úrovni jednotlivých voličů."

[[pattern.trainer]]
utterance = "Obce s vyšším průměrným příjmem mají v našich datech méně hospitalizací, ale z toho nevyvozujeme nic o konkrétních domácnostech, jen o obcích."
context = "Autor zprávy o regionálním zdraví vymezuje, co jeho data umožňují tvrdit."
benign = true
marker = "Mluvčí výslovně drží závěr na úrovni, na které byla data sebrána, a nepřenáší ho na jednotlivce."
response = "Jde o korektní vymezení: souvislost mezi obcemi se popisuje jako souvislost mezi obcemi."

