[[pattern.trainer]]
utterance = "Podívejte se na ten graf: sloupec konkurence je sotva vidět a náš je třikrát vyšší. Svislá osa začíná až těsně pod hodnotami obou firem."
context = "Reklamní leták srovnává spokojenost zákazníků dvou firem."
benign = false
marker = "Osa začíná těsně pod hodnotami, takže malý rozdíl v číslech vypadá jako mnohonásobný rozdíl ve výšce sloupců."
response = "Číst čísla na ose, ne výšku sloupců, a přepočítat rozdíl na skutečný poměr hodnot; ptát se, proč osa nezačíná nulou."

[[pattern.trainer]]
utterance = "Osu teploty jsme nezačali nulou, protože nás zajímá změna o desetiny stupně; v popisku to uvádíme a vedle je stejný graf s plnou osou."
context = "Autoři klimatologické zprávy vysvětlují volbu měřítka."
benign = true
marker = "Volba měřítka je zdůvodněná povahou veličiny, výslovně ohlášená a doplněná srovnávacím zobrazením."
response = "Jde o legitimní zobrazení: u veličiny, kde nula nemá věcný význam, je zúžená osa oprávněná, pokud je zřetelně označená."

