[[pattern.trainer]]
utterance = "Prošli jsme výskyt nemocí ve všech obcích kraje a v jedné je výskyt rakoviny nápadně vysoký. To nemůže být náhoda, musí za tím být ta nová skládka."
context = "Občanská iniciativa prezentuje vlastní analýzu na veřejném zasedání."
benign = false
marker = "Nápadný výsledek se hodnotí, jako by byl jedinou testovanou možností, ačkoli vznikl prohledáním mnoha obcí a mnoha nemocí."
response = "Ptát se, kolik obcí a diagnóz se prohledávalo a jak často by takový výkyv vznikl náhodou; hypotézu o skládce ověřit na nových, předem určených datech."

[[pattern.trainer]]
utterance = "Výkyv v jedné obci bereme jako podnět. Hypotézu o skládce zapíšeme předem a ověříme ji na údajích z dalších let, které jsme dosud neviděli."
context = "Epidemiolog krajské hygienické stanice reaguje na tutéž analýzu."
benign = true
marker = "Výsledek nalezený prohledáváním se nepovažuje za potvrzení, ale za hypotézu, která se testuje na nezávislých datech."
response = "Jde o platný postup: oddělení hledání od ověřování odstraňuje zkreslení, které vzniká z mnoha srovnání."

