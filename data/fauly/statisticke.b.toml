[[pattern.trainer]]
utterance = "Celkově se v naší nemocnici po novém postupu uzdravilo méně pacientů než po starém, takže nový postup je horší a máme se k starému vrátit."
context = "Porada vedení nemocnice nad souhrnnými výsledky dvou léčebných postupů."
benign = false
marker = "Závěr se opírá jen o souhrnná čísla, ačkoli nový postup mohl dostávat jinak závažné pacienty než starý a souhrn pak míchá složení skupin s účinkem léčby."
response = "Požadovat srovnání v jednotlivých vrstvách závažnosti a ptát se, podle čeho se o přidělení postupu rozhodovalo."

[[pattern.trainer]]
utterance = "Než oba postupy porovnáme, rozdělme pacienty podle závažnosti při přijetí, protože nový postup dostávali hlavně ti nejtěžší."
context = "Statistik na téže poradě vedení nemocnice."
benign = true
marker = "Výrok jmenuje proměnnou, která souvisí s přidělením léčby i s výsledkem, a navrhuje srovnání uvnitř jejích vrstev."
response = "Jde o metodicky správný krok: rozvrstvení podle zjevného zavádějícího faktoru brání tomu, aby se jeho vliv vydával za účinek léčby."

