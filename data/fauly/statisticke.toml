[[pattern.trainer]]
utterance = "Ten fond vydělal tři roky po sobě víc než trh, správce má zjevně šťastnou ruku. Přesuňte tam všechno, dokud mu to jde."
context = "Rozhovor dvou známých o investicích na rodinné oslavě."
benign = false
marker = "Krátká řada úspěchů se bere jako důkaz trvalé schopnosti nebo stavu, který bude pokračovat, bez srovnání s tím, jak často by podobná řada vznikla náhodou."
response = "Zeptat se, kolik fondů mělo podobnou řadu čistě náhodou a jak se jim vedlo potom, a požadovat delší a ověřitelnou historii místo série."

[[pattern.trainer]]
utterance = "Ta vyšetřovatelka vyřešila poslední čtyři případy, má teď formu. Ten nový jí dejte, ona v tom něco najde i bez dalších podkladů."
context = "Vedoucí oddělení rozděluje spisy."
benign = false
marker = "Série úspěchů se vydává za stav, který má sám o sobě zaručit další úspěch, a nahrazuje posouzení konkrétního případu a podkladů."
response = "Oddělit hodnocení schopností, které má doložit delší záznam, od hodnocení podkladů nového případu, které série nijak nenahrazuje."

[[pattern.trainer]]
utterance = "U střelby z místa se nám zásahy po sobě opravdu mírně shlukují, ale efekt je malý a měřili jsme ho na stovkách pokusů, ne na jednom zápase."
context = "Trenér basketbalového týmu interpretuje data z tréninku."
benign = true
marker = "Mluvčí rozlišuje skutečnou, změřenou závislost od dojmu ze série a uvádí velikost vzorku i velikost efektu."
response = "Jde o legitimní úvahu: tvrzení o závislosti se opírá o data a nepřeceňuje se; klam spočívá v dojmu bez takového ověření."

