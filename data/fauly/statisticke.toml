[[pattern.trainer]]
utterance = "Shodný profil má jen jeden člověk z milionu. Pravděpodobnost, že obžalovaný je nevinný, je tedy jedna ku milionu."
context = "Závěrečná řeč v trestní věci, v níž je hlavním důkazem shoda biologické stopy."
benign = false
marker = "Pravděpodobnost shody u náhodného nevinného člověka se vydává za pravděpodobnost neviny obžalovaného; chybí úvaha, kolik lidí v populaci by profil sdílelo."
response = "Rozlišit pravděpodobnost shody za předpokladu neviny od pravděpodobnosti neviny za předpokladu shody a zeptat se, kolik lidí připadalo v úvahu a co dalšího obžalovaného s činem spojuje."

[[pattern.trainer]]
utterance = "Pokud by matka byla nevinná, bylo by dvojí úmrtí dětí v rodině extrémně nepravděpodobné. Proto je téměř jisté, že vinná je."
context = "Znalecký výklad v řízení o úmrtí dvou kojenců."
benign = false
marker = "Nízká pravděpodobnost události za předpokladu neviny se převrací v nízkou pravděpodobnost neviny; alternativní vysvětlení, která jsou také vzácná, se neporovnávají."
response = "Požadovat srovnání pravděpodobnosti události za obou hypotéz, ne jen za jedné, a ověřit, zda jsou dílčí události skutečně nezávislé."

[[pattern.trainer]]
utterance = "Shoda stopy říká, jak vzácný profil je. Nakolik to obžalovaného usvědčuje, závisí na dalších důkazech a na tom, kolik lidí mohlo být na místě."
context = "Soudní znalkyně vysvětluje senátu význam výsledku analýzy DNA."
benign = true
marker = "Znalkyně odděluje vzácnost profilu od pravděpodobnosti viny a ponechává hodnocení celku soudu."
response = "Jde o správný výklad: statistický údaj se podává ve své podmíněné podobě a nepřevrací se v závěr o vině."
