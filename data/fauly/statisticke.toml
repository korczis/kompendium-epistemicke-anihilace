[[pattern.trainer]]
utterance = "V pilotní studii s dvanácti pacienty lék fungoval skvěle, takže velká studie je jen formalita a výsledek bude stejný."
context = "Vedoucí výzkumného týmu žádá o financování navazující studie."
benign = false
marker = "Malý vzorek se bere jako věrný obraz populace a výsledek pilotu jako téměř jistá předpověď replikace."
response = "Upozornit, že malé vzorky kolísají silně a že výsledky pilotních studií se ve větších studiích často zmenšují nebo mizí; replikace není formalita."

[[pattern.trainer]]
utterance = "Nejvyšší výskyt té nemoci mají dvě malé vesnice v kraji, tam musí být něco ve vodě."
context = "Článek regionálního deníku o mapě nemocnosti."
benign = false
marker = "Krajní hodnoty se objevují u malých souborů už proto, že malé soubory víc kolísají; vysvětlení se hledá dřív, než se zváží velikost souboru."
response = "Zeptat se, zda mají malé obce i nejnižší výskyt, a porovnat údaje za delší období; pokud ano, jde spíš o kolísání malých čísel než o místní příčinu."

[[pattern.trainer]]
utterance = "Je to slibné, ale na dvaceti lidech to nic neprokazuje. Dokud to nezopakuje jiný tým na větším souboru, beru to jen jako hypotézu."
context = "Recenzentka komentuje nový výsledek na oborovém semináři."
benign = true
marker = "Mluvčí výslovně váže důvěru ve výsledek na velikost vzorku a na nezávislou replikaci."
response = "Jde o správnou úvahu: výsledek malého vzorku se bere jako hypotéza, která potřebuje ověření."

