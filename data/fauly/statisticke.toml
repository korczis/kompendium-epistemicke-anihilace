[[pattern.trainer]]
utterance = "Je nepravděpodobné, že by šlo jen o náhodnou chybu v účetnictví. Mnohem pravděpodobnější je, že ředitel peníze vyvedl, zatajil to před auditorem a pak nechal přepsat zápisy."
context = "Komentář k nesrovnalosti v hospodaření obce na diskusním fóru."
benign = false
marker = "Podrobnější příběh složený z několika samostatných kroků se prohlašuje za pravděpodobnější než jeho jednodušší část, ačkoli každý přidaný krok pravděpodobnost celku snižuje."
response = "Rozložit příběh na jednotlivá tvrzení, u každého se ptát na doklad a připomenout, že souběh všech kroků nemůže být pravděpodobnější než kterýkoli z nich."

[[pattern.trainer]]
utterance = "Ten scénář dává smysl: nejdřív výpadek elektřiny, pak selhání záložních zdrojů a nakonec chyba obsluhy. Na tohle se musíme připravit víc než na obyčejný výpadek."
context = "Porada krizového týmu nemocnice o plánu kontinuity provozu."
benign = false
marker = "Soudržnost a názornost řetězce událostí se zaměňuje za jeho pravděpodobnost; samotný výpadek je nutně nejméně stejně pravděpodobný jako výpadek spolu s dalšími selháními."
response = "Odlišit, jak závažný je scénář, od toho, jak je pravděpodobný, a plánovat nejprve pro jednodušší a častější událost, která je v řetězci obsažena."

[[pattern.trainer]]
utterance = "Každá další podmínka, kterou do hypotézy přidáme, ji dělá méně pravděpodobnou, i když zní věrohodněji. Ověřme nejdřív samotný únik dat a pak teprve, kdo za ním stál."
context = "Analytik bezpečnostního týmu shrnuje hypotézy o incidentu."
benign = true
marker = "Mluvčí výslovně uplatňuje pravidlo konjunkce a odděluje přesvědčivost příběhu od jeho pravděpodobnosti."
response = "Jde o správnou úvahu: hypotéza se rozkládá na části a ověřuje se nejprve ta obecnější, která je nutně nejméně stejně pravděpodobná."

