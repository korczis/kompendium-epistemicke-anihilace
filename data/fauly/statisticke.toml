[[pattern.trainer]]
utterance = "Test na tu vzácnou poruchu má spolehlivost přes devadesát procent a vyšel vám pozitivně, takže je téměř jisté, že ji máte."
context = "Lékař sděluje výsledek plošného screeningu člověku bez příznaků."
benign = false
marker = "Z přesnosti testu se vyvozuje pravděpodobnost nemoci, ale chybí údaj, jak častá je porucha v testované populaci; u vzácné poruchy může být většina pozitivních výsledků falešná."
response = "Zeptat se na výskyt poruchy u lidí bez příznaků a na podíl falešně pozitivních výsledků a přepočítat výsledek na přirozené četnosti, například na tisíc vyšetřených."

[[pattern.trainer]]
utterance = "Popis pachatele sedí na studenta informatiky, takže to skoro jistě byl někdo z té malé skupiny programátorů, ne z celé fakulty."
context = "Interní šetření úniku dat na velké fakultě s několika obory."
benign = false
marker = "Podobnost popisu se stereotypem nahrazuje úvahu o tom, kolik lidí z každé skupiny vůbec připadá v úvahu; velikost skupin se do úsudku nedostane."
response = "Požadovat odhad velikosti obou skupin a teprve potom posoudit, o kolik je popis u jedné skupiny pravděpodobnější než u druhé."

[[pattern.trainer]]
utterance = "Pozitivní screening u nás znamená jen to, že vás pozveme na přesnější vyšetření; u lidí bez příznaků je většina pozitivních nálezů nakonec falešná."
context = "Lékařka vysvětluje pacientovi, co znamená pozitivní výsledek screeningu."
benign = true
marker = "Mluvčí výslovně spojuje přesnost testu s výskytem nemoci v populaci a výsledek podává jako důvod k dalšímu ověření, ne jako diagnózu."
response = "Jde o správnou úvahu: základní míra se bere v potaz a pozitivní výsledek se interpretuje jako zvýšení pravděpodobnosti, které je třeba ověřit."

