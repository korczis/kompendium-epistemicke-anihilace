[[pattern.trainer]]
utterance = "Podívejte se na naše absolventy, kteří dnes vydělávají miliony. Všichni prošli tímhle kurzem, takže ten kurz funguje."
context = "Prodejní prezentace drahého programu osobního rozvoje."
benign = false
marker = "Hodnotí se jen ti, kdo uspěli a jsou vidět; o absolventech, kterým se nedaří, a o lidech s podobným úspěchem bez kurzu se mlčí."
response = "Ptát se, kolik lidí kurzem prošlo celkem, jak se vede těm, kteří nejsou v prezentaci, a zda existuje srovnání se skupinou bez kurzu."

[[pattern.trainer]]
utterance = "Staré domy stály sto let, kdežto dnešní stavby se rozpadají. Dřív se prostě stavělo líp."
context = "Debata o kvalitě stavebnictví v místním zpravodaji."
benign = false
marker = "Srovnávají se stavby, které přečkaly dlouhou dobu, s celou dnešní výstavbou; zbořené a zchátralé staré domy ve srovnání chybějí."
response = "Upozornit, že dnes vidíme jen ty staré domy, které přežily, a že spravedlivé srovnání by zahrnovalo i to, co se mezitím zbořilo nebo rozpadlo."

[[pattern.trainer]]
utterance = "Do analýzy zahrneme i firmy, které mezitím zanikly; jinak bychom porovnávali jen ty úspěšné a výsledek by vyšel přehnaně dobře."
context = "Ekonomka připravuje studii výkonnosti začínajících podniků."
benign = true
marker = "Mluvčí výslovně počítá s neviditelnými případy, které vypadly ze souboru, a zahrnuje je do hodnocení."
response = "Jde o správný postup: soubor obsahuje i neúspěšné případy, takže závěr se neopírá jen o přeživší."

