[[pattern.trainer]]
utterance = "Červená padla už sedmkrát po sobě, teď musí přijít černá. Kdo vsadí teď, má výhodu."
context = "Návštěvník kasina komentuje sérii u rulety."
benign = false
marker = "Nezávislé pokusy se chápou jako by si pamatovaly minulost a vyrovnávaly odchylky; série má podle mluvčího měnit pravděpodobnost dalšího výsledku."
response = "Připomenout, že kolo nemá paměť a že pravděpodobnost dalšího výsledku je u férové rulety stejná jako před sérií; vyrovnávání platí jen pro podíly ve velmi dlouhých řadách."

[[pattern.trainer]]
utterance = "Máme tři holky, takže čtvrté dítě bude skoro jistě kluk, to by jinak byla moc velká náhoda."
context = "Rozhovor v rodině o plánování dalšího dítěte."
benign = false
marker = "Předchozí výsledky nezávislých událostí se berou jako důvod, proč má příští výsledek vyrovnat poměr."
response = "Uvést, že pohlaví dalšího dítěte na pohlaví sourozenců prakticky nezávisí a že nepravděpodobnost celé série neříká nic o dalším jednotlivém výsledku."

[[pattern.trainer]]
utterance = "Tenhle stroj se po třech poruchách za týden nejspíš porouchá znovu; opotřebení se sčítá, takže minulost tu o budoucnosti něco říká."
context = "Technik údržby hodnotí stav lisovací linky."
benign = true
marker = "Mluvčí uvádí mechanismus, který události skutečně propojuje, takže nejde o nezávislé pokusy a úvaha z minulosti je oprávněná."
response = "Jde o rozumnou úvahu: hráčský klam se týká nezávislých událostí, kdežto u opotřebení je souvislost mezi poruchami doložitelná."

