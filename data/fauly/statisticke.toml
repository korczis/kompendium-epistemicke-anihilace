[[pattern.trainer]]
utterance = "V naší online anketě se pro zrušení zákona vyslovilo devět z deseti hlasujících, takže to je jasná vůle národa."
context = "Příspěvek na webu zájmového sdružení, které anketu samo šířilo mezi příznivci."
benign = false
marker = "Vzorek se sám vybral z okruhu, který anketu šířil; z takového souboru se usuzuje na celou populaci."
response = "Ptát se, kdo měl k anketě přístup, kdo na ni upozorňoval a jak se odpovídající liší od populace; samovýběr nelze vyvážit počtem hlasů."

[[pattern.trainer]]
utterance = "Ze všech pacientů, kteří k nám přišli s bolestí zad, mělo devadesát procent změny na snímku, takže změny na snímku bolest způsobují."
context = "Lékař specializované kliniky v rozhovoru pro časopis."
benign = false
marker = "Závěr o celé populaci se opírá o soubor lidí, kteří se na kliniku dostali právě kvůli potížím; chybí údaj, jak časté jsou stejné nálezy u lidí bez bolesti."
response = "Požadovat srovnání se skupinou bez potíží a upozornit, že výběr přes specializované pracoviště předem mění složení souboru."

[[pattern.trainer]]
utterance = "Výsledek platí pro naše respondenty z velkých měst; venkovské obyvatele jsme nezastihli dost, takže o celé zemi zatím nic netvrdíme."
context = "Sociolog prezentuje výsledky dotazníkového šetření."
benign = true
marker = "Mluvčí vymezuje populaci, na kterou lze závěr přenést, podle toho, jak byl vzorek skutečně získán."
response = "Jde o legitimní úvahu: závěr se omezuje na skupinu, kterou vzorek zastupuje, a mezera ve výběru se otevřeně přiznává."

