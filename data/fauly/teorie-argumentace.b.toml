benign = false
marker = "Absence prokázané škody se mění v jistotu bezpečnosti, aniž by se uvedlo, jak citlivé ty studie byly, jak dlouho trvaly a kdo je financoval."
response = "Zeptat se, zda by studie škodu vůbec dokázaly zachytit, jak velké a nezávislé byly, a uvědomit si, že nepřítomnost důkazu jen mírně posouvá odhad, pokud hledání bylo slabé."

[[pattern.trainer]]
utterance = "Po deseti letech sledování desítek tisíc pacientů v nezávislých registrech se žádný signál poškození jater neobjevil, takže riziko považujeme za velmi malé."
context = "Farmakolog shrnuje bezpečnostní data léku pro lékovou komisi."
benign = true
marker = "Argument z nepřítomnosti nálezu se opírá o hledání, které by škodu s vysokou pravděpodobností zachytilo, a závěr je formulován jako odhad, ne jistota."
response = "Silná podoba argumentu z nevědomosti: citlivé a dlouhodobé hledání oprávněně snižuje pravděpodobnost škody."

