[[pattern.trainer]]
utterance = "Primář s tím souhlasí, takže o tom už nemá smysl mluvit. Kdo by pochyboval o člověku s třiceti lety praxe?"
context = "Porada oddělení řeší změnu postupu, který se netýká primářova oboru."
benign = false
marker = "Argument z odborného názoru se předkládá jako uzavřený; kritické otázky po oboru autority, po jejím přesném výroku a po shodě s jinými odborníky jsou předem prohlášeny za zbytečné."
response = "Položit kritické otázky schématu: zda jde o primářův obor, co přesně řekl, zda s ním souhlasí jiní odborníci a o jaké podklady se názor opírá."

[[pattern.trainer]]
utterance = "Kardioložka doporučuje změnu léčby a opírá se o loňské doporučené postupy odborné společnosti. Pokud znáte novější data, rád je s ní proberu."
context = "Ošetřující lékař vysvětluje pacientovi návrh specialistky."
benign = true
marker = "Argument z odborného názoru je v oboru autority, uvádí její podklady a sám otevírá kritickou otázku po protichůdných důkazech."
response = "Jde o rozumné užití schématu: autorita je v oboru, opírá se o doložené postupy a závěr zůstává otevřený novým datům."

