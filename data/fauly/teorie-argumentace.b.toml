[[pattern.trainer]]
utterance = "Nebudeme se přít o to, kdo vyhrál minulou debatu. Napište mi prosím, kterou část rozpočtu považujete za chybnou, a projdeme ji položku po položce."
context = "Starosta odpovídá opozičnímu zastupiteli po vyhrocené schůzi."
benign = true
marker = "Výměna se výslovně vrací od soupeření k věcné otázce a nabízí formát, ve kterém lze námitku prověřit."
response = "Jde o dialektický, ne eristický postoj: spor je zúžen na ověřitelnou věc a protějšek má prostor svou námitku doložit."

