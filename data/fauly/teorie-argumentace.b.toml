benign = false
marker = "Již ve fázi konfrontace je jedné straně upřeno právo vyslovit pochybnost, takže kritická diskuse vůbec nezačne."
response = "Odlišit rozhodnutí od zdůvodnění: požadovat, aby pochybnost mohla být vyslovena a zaprotokolována, a aby ten, kdo výběr hájí, předložil své důvody."

[[pattern.trainer]]
utterance = "Máte pochybnosti o spolehlivosti dodavatele. Zapišme je, ať je jasné, o čem se přeme, a já k nim do příští schůze doložím reference a smluvní sankce."
context = "Předseda výběrové komise reaguje na připomínky členů."
benign = true
marker = "Rozdíl názorů je vyjasněn, pochybnost je přijata a strana, která stanovisko hájí, přebírá důkazní břemeno."
response = "Jde o diskusi v souladu s modelem: konfrontace je otevřená, břemeno nese navrhovatel a závěr se odkládá na dobu, kdy budou podklady."

