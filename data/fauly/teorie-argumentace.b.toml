[[pattern.trainer]]
utterance = "Kolegyně napsala, že by se pilotní provoz měl o měsíc prodloužit. Ve skutečnosti tím chce celý projekt pohřbít, takže její návrh můžeme rovnou zamítnout."
context = "Vedoucí týmu shrnuje e-mailovou diskusi o zavedení nového systému."
benign = false
marker = "Ze dvou možných výkladů návrhu se bez opory v textu volí ten nejslabší a nejméně příznivý a připisuje se mu skrytý úmysl."
response = "Vrátit se k doslovnému znění návrhu a k jeho uvedeným důvodům, zeptat se autorky, jak ho myslela, a posuzovat nejlépe doložený výklad."

[[pattern.trainer]]
utterance = "Rozumím vašemu návrhu tak, že prodloužení pilotu má dát čas na školení, ne projekt zastavit. Je to tak? Pak bych se ptal, jestli na to stačí měsíc."
context = "Člen týmu reaguje na návrh kolegyně na poradě."
benign = true
marker = "Výklad stojí na uvedených důvodech, autorce se dává možnost ho opravit a kritika míří na nejsilnější podobu návrhu."
response = "Legitimní užití principu: nejdřív se ověří, co návrh tvrdí, a teprve potom se posuzuje, zda obstojí."

