[[pattern.trainer]]
utterance = "Udělám z vašeho argumentu tu nejsilnější verzi: ve skutečnosti tvrdíte, že očkování je experiment na lidech. A to je pochopitelně nesmysl."
context = "Moderátor veřejné debaty reaguje na diskutujícího, který se ptal na časový odstup mezi dávkami."
benign = false
marker = "Ohlášené „posílení“ cizího argumentu ve skutečnosti dosazuje jiné, extrémnější tvrzení, které protějšek nevyslovil, a vyvrací právě je."
response = "Ověřit, zda údajná nejsilnější verze odpovídá tomu, co protějšek řekl, a nechat ho, ať rekonstrukci potvrdí nebo opraví."

[[pattern.trainer]]
utterance = "Než odpovím, zkusím shrnout vaši pozici co nejsilněji: obáváte se, že odstup mezi dávkami nebyl ověřen u starších pacientů. Sedí to?"
context = "Infektolog odpovídá na dotaz v diskusi po přednášce."
benign = true
marker = "Rekonstrukce vychází z vyslovených důvodů, posiluje je jen tím, že je zpřesňuje, a protějšek ji může opravit."
response = "Legitimní užití: protiargument se posuzuje v nejsilnější podobě, kterou jeho autor uznává za svou."

