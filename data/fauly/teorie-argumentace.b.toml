[[pattern.trainer]]
utterance = "Ve všech třech posudcích se objevuje stejná formulace, takže je jasné, že je napsal jeden člověk. Tím je věc uzavřená."
context = "Kontrolní komise posuzuje, zda byly posudky v grantové soutěži nezávislé."
benign = false
marker = "Mezi údajem (shodná formulace) a tvrzením chybí vyslovené oprávnění, chybí kvalifikátor míry jistoty a výjimky, například společná šablona, se vůbec nezvažují."
response = "Vyžádat si oprávnění, které údaj s tvrzením spojuje, zeptat se na jeho podklad a na okolnosti, za kterých by neplatilo, a podle toho zmírnit jistotu závěru."

[[pattern.trainer]]
utterance = "Shodná formulace ve třech posudcích naznačuje společný původ, pokud ovšem nevychází z šablony agentury. To ověříme, než cokoli uzavřeme."
context = "Člen kontrolní komise shrnuje předběžné zjištění."
benign = true
marker = "Argument má údaj, vyslovené oprávnění, kvalifikátor míry jistoty i výslovnou výhradu, za které podmínky závěr neplatí."
response = "Úplná toulminovská struktura: tvrzení je přiměřené podkladům a mluvčí sám uvádí, co by ho vyvrátilo."

