[[pattern.trainer]]
utterance = "Ptáte se, jestli firma dodržela emisní limity. Podívejte se raději, kolik peněz dáváme na dětská hřiště a kolik rodin u nás má práci."
context = "Mluvčí podniku odpovídá novinářce na dotaz k inspekční zprávě."
benign = false
marker = "Místo důvodů k otázce dodržení limitů přichází jiné téma s emočním nábojem, které se stanoviskem nesouvisí."
response = "Uznat, že sponzoring a zaměstnanost mohou být pravdivé, a připomenout, že k otázce limitů neříkají nic; vrátit se k údajům z inspekční zprávy."

[[pattern.trainer]]
utterance = "K limitům: měření za poslední rok jsou v příloze. Dva měsíce jsme limit překročili, příčinu jsme dohledali v poruše filtru a opravu doložíme."
context = "Tatáž tisková konference, jiný mluvčí."
benign = true
marker = "Odpověď předkládá důvody, které se přímo vztahují ke sporné otázce, včetně těch nepříznivých."
response = "Jde o relevantní argumentaci: důvody se týkají právě toho stanoviska, o kterém se vede spor, a dají se ověřit."

