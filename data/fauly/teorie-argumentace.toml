[[pattern.trainer]]
utterance = "Tvrdím, že ten doplněk stravy léčí únavový syndrom. Jestli si myslíte opak, dokažte mi, že nefunguje. Do té doby platí moje slovo."
context = "Prodejce odpovídá na dotaz lékařky v odborné diskusi."
benign = false
marker = "Kdo předložil stanovisko, odmítá ho obhájit a povinnost důkazu přenáší na toho, kdo jen vyjádřil pochybnost."
response = "Připomenout, že břemeno nese ten, kdo tvrzení předložil, a že pochybnost sama žádné opačné stanovisko netvoří; žádat doklady pro původní tvrzení."

[[pattern.trainer]]
utterance = "Navrhuji změnit dávkování. Podklady jsou ve dvou kontrolovaných studiích, pošlu je všem a na dotazy k nim odpovím na příští schůzce."
context = "Klinický farmaceut předkládá návrh komisi."
benign = true
marker = "Navrhovatel přijímá povinnost své stanovisko obhájit a sám nabízí doklady k přezkoumání."
response = "Jde o řádné převzetí důkazního břemene: tvrzení je podloženo a otevřeno otázkám, takže diskuse může pokračovat k posouzení podkladů."

