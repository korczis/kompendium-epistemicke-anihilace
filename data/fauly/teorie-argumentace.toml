[[pattern.trainer]]
utterance = "Přiznávám, že ty studie vyšly proti mně. Ale to nic nemění, já svůj názor neměním a v příští diskusi ho budu hájit stejně."
context = "Účastník odborného panelu po předložení výsledků kontrolovaných studií."
benign = false
marker = "Obhajoba stanoviska selhala a mluvčí to sám uznává, přesto stanovisko nestáhne ani neoznačí za otevřené."
response = "Připomenout, k čemu se strany zavázaly: pokud obhajoba selhala, stanovisko se stahuje nebo se aspoň uvádějí nové důvody; pouhé setrvání spor neřeší."

[[pattern.trainer]]
utterance = "Moje námitky jste vyvrátil, ty nové analýzy jsou přesvědčivé. Svou pochybnost beru zpět a souhlasím, abychom postup zavedli."
context = "Oponent na závěr metodického semináře."
benign = true
marker = "Úspěšná obhajoba vede k tomu, že protistrana výslovně stahuje pochybnost, takže spor je řádně uzavřen."
response = "Jde o řádné uzavření diskuse: výsledek obhajoby se promítá do postojů obou stran a dál se netvrdí víc, než bylo obhájeno."

