[[pattern.trainer]]
utterance = "Kolega navrhuje zkrátit čekací lhůty na vyšetření. Takže podle něj máme vyšetřovat ledabyle a pacienty odbavovat na běžícím pásu. To přece nemůžeme podpořit."
context = "Diskuse v nemocniční radě o organizaci ambulance."
benign = false
marker = "Kritika míří na zveličenou verzi, kterou původní mluvčí nikdy nepředložil, a vyvrácení této verze se vydává za vyvrácení jeho návrhu."
response = "Vrátit se ke skutečnému znění návrhu a požádat, aby se námitka vztahovala k němu: kde přesně zkrácení lhůt podle kritika ohrožuje kvalitu vyšetření."

[[pattern.trainer]]
utterance = "Jestli tomu rozumím správně, navrhujete zkrátit lhůty tím, že část kontrol převezmou sestry. Je to tak? Pak mám obavu hlavně o návaznost dokumentace."
context = "Člen rady reaguje na tentýž návrh."
benign = true
marker = "Mluvčí si nejprve ověřuje, jak stanovisko zní, a teprve pak ho kritizuje v podobě, kterou protistrana potvrdila."
response = "Jde o korektní kritiku: námitka se týká skutečně předloženého stanoviska a jeho autor má možnost výklad opravit."

