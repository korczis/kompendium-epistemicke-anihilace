[[pattern.trainer]]
utterance = "O tomhle se v našem týmu diskutovat nebude. Kdo zpochybňuje rozhodnutí vedení, ukazuje jen, že sem nepatří, a podle toho se to projeví při hodnocení."
context = "Vedoucí odpovídá na námitku kolegyně k metodice projektu."
benign = false
marker = "Stanovisko se prohlašuje za nedotknutelné a pochybnost se trestá hrozbou, takže druhá strana nemůže námitku vůbec vznést."
response = "Oddělit otázku, zda je rozhodnutí správné, od otázky, kdo smí pochybovat, a trvat na tom, že námitka se posuzuje podle důvodů, ne podle postavení mluvčího."

[[pattern.trainer]]
utterance = "Tuhle námitku dnes na poradě neprobereme, nemáme na ni podklady. Zapíšu ji a příští týden ji otevřeme jako první bod."
context = "Předsedající pracovní schůze reaguje na otázku, na kterou chybějí data."
benign = true
marker = "Odklad se týká načasování a je spojen se závazkem k projednání, takže právo námitku vznést zůstává zachováno."
response = "Jde o legitimní řízení diskuse: pochybnost se nepotlačuje, jen se přesouvá do chvíle, kdy ji lze posoudit na podkladech."

