[[pattern.trainer]]
utterance = "Řekl jsem jen, že v té čtvrti je víc přestupků a že tam bydlí hodně cizinců. Že by to spolu souviselo, jsem netvrdil, to si domýšlíte vy."
context = "Zastupitel v debatě o rozpočtu městské policie."
benign = false
marker = "Mluvčí staví úvahu na premise, kterou nechal nevyslovenou, a když je pojmenována, odmítá za ni nést odpovědnost."
response = "Pojmenovat premisu, bez níž by vedle sebe postavená tvrzení nedávala smysl pro závěr, a zeptat se, zda ji mluvčí zastává; pokud ne, závěr padá."

[[pattern.trainer]]
utterance = "Váš argument zní: lék je drahý, tedy by se neměl hradit. Předpokládám, že tam chybí premisa o rozpočtovém stropu. Myslel jste to takhle, nebo jinak?"
context = "Oponent v hodnotící komisi zdravotní pojišťovny."
benign = true
marker = "Nevyslovená premisa se doplňuje v nejvěrnější podobě, kterou lze z kontextu odůvodnit, a autor ji může potvrdit nebo opravit."
response = "Jde o korektní rekonstrukci: doplnění neodchází od toho, k čemu se mluvčí zavázal, a nechává mu poslední slovo."

