[[pattern.trainer]]
utterance = "Náš program je přirozený, a co je přirozené, nemůže uškodit. Ostatně i zemětřesení je přirozené, takže vidíte, jak silná je příroda."
context = "Leták alternativního léčebného pobytu."
benign = false
marker = "Slovo „přirozený“ mění v průběhu textu význam a úsudek stojí na tom, že čtenář posun nezaznamená."
response = "Zeptat se, v jakém smyslu je slovo použito v každé větě; když se významy rozejdou, úsudek ztrácí oporu."

[[pattern.trainer]]
utterance = "Než budeme pokračovat: když říkáte „zásah“, myslíte operaci, nebo i konzervativní léčbu? Podle toho se liší, co ty údaje ukazují."
context = "Diskuse dvou lékařů nad výsledky registru."
benign = true
marker = "Mluvčí upozorňuje na možnou dvojznačnost klíčového výrazu dřív, než se na něm začne stavět."
response = "Jde o legitimní upřesnění: vyjasnění významu slouží tomu, aby obě strany posuzovaly totéž tvrzení."
