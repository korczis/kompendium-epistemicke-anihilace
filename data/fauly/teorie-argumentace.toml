[[pattern.trainer]]
utterance = "Kdo lže, vyhýbá se očnímu kontaktu. Obviněný se při výslechu díval do stolu. Je tedy jasné, že lže."
context = "Úvaha v neodborném komentáři k soudnímu procesu."
benign = false
marker = "Z podmínky „kdo lže, uhýbá pohledem“ se usuzuje opačným směrem z důsledku na předchůdce, což tato podmínka nedovoluje."
response = "Ukázat, že i kdyby podmínka platila, uhýbání pohledem má mnoho jiných příčin; z důsledku nelze bez dalšího usoudit na jedinou příčinu."

[[pattern.trainer]]
utterance = "Každý lék z této skupiny je při selhání ledvin kontraindikován. Pacientka má selhání ledvin. Tento lék tedy dostat nesmí."
context = "Konzilium na interním oddělení."
benign = true
marker = "Úsudek má platnou formu: z obecného pravidla a zjištěného případu plyne závěr nutně."
response = "Jde o platné usuzování; zbývá jen ověřit pravdivost premis, tedy pravidlo kontraindikace a diagnózu."

