[[pattern.trainer]]
utterance = "Ten postup doporučuje slavný herec, který s ním má výborné zkušenosti, a v jeho pořadu to potvrdily tisíce diváků. Víc důkazů snad netřeba."
context = "Příspěvek v diskusi o léčbě chronické bolesti."
benign = false
marker = "Užívá se schéma autority a většiny, ale autorita nemá v otázce odbornost a souhlas publika nevypovídá o účinnosti."
response = "Položit kritické otázky schématu: je zdroj odborníkem právě v této věci a jsou zkušenosti diváků srovnatelné s kontrolovaným pozorováním?"

[[pattern.trainer]]
utterance = "Toxikologický ústav, který tu látku zkoumá dvacet let, v posledním přehledu uvádí, že v běžných dávkách riziko nenašel. Opírám se o jeho závěr."
context = "Odborný posudek pro správní řízení."
benign = true
marker = "Schéma autority je použito správně: zdroj je odborníkem v dané věci, závěr je dohledatelný a nesporný v rámci oboru."
response = "Jde o přiměřené užití argumentu autoritou: jeho kritické otázky mají dobré odpovědi, a proto může stanovisko podepřít."

