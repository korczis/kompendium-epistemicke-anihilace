[[pattern.trainer]]
utterance = "Když už víme, že jste tu smlouvu podepsal pod tlakem, řekněte nám, kdo vás k tomu donutil a kdy přesně to bylo."
context = "Otázka v neformálním rozhovoru se svědkem v občanskoprávním sporu."
benign = false
marker = "Otázka vydává sporné tvrzení o tlaku za již přijaté východisko a odpověď na ni by je potvrdila, ať zní jakkoli."
response = "Oddělit předpoklad od otázky: nejdřív se zjišťuje, zda tlak vůbec byl, a teprve pak se lze ptát, kdo a kdy."

[[pattern.trainer]]
utterance = "Shodli jsme se, že vycházíme z auditní zprávy z března. Podle ní chybí v pokladně dvě položky. Souhlasíte, že tohle je náš výchozí stav?"
context = "Úvod jednání dvou stran o vyrovnání účtů."
benign = true
marker = "Výchozí bod se výslovně vymezuje a druhá strana je dotázána, zda ho přijímá, než se na něm začne stavět."
response = "Jde o legitimní ustavení společného východiska: přijetí je výslovné, takže pozdější argumentace na něm může stát."

