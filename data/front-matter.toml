# The front-matter schema of the book: one row per key a page of content/ carries.
#
# The single source for scripts/normalize-front-matter.py (--check refuses forbidden keys and
# wrong controlled values; --list unknown-keys reports a key or page class with no row, so a new
# key is introduced by adding a row here) and for the table `--doc --fix` writes into
# .ai/repo/rules/project/information-architecture.v1.md (generated, never edited by hand).
#
# Row fields:
#   where     top (Zola's own keys), taxonomies or extra
#   key       the key; a trailing * is a prefix pattern (one row for a generator's family)
#   type      the TOML types seen, "|"-separated (str, int, float, bool, list, table, date)
#   classes   page classes (ia_model.PAGE_CLASSES, inferred from the path), space-separated;
#             * is every class; a row naming the class wins over a * row
#   kind      authored (default), forbidden (duplicates derived data or nothing reads it:
#             --check refuses it, --fix removes it); a row with `derived` is written by that
#             script (edit the generator, not the page)
#   inferred  a script that writes the value when the page has none
#   values    controlled values: a list, or the name of a set in [values]
#   pattern   a regular expression the value must match in full
#
# Seeded 2026-11-10 from a census of every key in content/ (each key present got a row); the
# kompendium/nlp-vzorce rows describe what scripts/nlp-catalog.py writes there.

schema = "kompendium-front-matter/v1"

keys = [
  { where = "top", key = "description", type = "str", classes = "*" },
  { where = "top", key = "title", type = "str", classes = "*" },
  { where = "top", key = "weight", type = "int", classes = "*" },
  { where = "top", key = "insert_anchor_links", type = "str", classes = "page section technique", values = "insert_anchor_links" },
  { where = "top", key = "draft", type = "bool", classes = "page section" },
  { where = "top", key = "date", type = "date", classes = "page glossary" },
  { where = "top", key = "sort_by", type = "str", classes = "page section", values = "sort_by" },
  { where = "top", key = "template", type = "str", classes = "page section" },
  { where = "top", key = "aliases", type = "list", classes = "page glossary technique", derived = "scripts/merge-duplicate.py" },
  { where = "top", key = "page_template", type = "str", classes = "section" },
  { where = "top", key = "generate_feeds", type = "bool", classes = "section" },
  { where = "taxonomies", key = "tags", type = "list", classes = "page glossary technique quick-reference", inferred = "scripts/normalize-front-matter.py" },
  { where = "taxonomies", key = "categories", type = "list", classes = "page technique quick-reference" },
  { where = "extra", key = "related_terms", type = "list", classes = "page glossary technique quick-reference" },
