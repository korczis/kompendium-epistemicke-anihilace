# Ověřená bibliografie sekce NLP vzorců (pravidlo project.nlp-catalog, project.content-sources-verifiable).
#
# Stránka vzorce smí citovat jen díla odsud; `group` je primary (NLP), roots (zdroje, z nichž NLP čerpá) nebo critical (výzkum a hodnocení). `cite` je podoba citace v textu (autor–rok), jak ji
# brána hledá v próze; `entry` je položka oddílu Literatura, kterou generátor píše na stránku a
# kterou scripts/build-references.py sbírá do content/references.md.
# Nový zdroj se přidává jen tehdy, když je jisté, že dílo existuje a říká to, co mu text připisuje.

