response = "Brát obavy blízkých a vlastní váhání jako informaci o reálných důsledcích a probrat je s lidmi mimo výcvik dřív, než padne rozhodnutí."

[[pattern.trainer]]
utterance = "Kdybyste tu práci v zahraničí vzal, co by to znamenalo pro vaši ženu a pro tátu, o kterého se staráte? A co byste ztratil z toho, co vám teď dobře funguje?"
context = "Poradce s klientem, který zvažuje nabídku zaměstnání."
benign = true
marker = "Otázky otevírají skutečné důsledky pro druhé a ztráty přínosů současného stavu, aniž by poradce naznačil, jaká odpověď je správná."
response = "Legitimní užití: ekologická úvaha rozšiřuje rozhodování o hlediska, která by jinak zůstala stranou, a rozhodnutí ponechává klientovi."

