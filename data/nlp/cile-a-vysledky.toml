[[pattern.trainer]]
utterance = "Jeho chování neovlivníš, ovlivníš jen sebe. Když se doma bude cítit klidný a vítaný, nebude mít důvod se zlobit, a to máš plně ve svých rukou."
context = "Známá radí ženě, která popisuje výbuchy vzteku a výhrůžky partnera."
benign = false
marker = "Podmínka vlastní kontroly se uplatní tak, že odpovědnost za násilí druhého přechází na ohroženou osobu; bezpečí se mění v úkol jejího sebezdokonalení."
response = "Pojmenovat, že za násilí odpovídá ten, kdo je páchá; za cíl v dosahu ohrožené osoby pokládat bezpečí, podporu a ochranu, ne usmíření partnera."

[[pattern.trainer]]
utterance = "Rozhodnutí komise ovlivnit nemůžete, ale můžete ovlivnit, jak připravíte žádost a s kým ji před odesláním proberete. Na co z toho se chcete zaměřit?"
context = "Mentor s doktorandkou před podáním grantové žádosti."
benign = true
marker = "Rozlišení toho, co je a co není v dosahu člověka, se používá k zaměření úsilí, ne k přenesení viny za výsledek, který závisí na jiných."
response = "Legitimní užití: neúspěch u komise by nebyl prohlášen za selhání doktorandky, protože výsledek otevřeně leží mimo její kontrolu."

