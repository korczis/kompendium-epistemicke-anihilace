[[pattern.trainer]]
utterance = "Že jsi opravdu na cestě, poznáš podle toho, že tě rodina přestane chápat. Čím víc se diví, tím víc se měníš."
context = "Vedoucí rozvojové skupiny vysvětluje novému členovi, podle čeho pozná pokrok."
benign = false
marker = "Důkaz dosažení určuje skupina, a to tak, že odcizení blízkých se počítá jako známka úspěchu; kritérium nelze vyvrátit, protože každá námitka je dalším důkazem."
response = "Ptát se, kdo kritérium úspěchu stanovil a co by ho vyvrátilo; varovné signály od blízkých posoudit jako informaci, ne jako potvrzení."

[[pattern.trainer]]
utterance = "Poznáme, že se spánek zlepšuje, když budete podle deníku usínat do půl hodiny a v týdnu se méně často budit. Deník si vedete vy a čteme ho spolu."
context = "Lékařka domlouvá s pacientem hodnocení léčby nespavosti."
benign = true
marker = "Kritérium je pozorovatelné, vztažené k cíli pacienta a zaznamenávané jím samým; nepříznivý výsledek je stejně platný jako příznivý."
response = "Legitimní užití: ověřitelné kritérium chrání před sebeklamem obou stran a umožňuje léčbu změnit, když nefunguje."

