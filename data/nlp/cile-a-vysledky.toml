[[pattern.trainer]]
utterance = "Na začátku kurzu jsi sám řekl, že chceš finanční svobodu a že nic nesmí stát v cestě. Tak proč teď váháš s přihláškou do mistrovského programu?"
context = "Lektor osobního rozvoje mluví s účastníkem po skončení základního semináře."
benign = false
marker = "Cíl, který člověk formuloval v jiné situaci, se vrací jako závazek a měřítko důslednosti; o tom, co cíli slouží, rozhoduje mluvčí, který na rozhodnutí vydělá."
response = "Oddělit vlastní cíl od nabízeného prostředku, posoudit nabídku samostatně a s odstupem a připomenout si, že cíl lze kdykoli přeformulovat nebo opustit."

[[pattern.trainer]]
utterance = "Než začneme, zkusme spolu popsat, co by se ve vašem životě mělo změnit, podle čeho byste to poznal a zda by to někomu blízkému neuškodilo. Kdykoli to můžeme upravit."
context = "Psycholog v úvodu spolupráce s klientem po rozvodu."
benign = true
marker = "Cíl formuluje klient, odborník jen nabízí hlediska; formulace zůstává otevřená změně a nevztahuje se k žádnému prodeji ani závazku vůči odborníkovi."
response = "Legitimní užití: struktura pomáhá ujasnit zakázku a klient si podrží kontrolu nad tím, co a proč chce."

