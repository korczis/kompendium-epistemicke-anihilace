[[pattern.trainer]]
utterance = "U nás se nemluví o tom, co nechceš. Kdo pořád opakuje, co ho trápí, programuje si neúspěch a stahuje dolů celý tým."
context = "Vedoucí týmu reaguje na zaměstnankyni, která upozorňuje na přetížení."
benign = false
marker = "Požadavek kladné formulace se mění v zákaz pojmenovat problém; stížnost se vykládá jako vada mluvčí, ne jako informace o situaci."
response = "Trvat na tom, že popis problému je legitimní informace, zaznamenat jej písemně a žádat odpověď na věc, ne na způsob formulace."

[[pattern.trainer]]
utterance = "Rozumím, že už nechcete mít z porad strach. Napadá vás, jak byste se na nich chtěla cítit a co byste tam chtěla dělat jinak?"
context = "Kouč s klientkou, která sama přišla s potížemi při poradách."
benign = true
marker = "Kouč nejprve přijímá formulaci od problému a jen nabízí doplnění žádaného stavu; klientka může odpovědět i tak, že teď chce jen, aby strach přestal."
response = "Legitimní užití: kladná formulace je nabídka, ne podmínka; problém zůstává vysloven a uznán."

