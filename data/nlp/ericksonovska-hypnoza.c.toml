[[pattern.trainer]]
utterance = "Po té meditaci se ti buď uleví, nebo se ti vynoří staré bolesti, nebo neucítíš nic, protože se to teprve zpracovává. Každá z těch možností znamená, že to funguje."
context = "Lektor placeného kurzu „energetického čištění“ vysvětluje účastníkům, co mají čekat."
benign = false
marker = "Výčet pokrývá všechny myslitelné reakce včetně žádné a každou předem prohlašuje za potvrzení účinku; tvrzení tím přestává být ověřitelné."
response = "Zeptat se, jaký výsledek by ukázal, že metoda nefunguje; pokud žádný neexistuje, tvrzení o účinku nic neříká a nelze o něj opřít rozhodnutí platit za další kurzy."

[[pattern.trainer]]
utterance = "Po očkování můžete mít zarudlé místo vpichu, mírnou teplotu, nebo nic; když se objeví něco jiného, zavolejte nám."
context = "Lékařka informuje pacienta o běžných reakcích na očkování."
benign = true
marker = "Výčet je úplný jen v rozsahu běžných reakcí a výslovně ponechává prostor pro výsledek, který by vyžadoval jiný postup; nic se v něm nevykládá jako důkaz čehokoli."
response = "Neškodné: informace o očekávaných reakcích, která zachovává ověřitelnost (existuje výsledek, který znamená problém)."

