[[pattern.trainer]]
utterance = "Vědomě si nic takového nepamatujete, ale váš prst se zvedl, a to je odpověď vašeho nevědomí. Tělo nelže."
context = "Terapeut, který „odkrývá potlačené vzpomínky“, vykládá klientce pohyb prstu."
benign = false
marker = "Drobný nevědomý pohyb se vydává za přímý přístup k pravdě o minulosti; výrok „tělo nelže“ vyřazuje vědomé svědectví klientky jako méně spolehlivé."
response = "Vědět, že ideomotorické pohyby reagují na očekávání a kontext rozhovoru a nejsou detektorem pravdy; nevyvozovat z nich závěry o minulých událostech a hledat nezávislé doklady."

[[pattern.trainer]]
utterance = "Ten pohyb kyvadla vzniká z drobných pohybů vaší ruky, kterých si nevšimnete; ukazuje, jak očekávání ovlivňuje tělo, ne žádnou skrytou odpověď."
context = "Vyučující psychologie předvádí studentům ideomotorický jev."
benign = true
marker = "Jev je pojmenován a vysvětlen včetně svého mechanismu a výslovně se popírá, že by nesl skrytou informaci."
response = "Neškodné: demonstrace, která učí ideomotorický jev rozpoznat, a tím chrání před jeho výkladem jako „hlasu nevědomí“."

