[[pattern.trainer]]
utterance = "Jakmile pochopíš, že rodina tě jen brzdí, ucítíš konečně tu lehkost, o které ti tu všichni vyprávějí."
context = "Starší člen skupiny mluví s nováčkem o jeho vztazích s příbuznými."
benign = false
marker = "Časová spojka „jakmile“ předpokládá, že posluchač dojde k závěru o rodině, a připojený tělesný signál (lehkost) má sloužit jako potvrzení, že k němu došel."
response = "Všimnout si, že věta neobsahuje žádný argument, jen předpoklad a slib pocitu; ptát se, proč by pocit měl dokazovat tvrzení o rodině, a ověřit vztahy přímo s rodinou."

[[pattern.trainer]]
utterance = "Až si projdete dotazník a budete mít pocit, že jste odpověděli na všechno, dejte mi prosím vědět."
context = "Sestra v ordinaci předává pacientovi vstupní dotazník."
benign = true
marker = "Časová vazba spojuje konkrétní úkol a jeho viditelné dokončení; nic se v ní nepředpokládá o přesvědčení pacienta."
response = "Neškodné: jde o běžnou organizační instrukci, jejíž obsah i cíl jsou otevřené a dobrovolné."

