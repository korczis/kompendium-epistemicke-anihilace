[[pattern.trainer]]
utterance = "Čím víc se teď bráníš, tím jasněji je vidět, jak moc ti na tom ve skutečnosti záleží a jak moc tu chceš zůstat."
context = "Vedoucí uzavřené skupiny reaguje na člena, který ohlásil odchod."
benign = false
marker = "Dvě protichůdné veličiny (odpor a touha zůstat) jsou spojeny vztahem „čím víc…, tím víc…“, takže každý projev nesouhlasu se vykládá jako důkaz opaku."
response = "Oddělit obě veličiny a trvat na doslovném významu vlastního sdělení: odpor znamená odpor; rozhodnutí o odchodu nepotřebuje souhlas výkladu druhé strany."

[[pattern.trainer]]
utterance = "Je normální, že napětí a úleva se po náročném dni střídají; může se stát, že si dnes všimnete obojího."
context = "Psycholog popisuje klientovi běžný průběh zotavení po stresové události."
benign = true
marker = "Protiklady jsou zmíněny jako dva možné stavy bez kauzálního svázání; nic z toho neslouží k tomu, aby se nesouhlas proměnil v souhlas."
response = "Jde o neškodné užití: normalizace kolísání prožitku, která nechává klientovi jeho vlastní popis a nic z jeho reakcí nepřevrací v opak."

