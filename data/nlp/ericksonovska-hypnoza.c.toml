[[pattern.trainer]]
utterance = "Sedíte tady s námi, posloucháte, co nabízíme, a proto už víte, že tahle smlouva je pro vaši rodinu to nejlepší."
context = "Prodejce na prezentaci finančního produktu."
benign = false
marker = "Dvě nesporná pozorování (sedíte, posloucháte) jsou spojkou „a proto“ svázána s tvrzením, které z nich vůbec neplyne; souhlas s pravdivou částí se přenáší na nepravdivou."
response = "Rozpojit větu na jednotlivá tvrzení a hodnotit každé zvlášť: to, že posloucháte, nic neříká o kvalitě smlouvy; požádat o písemné podmínky a čas na rozmyšlenou."

[[pattern.trainer]]
utterance = "Zatím jste dokončili první dvě kapitoly a pochopili základní pojmy, takže příště můžeme začít s příklady."
context = "Vyučující shrnuje postup kurzu."
benign = true
marker = "Spojka váže skutečný předpoklad (dokončené kapitoly) s návrhem, který z něj věcně vyplývá a který si posluchači mohou ověřit."
response = "Neškodné: vazba mezi částmi je doložitelná a slouží orientaci, ne přenesení souhlasu na nesouvisející tvrzení."

