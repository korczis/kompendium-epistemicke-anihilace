[[pattern.trainer]]
utterance = "Každý z vás během dnešního večera nějakým svým způsobem pocítí, že vás Mistr osobně zná, ať už to přijde jako teplo, klid nebo náhlé dojetí."
context = "Organizátor duchovního setkání před vystoupením vůdce."
benign = false
marker = "Sugesce nechává formu prožitku otevřenou, ale pevně stanoví jeho výklad (Mistr vás zná); jakýkoli běžný pocit se tak předem označí za důkaz."
response = "Oddělit prožitek od výkladu: teplo, klid nebo dojetí jsou běžné reakce na hudbu a skupinovou atmosféru a nic nedokládají o vztahu k vůdci."

[[pattern.trainer]]
utterance = "Řekněte mi prosím vlastními slovy, co se tehdy stalo, cokoli si vybavíte, v jakémkoli pořadí."
context = "Vyšetřovatel zahajuje rozhovor se svědkem."
benign = true
marker = "Otevřenost se týká obsahu i formy výpovědi a výzva neobsahuje žádný předem daný výklad ani očekávaný detail."
response = "Neškodné a žádoucí: otevřená výzva bez vloženého obsahu snižuje riziko, že svědek převezme informace od tazatele."

