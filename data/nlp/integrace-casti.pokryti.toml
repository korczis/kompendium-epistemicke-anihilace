response = "Trvat na tom, že o vlastní povaze rozhoduje člověk sám, oddělit dojem ze cvičení od finančního rozhodnutí a smlouvu posoudit s odstupem a mimo skupinu."

[[pattern.trainer]]
utterance = "Říkáte, že vám chybí schopnost v klidu odmítnout kolegu. Můžeme spolu zkusit popsat, jak by vypadalo, kdybyste to uměla, a zda by vám to vůbec vyhovovalo."
context = "Koučka v individuálním sezení s klientkou, která se domluvila na cíli asertivity."
