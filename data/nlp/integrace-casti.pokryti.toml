marker = "Nová dovednost se popisuje jako možnost, kterou klientka sama zvažuje a smí odmítnout; nikdo jí nevkládá hotovou identitu."
response = "Jde o neškodné užití: obraz nové stránky slouží jako pomůcka k nácviku chování, cíl si určila klientka a rozhodnutí zůstává u ní."
