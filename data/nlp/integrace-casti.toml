[[pattern.trainer]]
utterance = "Říkáš, že nechceš podepsat, ale přitom kýváš hlavou. Tvoje nevědomí už souhlasí, tak ho přestaň přehlušovat a podepiš."
context = "Prodejce na prezentaci finančního produktu tlačí na váhajícího zájemce."
benign = false
marker = "Neverbální projev se staví nad výslovné odmítnutí a vykládá se jako skrytý souhlas, který má přednost před slovy."
response = "Výslovné ne platí; nesoulad mezi slovy a gestem znamená nanejvýš nejistotu, a ta je důvodem rozhodnutí odložit, ne podepsat."

[[pattern.trainer]]
utterance = "Usmíváte se, ale říkáte, že je vám to líto. Nechci z toho nic vyvozovat, jen se ptám, jestli je tam víc pocitů najednou."
context = "Terapeutka během sezení s klientem, který mluví o rozchodu."
benign = true
marker = "Současný nesoulad slov a mimiky se jen pojmenuje a vrací klientovi jako otázka, bez výkladu, který kanál „říká pravdu“."
response = "Jde o neškodné užití: pozorování zůstává otázkou, klient má poslední slovo o tom, co prožívá, a nikdo nepřepisuje jeho sdělení."

