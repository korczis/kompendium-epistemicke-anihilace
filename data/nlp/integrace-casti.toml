[[pattern.trainer]]
utterance = "Ta tvoje část, co chce víkendy s dětmi, se přece může dohodnout s tou ambiciózní. Ambiciózní část už souhlasila, že projekt dotáhneš, ne?"
context = "Manažer mluví s podřízeným, který odmítá další víkendové směny."
benign = false
marker = "Mluvčí sám rozhoduje, co která „část“ zaměstnance chce a s čím souhlasila, a vnitřní dohodu používá k prosazení vlastního požadavku."
response = "Vrátit rozhovor k vnější dohodě: pracovní podmínky se vyjednávají mezi zaměstnancem a zaměstnavatelem, ne mezi domnělými částmi jedné osoby."

[[pattern.trainer]]
utterance = "Zní to, jako by ve vás jedna strana chtěla odpočívat a druhá stihnout všechno. Napadá vás, co by mohlo vyhovět oběma aspoň zčásti?"
context = "Koučka s klientkou, která sama přinesla téma přetížení."
benign = true
marker = "Obě strany ambivalence formuluje klientka nebo s ní souhlasí a hledání kompromisu zůstává v jejích rukou."
response = "Jde o neškodné užití: metafora vyjednávání podporuje vlastní řešení, koučka nepřisuzuje částem obsah ani nevnucuje výsledek."

