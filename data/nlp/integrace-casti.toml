response = "Brát vazby na rodinu a pochybnosti jako legitimní součást osobnosti a o přerušení vztahů nerozhodovat pod tlakem skupiny."

[[pattern.trainer]]
utterance = "Jedna vaše strana chce být nezávislá a druhá chce, aby se o ni někdo staral. Obě jsou lidské a nemusí jedna vyhrát nad druhou."
