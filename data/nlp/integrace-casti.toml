[[pattern.trainer]]
utterance = "Teď ty dvě ruce spojíš a ten rozpor zmizí. Kdo z vás pak bude dál pochybovat o naší cestě, ukáže, že to nespojil doopravdy."
context = "Vedoucí víkendového semináře před skupinou komentuje cvičení s rukama."
benign = false
marker = "Gesto spojení rukou se vydává za důkaz vyřešeného konfliktu a následná pochybnost se předem označuje za selhání účastníka."
response = "Rozlišit tělesný rituál od skutečného rozhodnutí; pochybnost po cvičení je normální informace, ne doklad osobního selhání."

[[pattern.trainer]]
utterance = "To spojení rukou je jen obraz. Jestli vám pomohl uvidět, že obě strany chtějí něco dobrého, je to fajn, ale rozhodovat se budete až v klidu doma."
context = "Terapeut po sezení vysvětluje klientce, co cvičení znamená a co ne."
benign = true
marker = "Cvičení se výslovně označuje za symbol bez zaručeného účinku a rozhodnutí se vrací klientce mimo sezení."
response = "Jde o neškodné užití: obraz slouží jako pomůcka k reflexi, nevydává se za prokázaný mechanismus a nevytváří tlak na okamžitý výsledek."

