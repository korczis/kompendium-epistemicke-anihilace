[[pattern.trainer]]
utterance = "To, co teď říkáš o odchodu, nemluví tvoje pravé já, ale tvoje staré světské já. Pravé já patří sem a ví, že venku by ses ztratil."
context = "Vedoucí buňky skupiny reaguje na člena, který vyslovil přání odejít."
benign = false
marker = "Osobnost se dělí na „pravé“ já ztotožněné se skupinou a „staré“ já, kterému se připisují všechny pochybnosti, takže kritika se předem odepisuje."
response = "Uznat, že pochybnosti i přání odejít patří k vlastnímu já; hledat kontakt s lidmi mimo skupinu a informace, které skupina nekontroluje."

[[pattern.trainer]]
utterance = "Je normální, že po odchodu ze skupiny chvíli myslíte jejich slovníkem. Neznamená to, že tam patříte, jen že se ty dva světy ještě srovnávají."
context = "Poradkyně pro lidi po odchodu z uzavřených skupin s klientem v prvních měsících."
benign = true
marker = "Rozpolcenost po odchodu se popisuje jako očekávaný přechodný jev, ne jako důkaz, že skupina měla pravdu."
response = "Jde o neškodné užití: pojmenování rozštěpu normalizuje zkušenost a podporuje návrat k vlastní, souvislé identitě bez nátlaku."
