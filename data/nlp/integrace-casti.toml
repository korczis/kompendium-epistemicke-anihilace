[[pattern.trainer]]
utterance = "Když na tebe křičím, je to jen ta moje ochranitelská část, která tě chce uchránit před chybami. Měla bys ocenit, co tím myslí dobře."
context = "Partner vysvětluje opakované ponižování v hádkách."
benign = false
marker = "Pozitivní záměr se hledá u chování, které poškozuje druhého, a slouží k tomu, aby poškozený chování přijal a ještě za ně byl vděčný."
response = "Oddělit záměr od dopadu: deklarovaný dobrý úmysl nic nemění na tom, že křik a ponižování jsou škodlivé a nepřijatelné."

[[pattern.trainer]]
utterance = "Ta vaše opatrnost vás asi kdysi chránila před zklamáním. Možná stojí za to zjistit, jestli to dnes potřebujete stejně, nebo jinak."
context = "Psycholog s klientkou, která sama popisuje, že se vyhýbá novým vztahům."
benign = true
marker = "Hledání záměru se týká vlastního chování klientky, ne škody působené druhým, a vede k jejímu vlastnímu přehodnocení."
response = "Jde o neškodné užití: výklad chování jako dřívější ochrany zmírňuje sebeobviňování a nechává klientce volbu, co s ním udělá."

