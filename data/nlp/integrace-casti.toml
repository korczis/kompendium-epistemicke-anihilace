[[pattern.trainer]]
utterance = "Pod tvým hněvem na vedení je ve skutečnosti touha po vnitřním míru. Ten ti dá jen naše komunita, takže hněv můžeš klidně pustit."
context = "Starší člen spirituální skupiny mluví s nováčkem, který si stěžuje na finanční požadavky vedení."
benign = false
marker = "Řetěz záměrů se dovede k „jádrovému stavu“, který se pak spojí s jediným zdrojem, totiž se skupinou, a oprávněná výhrada se tím rozpustí."
response = "Oddělit konkrétní stížnost od řeči o hlubokých stavech; finanční požadavky posoudit věcně a hledat informace mimo skupinu."

[[pattern.trainer]]
utterance = "Když se ptáte, o co vám tím přejídáním jde, a dojdete k potřebě klidu, je to zajímavé zjištění. Neznamená to ale, že problém zmizí sám."
context = "Klinická psycholožka komentuje klientce zkušenost z koučinku, kde zkusila tuto metodu."
benign = true
marker = "Pojem hlubšího záměru se bere jako hypotéza k sebepoznání, bez slibu okamžité proměny a bez nároku nahradit léčbu."
response = "Jde o neškodné užití: odbornice uznává hodnotu reflexe a zároveň drží realistické očekávání a návaznost na ověřenou péči."

