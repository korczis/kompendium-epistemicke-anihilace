[[pattern.trainer]]
utterance = "Tvoje pochybnosti nejsi ty, to je jen stará zraněná část, která se bojí. Až ji integrujeme, budeš konečně celý a přestaneš kurzu odporovat."
context = "Lektor osobního rozvoje odpovídá účastníkovi, který zpochybňuje cenu dalšího stupně kurzu."
benign = false
marker = "Kritický postoj člověka se přejmenuje na „část“, které se upírá platnost, a „integrace“ znamená její umlčení ve prospěch zájmu mluvčího."
response = "Trvat na tom, že pochybnost je vlastní úsudek a ne porucha, posoudit ji věcně podle faktů o kurzu a rozhodnutí odložit mimo tlak skupiny."

[[pattern.trainer]]
utterance = "Slyším, že jedna vaše stránka chce změnu práce a druhá se bojí o jistotu. Obě dávají smysl. Jak byste je mohl vzít vážně zároveň?"
context = "Psycholožka v poradně mluví s klientem, který se rozhoduje o změně zaměstnání."
benign = true
marker = "Řeč o „stránkách“ slouží jako popis ambivalence; obě strany se uznávají jako oprávněné a rozhodnutí zůstává klientovi."
response = "Jde o neškodné užití: metafora částí pomáhá pojmenovat smíšené pocity, nikdo z nich nedělá nemoc a nikdo nevybírá vítěze za klienta."

