[[pattern.trainer]]
utterance = "Minulý týden jsi chtěla odejít a dneska tu zase jsi. To dokazuje, že ta tvoje odcházející část nemá pravdu, jen tě občas přepadne."
context = "Partner v kontrolujícím vztahu reaguje na opakované pokusy o odchod."
benign = false
marker = "Střídání postojů v čase se vykládá jednostranně: postoj, který vyhovuje mluvčímu, je „pravé já“, opačný jen přechodná porucha."
response = "Brát opakovanou touhu odejít jako vážnou informaci, hledat za kolísáním vnější tlak a strach a obrátit se na pomoc mimo vztah."

[[pattern.trainer]]
utterance = "Všímám si, že ráno o studiu mluvíte nadšeně a večer ho chcete zrušit. Co se mezi tím děje? Může to být únava, ne nutně vaše skutečné přání."
context = "Studijní poradkyně s posluchačem, který kolísá v rozhodnutí o pokračování."
benign = true
marker = "Kolísání v čase se popisuje jako pozorování a otevírá otázku po okolnostech, aniž by poradkyně jednu fázi prohlásila za pravou."
response = "Jde o neškodné užití: časový nesoulad se zkoumá společně s posluchačem, jeho význam zůstává otevřený a rozhodnutí je na něm."

