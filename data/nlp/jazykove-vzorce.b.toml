[[pattern.trainer]]
utterance = "Znal jsem kdysi ženu, která pořád pochybovala, a celý život jí utekl. Až když přestala klást otázky a svěřila se vedení, konečně se jí ulevilo."
context = "Vedoucí duchovní skupiny vypráví příběh novému členovi, který se ptá na finance skupiny."
benign = false
marker = "Příběh přichází jako odpověď na konkrétní otázku a jeho poučení míří proti tázání samotnému; závěr se nevysloví jako požadavek, takže se k němu nedá přímo vyjádřit."
response = "Vrátit se k původní otázce a trvat na přímé odpovědi; příběh vzít jako názor vypravěče, ne jako argument."

[[pattern.trainer]]
utterance = "Napadá mě obraz horolezce, který si před těžkým úsekem odpočine na plošině. Nevím, jestli vám sedí; pokud ne, klidně ho zahoďte."
context = "Terapeut v sezení s klientem, který mluví o vyčerpání z dlouhé léčby."
benign = true
marker = "Metafora je nabídnuta otevřeně, s výslovnou možností ji odmítnout, a nesměřuje k rozhodnutí, které by bylo výhodné pro mluvčího."
response = "Benigní užití: obraz slouží klientovu vlastnímu porozumění, je transparentní a klient si jeho význam určuje sám."

