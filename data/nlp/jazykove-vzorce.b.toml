[[pattern.trainer]]
utterance = "Byl jednou mladý strom, který chtěl růst po svém, a tak ho vítr zlomil. Ty stromy, co se opřely o starší kmen, stojí dodnes."
context = "Partner vypráví příběh druhému, který zvažuje, že se odstěhuje a najde si vlastní práci."
benign = false
marker = "Postavy příběhu přesně kopírují vztah mluvčího a posluchače a rozuzlení trestá samostatnost; posluchač dostává závěr, aniž by se o něm mohl otevřeně přít."
response = "Pojmenovat paralelu nahlas a převést ji zpět do přímé řeči: o čem konkrétně mluvčí mluví a proč to neřekne přímo."

[[pattern.trainer]]
