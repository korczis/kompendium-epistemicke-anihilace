context = "Supervizor při rozhovoru s přetíženou vedoucí týmu."
benign = true
marker = "Strukturní podobnost příběhu se situací je vyslovena a hned podrobena ověření, posluchačka může paralelu opravit nebo odmítnout."
response = "Benigní užití: izomorfie slouží jako hypotéza k porozumění a není skrytým nositelem rozhodnutí."

