response = "Vrátit rozhovor k původnímu případu a ptát se, v čem se srovnávané případy liší rozsahem, odpovědností a důsledky."

[[pattern.trainer]]
utterance = "Učit se nový jazyk je trochu jako učit se plavat: zpočátku máte pocit, že se topíte, a pak najednou zjistíte, že vás voda nese."
context = "Lektorka povzbuzuje začínající studenty jazykového kurzu."
benign = true
marker = "Analogie mezi dvěma případy učení je otevřeně podaná jako přirovnání, slouží k pochopení zkušenosti a nenese žádný požadavek."
response = "Benigní užití: přirovnání osvětluje zkušenost; je však dobré si všimnout, že analogie nic nedokazuje, jen ilustruje."

