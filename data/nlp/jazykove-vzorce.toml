[[pattern.trainer]]
utterance = "Ptáte se, kolik ten kurz stojí, ale o tom to vůbec není. Jde o to, jestli chcete svobodu, nebo chcete zůstat tam, kde jste."
context = "Organizátor osobnostního semináře odpovídá zájemci na dotaz po ceně."
benign = false
marker = "Konkrétní otázka po ceně je přesunuta na úroveň obecných hodnot (svoboda), kde na ni nelze odpovědět a kde se odmítnutí jeví jako odmítnutí hodnoty."
response = "Trvat na odpovědi na úrovni otázky: požádat o částku, podmínky a možnost odstoupení a teprve potom zvažovat, k čemu by kurz byl."

[[pattern.trainer]]
utterance = "Než se pohádáme o konkrétní rozvrh, co je pro každého z nás na tom víkendu vlastně důležité? Odpočinek, čas s dětmi, nebo něco jiného?"
context = "Partner navrhuje rozhovor o tom, jak rozdělit víkend."
benign = true
marker = "Přesun k účelu je ohlášený a symetrický: obě strany jsou tázány na své hodnoty a rozhovor se pak má vrátit ke konkrétnímu plánu."
response = "Legitimní užití: hledání společného zájmu před řešením detailů; hodnoty nejsou použity k vynucení jednoho konkrétního řešení."

