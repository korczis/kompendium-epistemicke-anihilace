[[pattern.trainer]]
utterance = "Říkáš, že na tebe křičím. Kdy přesně? V kolik hodin? Jakou hlasitostí? Kolik decibelů? Když to nevíš přesně, tak se to asi nestalo."
context = "Partner reaguje na stížnost druhého na opakované křičení."
benign = false
marker = "Požadavek na stále jemnější detail se používá jako nesplnitelné kritérium důkazu, takže obecně pravdivá zkušenost je odmítnuta pro chybějící přesnost."
response = "Uvést několik konkrétních příkladů, které si člověk pamatuje, a odmítnout kritérium, podle něhož by zkušenost bez měřitelných údajů neplatila."

[[pattern.trainer]]
utterance = "Říkáte, že se v práci cítíte přehlcená. Mohla byste popsat jeden konkrétní den minulý týden, kdy to bylo nejhorší, co se ten den dělo?"
context = "Psycholožka při úvodním rozhovoru s klientkou."
benign = true
marker = "Otázka po konkrétním příkladu slouží k porozumění obecné stížnosti, nezpochybňuje její platnost a nechává klientce volbu příkladu."
response = "Legitimní užití: konkretizace zpřesňuje obraz problému; obecná zkušenost klientky přitom zůstává uznaná."

