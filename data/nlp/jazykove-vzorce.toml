[[pattern.trainer]]
utterance = "Jde tu o bezpečnost firmy, a kdo chce bezpečnou firmu, ten přece souhlasí s tím, že budeme číst soukromou poštu všech zaměstnanců."
context = "Vedoucí na poradě obhajuje plošné sledování zaměstnanců."
benign = false
marker = "Souhlas s obecnou hodnotou (bezpečnost) se bez jakéhokoli srovnání alternativ převádí na jeden konkrétní prostředek, jako by z hodnoty nutně plynul."
response = "Oddělit cíl od prostředku: přijmout hodnotu jako společnou a ptát se, jaké jiné prostředky k ní vedou a čím je navržený prostředek lepší než ostatní."

[[pattern.trainer]]
utterance = "Všichni chceme, aby děti chodily do školy bezpečně. Dobře, a teď si projděme, jaké možnosti máme: přechod, semafor, nebo jinou trasu, a co která stojí."
context = "Starostka vede veřejné setkání o dopravě u školy."
benign = true
marker = "Mluvčí výslovně pojmenuje úroveň hodnoty, na níž je shoda, a otevřeně sestupuje k několika konkrétním variantám, které nechává posoudit."
response = "Legitimní užití: shoda nahoře slouží jako výchozí bod a konkrétní řešení zůstávají předmětem srovnání a rozhodnutí účastníků."

