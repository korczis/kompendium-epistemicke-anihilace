marker = "Dotek se opakovaně a bez vědomí klientky spojoval s jejím příjemným stavem a nyní se použije ve chvíli rozhodnutí, aby nahradil věcné posouzení smlouvy."
response = "Dát si mezi pocit a podpis čas a vzdálenost, smlouvu číst o samotě a posuzovat podle čísel, a opakovaný dotek nebo gesto v klíčové chvíli brát jako důvod ke zpomalení."

[[pattern.trainer]]
utterance = "Než začneme, řeknu vám, že na konci každého cvičení zazvoní tenhle zvonek. Kdyby vám to bylo nepříjemné, můžeme ho klidně vynechat."
context = "Lektorka relaxačního kurzu vysvětluje skupině průběh lekce."
benign = true
marker = "Signál se ohlašuje předem, jeho účel je vysvětlen a účastníci ho mohou odmítnout; nic se nespojuje se stavem bez jejich vědomí."
response = "Jde o neškodné užití: otevřeně dohodnutý signál, o kterém všichni vědí a který mohou změnit; chybí skrytost i cíl ovlivnit rozhodnutí."
