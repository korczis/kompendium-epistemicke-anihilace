[[pattern.trainer]]
utterance = "NLP je vědecky prověřená metoda, používají ji vrcholoví sportovci, armáda i velké firmy, takže o účinku není co řešit."
context = "Prodejce výcviku na úvodním semináři odpovídá na otázku účastníka."
benign = false
marker = "Na místě kontrolovaných studií stojí popularita a jména prestižních uživatelů; slovo „vědecky“ se užívá bez odkazu na jakýkoli výzkum."
response = "Požádat o konkrétní kontrolované studie a vědět, že souhrnné přehledy výzkumu klíčová tvrzení NLP nepodpořily; rozšířenost metody není doklad jejího účinku."

[[pattern.trainer]]
utterance = "Kontrolované studie většinu tvrzení NLP nepodpořily, takže tohle cvičení nabízím jen jako trénink pozornosti v rozhovoru, ne jako léčbu."
context = "Lektorka komunikačního kurzu vysvětluje, proč do programu zařadila jedno cvičení z NLP."
benign = true
marker = "Mluvčí uvádí stav důkazů otevřeně a sám omezuje, co si od cvičení slibovat; neprodává léčebný účinek."
response = "Jde o legitimní užití: deklarovaná nejistota a vymezení účelu umožňují účastníkům informovanou volbu."

