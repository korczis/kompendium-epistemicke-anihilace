benign = false
marker = "Směr pohledu se vykládá jako důkaz lži a slouží k odmítnutí výpovědi, ačkoli výzkum vztah mezi směrem pohledu a lhaním nenašel."
response = "Odmítnout směr pohledu jako ukazatel věrohodnosti a posuzovat výpověď podle obsahu, konzistence a nezávislých dokladů; v posudku uvést, že tvrzení nemá empirickou oporu."

[[pattern.trainer]]
utterance = "Lidé při přemýšlení často uhýbají pohledem, ale co si právě vybavují, ani jestli mluví pravdu, se z toho podle výzkumu vyčíst nedá."
context = "Lektor kurzu vedení rozhovorů pro sociální pracovníky odpovídá na dotaz účastnice."
benign = true
marker = "Výrok odděluje běžné pozorování, že lidé při přemýšlení odvracejí pohled, od nedoložených výkladů jeho směru."
response = "Jde o benigní a věcně správné shrnutí výzkumu, které chrání před chybným hodnocením lidí."

