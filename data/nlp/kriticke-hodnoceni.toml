context = "Klinická psycholožka vysvětluje pacientovi, proč mu nedoporučuje terapii nabízenou na internetu."
benign = true
marker = "Výsledek průzkumu se uvádí přesně, včetně jeho povahy a meze, a kombinuje se s dalšími druhy důkazů."
response = "Jde o benigní a korektní užití: expertní konsenzus je uveden jako jeden z podkladů, ne jako konečný důkaz."

