response = "Uznat, že expertní konsenzus není experiment, ale ptát se, kde jsou kontrolované studie, které by ho vyvrátily; spokojenost klientů neodlišuje účinek metody od placeba a přirozeného zlepšení."

[[pattern.trainer]]
