[[pattern.trainer]]
utterance = "Akademici NLP nerozumějí, protože ho zkoumají v laboratoři. Funguje jen v rukou certifikovaného mistra, a kdo nemá výsledky, nedělal to správně."
context = "Vedoucí výcvikového institutu odpovídá na článek, který shrnuje negativní výsledky výzkumu."
benign = false
marker = "Každý negativní výsledek se dodatečně vysvětlí chybou zkoumajícího nebo uživatele, takže tvrzení nelze vyvrátit; autorita certifikace nahrazuje ověření."
response = "Rozpoznat imunizaci proti vyvrácení a žádat předem stanovené podmínky, za nichž by metoda neuspěla; nevyvratitelné tvrzení nic nevysvětluje."

[[pattern.trainer]]
utterance = "Některé myšlenky NLP jsou převzaté z uznávaných terapií, ale to, co NLP tvrdí navíc, se při testech nepotvrdilo, a tak to také prezentujeme."
context = "Univerzitní pedagog v semináři kritického myšlení komentuje kurz, o který se studenti zajímají."
benign = true
marker = "Rozlišuje se mezi převzatými, jinde ověřenými prvky a vlastními tvrzeními NLP, která testy nepodpořily."
response = "Jde o benigní, vyvážené hodnocení, které nepřehání ani kritiku, ani nároky metody."

