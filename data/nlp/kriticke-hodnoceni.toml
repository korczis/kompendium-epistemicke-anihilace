[[pattern.trainer]]
utterance = "Jste jednoznačně vizuální typ, poznala jsem to z vašich slov, a proto vám tenhle kurz sedne lépe než ostatním. Bez něj se nikdy pořádně neučíte."
context = "Konzultantka vzdělávací agentury u vstupního pohovoru se zájemcem o drahý kurz."
benign = false
marker = "Diagnóza „typu“ z několika slov se podává jako hotový fakt a hned se z ní vyvozuje nutnost koupit konkrétní produkt; výzkum preferovaného systému tuto jistotu nepodporuje."
response = "Vědět, že výzkum nenašel spolehlivý způsob, jak preferovaný systém určit, ani prospěch z přizpůsobení se mu; rozhodovat se podle obsahu a ceny kurzu, ne podle přiděleného typu."

[[pattern.trainer]]
utterance = "Všimla jsem si, že často mluvíte o tom, jak věci vidíte. Je to jen postřeh, výzkum žádné stálé typy nepotvrdil, tak mě opravte, jestli se pletu."
context = "Terapeutka v supervizi popisuje, jak sdílela s klientem svůj dojem z jeho vyjadřování."
benign = true
marker = "Pozorování se podává jako hypotéza s výslovnou výhradou ke stavu výzkumu a s pozváním k opravě."
response = "Jde o benigní užití: jazykový postřeh zůstává podnětem k rozhovoru, ne diagnózou ani základem pro nátlak."

