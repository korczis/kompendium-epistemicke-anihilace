[[pattern.trainer]]
utterance = "Kdybys mě pořád neprovokovala, nemusel bych křičet. Ty mě k tomu dovedeš pokaždé."
context = "Partner po hádce, v níž se choval agresivně."
benign = false
marker = "Vlastní jednání mluvčího je podáno jako nutný následek chování druhého; odpovědnost se přesouvá na adresáta a mechanismus spojení se neuvádí."
response = "Oddělit spouštěč od volby: jednání člověka je jeho odpovědností, i když reaguje na cizí chování; vztah s takto opakovaným vzorcem posoudit s odborníkem."

[[pattern.trainer]]
utterance = "Když jsi tu zprávu přeposlal bez kontextu, cítil jsem se v té diskusi zaskočený. Příště bych o ní rád věděl dřív."
context = "Kolega mluví s kolegou o nedorozumění v práci."
benign = true
marker = "Mluvčí spojuje událost s vlastním prožitkem, ale prožitek si ponechává jako svůj a připojuje konkrétní prosbu místo obvinění."
response = "Jde o benigní užití: vztah mezi událostí a pocitem je popsán bez tvrzení, že druhý pocit způsobil a odpovídá za něj."

