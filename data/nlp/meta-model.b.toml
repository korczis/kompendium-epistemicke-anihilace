[[pattern.trainer]]
utterance = "Odejít od nás prostě nemůžeš. Venku by ses neuživil a nikdo by tě nevzal, to přece víš sám."
context = "Vedoucí uzavřené skupiny mluví se členem, který zvažuje odchod."
benign = false
marker = "Hranice možného jednání („nemůžeš“) je podána jako fakt, bez udání, co přesně brání a podle čeho to mluvčí ví; nemožnost slouží udržení člověka ve skupině."
response = "Oddělit nemožnost od obavy: ptát se, co konkrétně by odchodu bránilo, a ověřit to u lidí mimo skupinu, kteří odchodem prošli."

[[pattern.trainer]]
utterance = "Říkáte, že s tím nemůžete nic udělat. Co by se podle vás muselo změnit, aby to aspoň trochu šlo?"
context = "Terapeutka v rozhovoru s klientem, který popisuje bezvýchodnou situaci."
benign = true
marker = "Operátor možnosti v řeči klienta je zachycen a vrácen otázkou, která otevírá podmínky možného, nikoli tlakem na rozhodnutí."
response = "Jde o legitimní užití: otázka zkoumá, co klient prožívá jako překážku, a nechává na něm, zda a jak hranici přehodnotí."

