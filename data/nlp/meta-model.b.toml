[[pattern.trainer]]
utterance = "Když máš pochybnosti o vedení, znamená to jen, že ještě nejsi dost oddaný. Kdo opravdu věří, ten se neptá."
context = "Starší člen skupiny odpovídá nováčkovi na kritickou otázku."
benign = false
marker = "Pozorovatelné chování (pochybnost, otázka) je ztotožněno s vnitřní vadou (nedostatek oddanosti); rovnítko je podáno jako samozřejmost a kritika se tím mění v symptom."
response = "Rozpojit rovnítko: zeptat se, podle čeho přesně pochybnost znamená nedostatek oddanosti, a trvat na tom, že otázka je otázka, ne diagnóza."

[[pattern.trainer]]
utterance = "Pro účely tohoto projektu budeme za hotový úkol považovat to, co prošlo testy a revizí. Souhlasíte s takovou definicí?"
context = "Vedoucí vývojového týmu na úvodní schůzce."
benign = true
marker = "Spojení pozorovatelného znaku s významem („hotové“) je výslovně dohodnuto, omezeno na kontext a otevřeno ke schválení."
response = "Jde o benigní užití: operační definice je viditelná, sdílená a změnitelná, nevydává se za skrytou pravdu o lidech."

