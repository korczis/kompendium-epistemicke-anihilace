[[pattern.trainer]]
utterance = "Nemusíš nic říkat, vidím na tobě, že ve skutečnosti chceš zůstat. Jen si to zatím nepřiznáš."
context = "Partner reaguje na oznámení druhého, že chce vztah ukončit."
benign = false
marker = "Mluvčí tvrdí, že zná vnitřní stav druhého lépe než on sám, neuvádí, z čeho to usuzuje, a jeho výklad přebíjí výslovné sdělení druhého."
response = "Trvat na tom, že o vlastním přání rozhoduje ten, kdo ho má; vlastní výrok zopakovat a nenechat ho přepsat cizím výkladem."

[[pattern.trainer]]
utterance = "Připadá mi, že vás ta zpráva rozladila, mýlím se? Klidně mě opravte."
context = "Vedoucí týmu po poradě, na níž kolegyně ztichla."
benign = true
marker = "Domněnka o vnitřním stavu je výslovně označena jako dojem a podána k ověření; druhý má poslední slovo."
response = "Jde o benigní užití: hypotéza o pocitech druhého je otevřená opravě a nenahrazuje jeho vlastní popis."

