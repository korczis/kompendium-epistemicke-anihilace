[[pattern.trainer]]
utterance = "Než se zase začneš vymlouvat jako minule, řekni mi rovnou, proč jsi to zkazil."
context = "Nadřízený otevírá rozhovor s podřízeným o nepovedeném úkolu."
benign = false
marker = "Věta předpokládá jako dané, že se adresát vymlouvá, že to dělal už dřív a že úkol zkazil právě on; otázka „proč“ nechává k diskusi jen důvod, ne samotný fakt."
response = "Pojmenovat předpoklady jeden po druhém a oddělit je od otázky: nejdřív ověřit, co se stalo a kdo za co odpovídal, teprve pak hledat důvody."

[[pattern.trainer]]
utterance = "Říkáte, že se zase budete stydět. Co vás vede k předpokladu, že se to bude opakovat?"
context = "Psycholožka v rozhovoru s klientkou před důležitým vystoupením."
benign = true
marker = "Odbornice zachytí presupozici v řeči klientky („zase“) a vrací ji k prozkoumání, místo aby na ni stavěla."
response = "Jde o legitimní užití: skrytý předpoklad se zviditelní a klientka sama posoudí, zda platí."

