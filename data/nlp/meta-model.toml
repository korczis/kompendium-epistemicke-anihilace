[[pattern.trainer]]
utterance = "Ty pořád říkáš, že ti něco vadí. Co přesně? Kdy přesně? Kdo přesně? Dokud to neřekneš přesně, nemáš o čem mluvit."
context = "Partner v hádce odpovídá na stížnost druhého řadou upřesňujících otázek."
benign = false
marker = "Upřesňující otázky meta-modelu chrlí jedna za druhou bez zájmu o odpověď a slouží k tomu, aby stížnost druhého neobstála, ne aby byla pochopena."
response = "Pojmenovat, že se otázky staly výslechem, a odpovídat vlastním tempem; nárok na vyslyšení nezávisí na tom, zda člověk napoprvé najde dokonale přesná slova."

[[pattern.trainer]]
utterance = "Říkáte, že se to v práci zhoršilo. Můžete popsat nějakou nedávnou situaci, kdy jste to zhoršení poznala?"
context = "Psycholožka v úvodním rozhovoru s klientkou."
benign = true
marker = "Jediná otevřená otázka vrací obecné tvrzení ke konkrétní zkušenosti a nechává klientce volbu, co a jak podrobně popíše."
response = "Jde o legitimní užití: upřesnění slouží porozumění mluvčímu, je vedeno v jeho tempu a nenahrazuje jeho výklad výkladem tazatele."

[[pattern.trainer]]
utterance = "Všichni vědí, že tohle se nedělá. Musíš se rozhodnout, jestli k nám patříš."
context = "Vedoucí skupiny k členovi, který vyjádřil pochybnost."
benign = false
marker = "Věta kupí několik kategorií, na které meta-model upozorňuje: neurčené „všichni“, soud bez původce a nutnost bez uvedeného důvodu."
response = "Rozložit větu na otázky pro sebe: kdo přesně to ví, kdo to pravidlo stanovil a co by se doopravdy stalo, kdyby člověk volil jinak."

