[[pattern.trainer]]
utterance = "Tvoje nedůvěra ničí náš vztah. Dokud ji nepřekonáš, nemůže mezi námi být žádná blízkost."
context = "Partner reaguje na otázku druhého, kde trávil noc."
benign = false
marker = "Konkrétní jednání (ptát se, pochybovat) se mění v podstatné jméno „nedůvěra“, které vypadá jako trvalá vlastnost jednoho z partnerů, a mizí, kdo komu čím nedůvěru vyvolal."
response = "Vrátit podstatné jméno zpět do děje: o jakou konkrétní otázku šlo, co jí předcházelo a zda je otázka po místě pobytu sama o sobě něco, co je třeba „překonat“."

[[pattern.trainer]]
utterance = "Rozhodnutí o přestěhování je pořád ve hře, ještě se o něm budeme bavit oba."
context = "Manželka mluví s manželem o plánech na příští rok."
benign = true
marker = "Podstatné jméno „rozhodnutí“ nese probíhající děj, ale obě strany vědí, kdo rozhoduje, a výslovně zůstává otevřené."
response = "Jde o běžnou nominalizaci: zkracuje řeč, nezakrývá aktéry a nepředstírá, že děj je hotová věc mimo vliv mluvčích."

