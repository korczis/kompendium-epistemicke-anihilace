benign = false
marker = "Mluvčí systematicky přesouvá zdroj hodnocení z člověka na sebe a jeho vlastní soudnost označuje za nespolehlivou, čímž pěstuje závislost na vnější referenci."
response = "Rozpoznat, že nejde o zpětnou vazbu, ale o přenos autority; udržet si vlastní kritéria, porovnávat výsledky s vnějšími standardy a hledat názor lidí mimo skupinu."

[[pattern.trainer]]
utterance = "Než vám řeknu, co si o tom myslím já, zajímalo by mě, podle čeho sám poznáte, že se vám ten projekt povedl."
