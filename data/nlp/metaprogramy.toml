response = "Žádat doklady o výsledcích postupu včetně neúspěšných případů a posoudit, zda je vůbec možné, aby postup selhal sám o sobě; nevyvratitelný systém je varovný znak."

[[pattern.trainer]]
utterance = "K té operaci vám mohu dát přesný postup přípravy, a když budete chtít, probereme i jiné možnosti léčby, které připadají v úvahu."
context = "Lékař vysvětluje pacientovi plánovaný zákrok."
benign = true
marker = "Mluvčí nabízí jak strukturovaný postup, tak výčet skutečných alternativ a nechává pacienta, aby si zvolil, co potřebuje."
response = "Benigní užití: přizpůsobuje formu informace potřebě pacienta, alternativy jsou skutečné a rozhodnutí zůstává na něm."

