[[pattern.trainer]]
utterance = "Vy přece nechcete skončit jako ti ostatní, kterým to celé spadlo na hlavu. Proto se musíte rozhodnout ještě dnes, jinak už vás nic neochrání."
context = "Prodejce finančního produktu na schůzce s váhajícím zájemcem."
benign = false
marker = "Nabídka se rámuje výhradně jako únik před hrozbou, která se zveličuje, a strach z ní se spojuje s časovým tlakem, místo aby se popsalo, co produkt skutečně přináší."
response = "Odložit rozhodnutí, požádat o písemný popis výnosů i rizik a posoudit hrozbu podle nezávislých údajů, ne podle obrazu, který vykreslil prodejce."

[[pattern.trainer]]
utterance = "Řekl jste mi hlavně, čeho se chcete zbavit. Zkusme si teď popsat i to, jak by vypadal den, kdy už vás to netrápí."
context = "Psycholog v úvodním rozhovoru s klientem, který mluví jen o potížích."
benign = true
marker = "Terapeut si všímá převahy formulací ve směru od problému a nabízí doplnit obraz žádoucího stavu, aniž by klientovi vnucoval vlastní cíl."
response = "Benigní užití: rozšiřuje popis o pozitivně formulovaný cíl, ponechává rozhodnutí klientovi a nepracuje se strachem ani s nátlakem."

