benign = true
marker = "Otázka zve druhého, aby nejdřív formuloval vlastní měřítko úspěchu, a vnější hodnocení nabízí až potom jako doplněk."
response = "Benigní užití: posiluje vnitřní referenci a samostatnost a vlastní názor školitele nezamlčuje, jen jej neklade na první místo."

