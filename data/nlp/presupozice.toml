marker = "Časová věta předpokládá, že výsledky dorazí, což je běžná a ověřitelná součást postupu."
response = "Jde o neškodné užití: presupozice se týká zavedené procedury, nikoli sporného hodnocení člověka, a slib je kontrolovatelný."

