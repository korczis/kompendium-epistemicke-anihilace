[[pattern.trainer]]
utterance = "Souhlasíš, že ti jde o rodinu. A kdo chce rodině to nejlepší, investuje do budoucnosti. A kdo investuje, nečeká, až bude pozdě, takže podepíšeš dnes."
context = "Prodejce finančního produktu na schůzce v domácnosti klienta."
benign = false
marker = "Od obecné hodnoty, se kterou nelze nesouhlasit, vede řada malých kroků, z nichž každý vypadá jako logický důsledek předchozího, až ke konkrétnímu závazku bez času na rozmyšlenou."
response = "Rozpojit řetěz: souhlas s hodnotou neznamená souhlas s produktem; každý článek posoudit zvlášť a rozhodnutí o podpisu odložit."

[[pattern.trainer]]
utterance = "Zatím věříte, že se nikdy nenaučíte mluvit před lidmi. Co by se muselo stát, abyste aspoň připustil, že malá porada je zvládnutelná?"
context = "Kouč na sezení s klientem, který sám chce zmírnit trému."
benign = true
marker = "Mezi současným a žádoucím přesvědčením hledá mezilehlé, menší přesvědčení, které klient může sám zvážit a odmítnout."
response = "Benigní užití: cíl si stanovil klient, kroky navrhuje on sám a každý mezistupeň může odmítnout bez tlaku."

