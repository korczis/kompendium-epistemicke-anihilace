[[pattern.trainer]]
utterance = "Že ti nepřijde správné lhát zákazníkům, je jen omezující přesvědčení z tvé staré mapy. Úspěšní lidé mají mapy pružnější."
context = "Vedoucí prodejního týmu při hodnocení nového zaměstnance."
benign = false
marker = "Morální přesvědčení a hranice se prohlašují za pouhou mapu, kterou je třeba změnit, zatímco přesvědčení mluvčího o tom, co je úspěch, se za mapu nepovažuje."
response = "Uplatnit princip symetricky: i přesvědčení vedoucího je mapa; hodnoty se posuzují podle důsledků pro druhé, ne podle toho, komu brání v zisku."

[[pattern.trainer]]
utterance = "Když říkáš, že lidi tě vždycky zklamou, je to tvoje zobecnění z několika zkušeností. Napadají tě i lidé, kteří tě nezklamali?"
context = "Terapeutka při sezení s klientem po rozpadu dlouhého přátelství."
benign = true
marker = "Přesvědčení se pojmenuje jako zobecnění a hledají se protipříklady v klientově vlastní zkušenosti; terapeutka nenabízí svou mapu jako správnou."
response = "Benigní užití: rozlišení zkušenosti a zobecnění posiluje schopnost klienta testovat vlastní závěry."

