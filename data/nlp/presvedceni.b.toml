[[pattern.trainer]]
utterance = "Ty otázky, které ti nasadila rodina, jsou myšlenkový virus. Čím víc o nich přemýšlíš, tím víc se šíří, takže je prostě nepouštěj do hlavy."
context = "Starší člen uzavřené skupiny mluví s novým členem, který po návštěvě rodiny pochybuje."
benign = false
marker = "Pochybnosti a kritické otázky se označují za nákazu, kterou je třeba izolovat, místo aby se zodpověděly; metafora viru tak umlčuje přemýšlení."
response = "Trvat na tom, že otázka se posuzuje podle obsahu, ne podle nálepky; probrat pochybnosti s lidmi mimo skupinu."

[[pattern.trainer]]
utterance = "To přesvědčení, že na matematiku nemáte hlavu, jste podle všeho převzala od učitelky na základní škole. Ověřme si, jestli pro ně dnes máte nějaký doklad."
context = "Studijní poradce mluví se studentkou, která se vyhýbá povinnému předmětu."
benign = true
marker = "Metafora převzatého přesvědčení vede k ověření dokladů a nevylučuje, že přesvědčení může mít oporu; rozhodnutí zůstává studentce."
response = "Benigní užití: přesvědčení se nevyhlašuje za nemoc, ale testuje se jako hypotéza vůči současné zkušenosti."

