[[pattern.trainer]]
utterance = "Ta nemoc je jen vnější podoba vašeho přesvědčení. Až ho změníme na mém kurzu, chemoterapii už nebudete potřebovat."
context = "Lektor seminářů osobního rozvoje při rozhovoru s účastnicí po onkologické diagnóze."
benign = false
marker = "Nemoc se vykládá jako výsledek přesvědčení a změna přesvědčení se nabízí jako náhrada léčby s ověřenou účinností; pacientce se tím zároveň přičítá vina za nemoc."
response = "Nepřerušovat léčbu, vyžádat si doklady o účinnosti ze systematických přehledů a probrat nabídku s ošetřujícím lékařem; přesvědčení může ovlivnit prožívání, ne nahradit terapii."

[[pattern.trainer]]
utterance = "Vaše obavy z léčby jsou pochopitelné a je dobré o nich mluvit. Psychologická podpora vám může ulehčit snášení, ale léčbu sama nenahrazuje."
context = "Onkologická sestra při edukaci pacienta před zahájením léčby."
benign = true
marker = "Psychologická stránka nemoci se uznává, ale je jasně oddělena od léčby a nepodává se jako její náhrada."
response = "Benigní užití: podpora zvládání a očekávání je doplňkem léčby s ověřenou účinností, nikoli příslibem vyléčení."

