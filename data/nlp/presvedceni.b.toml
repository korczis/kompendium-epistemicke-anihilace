[[pattern.trainer]]
utterance = "Beze mě bys to nezvládla, to přece víš. A i kdyby se ti to nějak povedlo, zasloužila by sis to po tom všem, co jsi udělala?"
context = "Partner v kontrolujícím vztahu reaguje na plán druhé strany najít si vlastní práci."
benign = false
marker = "Ve dvou větách se vkládá bezmoc (nezvládneš to sama) i bezcennost (nezasloužíš si to); cíl se nezpochybňuje věcně, ale přes schopnosti a hodnotu člověka."
response = "Oddělit cíl od posouzení vlastní osoby, ověřit své schopnosti u lidí mimo vztah a brát opakované zpochybňování hodnoty jako znak kontroly, ne jako informaci o sobě."

[[pattern.trainer]]
utterance = "Říkáte, že nemá smysl to zkoušet a že byste si zlepšení stejně nezasloužil. Můžeme se podívat, odkud ta dvě přesvědčení přišla a co pro ně a proti nim mluví?"
context = "Psycholog v ambulanci při rozhovoru s pacientem s depresivními příznaky."
benign = true
marker = "Odborník pojmenovává beznaděj a pocit bezcennosti jako přesvědčení klienta a nabízí jejich společné zkoumání, nic nevnucuje."
response = "Benigní užití: přesvědčení se zkoumají jako hypotézy s klientem, v rámci léčby s ověřenou účinností a s posouzením rizika."

