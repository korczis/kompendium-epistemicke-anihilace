[[pattern.trainer]]
utterance = "A co by se nestalo, kdybyste tu smlouvu nepodepsal? Přesně, nezmizela by ta starost o rodinu, kterou cítíte už teď."
context = "Pojišťovací poradce na schůzce s váhajícím klientem."
benign = false
marker = "Ze čtyř kombinací rozhodování se vybírá jen ta, která zdůrazní ztrátu při odmítnutí, a dvojitý zápor ztíží její rozbor; otázku hned zodpoví sám mluvčí."
response = "Projít všechny čtyři možnosti sám a v klidu, vrátit otázkám kladnou podobu a porovnat nabídku s alternativami mimo rozhovor."

[[pattern.trainer]]
utterance = "Než se rozhodnete o přestěhování, zkuste si sepsat, co by se stalo, kdybyste šli, a co kdybyste zůstali, i to, co by se v obou případech nezměnilo."
context = "Rodinná poradkyně při rozhovoru s párem zvažujícím stěhování za prací."
benign = true
marker = "Všechny kombinace se procházejí vyváženě, rozhodují sami klienti a poradkyně žádnou možnost neupřednostňuje."
response = "Benigní užití: rozvaha pro a proti slouží úplnosti úvahy a nevede k předem zvolenému výsledku."

