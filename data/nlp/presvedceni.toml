[[pattern.trainer]]
utterance = "Tvoje pochybnosti jsou jen fáze cyklu, kterou prochází každý, kdo roste. Kdo v té fázi odejde, nikdy nedojde k tomu, čemu tady věříme my."
context = "Vedoucí rozvojové skupiny reaguje na člena, který začal zpochybňovat učení skupiny."
benign = false
marker = "Model fází změny přesvědčení se použije k tomu, aby pochybnost dostala předem určený cíl: nevede k přezkoumání, ale k přijetí přesvědčení skupiny."
response = "Brát pochybnost jako legitimní stav, který může skončit i odmítnutím učení, a ověřit si, zda skupina připouští odchod bez sankcí a bez ztráty vztahů."

[[pattern.trainer]]
utterance = "Je v pořádku, že si teď nejste jistý. Názory se během života mění a nemusíte se rozhodnout dnes; můžeme si jen popsat, co vás drží a co vás znejišťuje."
context = "Psycholog s klientem, který pochybuje o dlouholetém přesvědčení o své neschopnosti."
benign = true
marker = "Mluvčí uznává, že přesvědčení se mění v čase, ale nestanoví, k jakému novému přesvědčení má klient dojít, a ponechává rozhodnutí na něm."
response = "Legitimní užití: popis proměny přesvědčení slouží k normalizaci nejistoty, ne k jejímu nasměrování na předem vybraný obsah."

