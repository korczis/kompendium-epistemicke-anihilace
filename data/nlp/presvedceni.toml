[[pattern.trainer]]
utterance = "Že nechceš podepsat, není rozumná úvaha, ale tvoje limitující přesvědčení o penězích. Úspěšní lidé se nerozhodují podle starých strachů."
context = "Prodejce koučovacího programu odpovídá zájemci, který si chce smlouvu promyslet."
benign = false
marker = "Každá námitka se přejmenuje na limitující přesvědčení, takže opatrnost i rozumná kritika ztrácejí platnost dřív, než se posoudí jejich obsah."
response = "Trvat na tom, že námitka se posuzuje podle obsahu: požádat o písemné podmínky, vzít si čas a zeptat se, jaký důkaz by prodejce uznal za oprávněnou pochybnost."

[[pattern.trainer]]
utterance = "Říkáte, že na matematiku nemáte hlavu. Můžeme se podívat, odkud to přesvědčení máte a jestli vaše známky v posledním roce s ním opravdu souhlasí?"
context = "Školní psycholožka se studentem před maturitou."
benign = true
marker = "Přesvědčení se pojmenuje jako hypotéza a porovná se s konkrétními doklady; výsledkem může být i zjištění, že přesvědčení je přiměřené."
response = "Benigní užití: přesvědčení se testuje proti zkušenosti, nikoli se automaticky prohlásí za chybu, a student si závěr dělá sám."

