[[pattern.trainer]]
utterance = "Na škále od jedné do deseti, jak moc si zasloužíš být bohatý? Šestka? Tak tady vidíš, proč stojíš na místě. Ta čtyři chybějící čísla odstraní až pokročilý program."
context = "Lektor motivačního semináře s účastníkem před celým sálem."
benign = false
marker = "Hodnocení přesvědčení se vede veřejně, nízké číslo se vydává za diagnózu a jako jediné řešení se nabízí placené pokračování kurzu."
response = "Rozlišit sebehodnocení od diagnózy: odmítnout veřejné hodnocení vlastní hodnoty a rozhodovat o dalším kurzu až mimo sál, podle ověřitelných výsledků."

[[pattern.trainer]]
utterance = "Než se pustíte do studia při práci, zkuste si sám pro sebe projít, jestli to opravdu chcete, jestli to považujete za proveditelné a co by to stálo vaši rodinu."
context = "Kariérní poradkyně na konzultaci s dospělým uchazečem o studium."
benign = true
marker = "Otázky na žádoucnost, proveditelnost a dopady cíle slouží rozhodnutí samotného člověka; poradkyně nevyhodnocuje odpovědi a nic za ně neprodává."
response = "Benigní užití: strukturovaná sebereflexe před rozhodnutím, jejíž výsledek patří tazateli a může vést i k odložení cíle."

