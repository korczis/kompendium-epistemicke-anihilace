[[pattern.trainer]]
utterance = "To, co sis myslela, než jsi k nám přišla, patří do muzea. Tehdejší ty už neexistuje, tak proč by ses měla ptát na její názor?"
context = "Starší členka komunity mluví s nováčkem, kterému rodina vyčítá změnu chování."
benign = false
marker = "Předchozí přesvědčení i předchozí já se prohlásí za uzavřenou minulost, takže jejich hlas ztrácí váhu jako možný korektiv současného učení."
response = "Považovat dřívější názory za živý zdroj srovnání, ne za exponát; mluvit s lidmi, kteří člověka znali dřív, a ptát se, proč by se k nim nemělo smět vrátit."

[[pattern.trainer]]
utterance = "Kdysi jsem si myslel, že bez dokonalého výkonu nemám cenu. Dnes to vidím jako něco, co mi tehdy dávalo smysl, a už se tím neřídím."
context = "Bývalý vrcholový sportovec popisuje v podpůrné skupině svou zkušenost."
benign = true
marker = "Mluvčí sám a dobrovolně označuje vlastní dřívější přesvědčení za minulé a uznává, že tehdy mělo svůj důvod; nikdo mu tento výklad nepředepisuje."
response = "Benigní užití: vlastní ohlédnutí za překonaným přesvědčením, které zachovává kontinuitu životního příběhu a nevyžaduje převzetí cizího učení."

