[[pattern.trainer]]
utterance = "Když tě to, co říká mistr, bolí, znamená to, že to tvé ego potřebuje slyšet. Bolest je důkaz, že učení zabírá."
context = "Mentor duchovní skupiny vysvětluje členovi jeho nepříjemné pocity po veřejném pokárání."
benign = false
marker = "Prožitek (bolest) se pevně spojí s významem, který potvrzuje učení; jakákoli reakce člena se tím stává dokladem pro skupinu, nikdy proti ní."
response = "Zeptat se, jaký prožitek by naopak ukázal, že učení škodí; pokud žádný, je význam postaven tak, aby nešel vyvrátit, a vyžaduje pohled zvenčí."

[[pattern.trainer]]
utterance = "Pro mě je to, že spolu po hádce mluvíme, znamení, že nám na sobě záleží. Ale chápu, jestli to pro tebe znamená spíš únavu, tak si to řekněme."
context = "Jeden z partnerů v klidném rozhovoru o tom, jak oba prožívají konflikty."
benign = true
marker = "Mluvčí výslovně označí význam jako svůj vlastní a připustí, že druhý může stejné události přisuzovat jiný význam."
response = "Benigní užití: přesvědčení o významu se sdílí jako osobní výklad a otevírá se rozhovoru, ne vnucuje."

