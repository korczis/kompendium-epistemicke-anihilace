[[pattern.trainer]]
utterance = "Kdybys mě nerozčiloval, nemusel bych křičet. Takhle to vždycky způsobíš ty, tak se nediv, co se pak děje."
context = "Partner po hádce vysvětluje druhému, proč došlo k výbuchu."
benign = false
marker = "Příčina vlastního jednání se přesune na druhého a zobecní se na „vždycky“, takže odpovědnost za násilné chování nese ten, kdo ho snáší."
response = "Oddělit spouštěč od rozhodnutí: vlastní pocit nikoho neopravňuje ke křiku; vést si záznam událostí a hledat oporu mimo vztah."

[[pattern.trainer]]
utterance = "Myslím, že mě ta zkouška rozhodila hlavně proto, že jsem tři noci skoro nespal. Příště to zkusím naplánovat jinak a uvidím, jestli to pomůže."
context = "Student si se spolužákem rozebírá nepovedený test."
benign = true
marker = "Kauzální vysvětlení je formulováno jako hypotéza, týká se vlastního jednání a nabízí ověření při další příležitosti."
response = "Benigní užití: přesvědčení o příčině zůstává otevřené ověření a nevede k přenášení viny na druhé."

