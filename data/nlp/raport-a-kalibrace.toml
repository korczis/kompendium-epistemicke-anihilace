[[pattern.trainer]]
utterance = "Jste unavená, máte toho moc a cítíte, že takhle to dál nejde. A proto víte, že je načase udělat ten krok a přidat se k nám."
context = "Náborářka skupiny osobního rozvoje mluví s ženou po přednášce."
benign = false
marker = "Řada pravdivých, ověřitelných popisů stavu druhé (provázení) je spojena slovem „a proto“ s cílem mluvčí, který z popisu nevyplývá (vedení)."
response = "Oddělit popis vlastní situace, se kterým lze souhlasit, od závěru, který z něj nevyplývá; o vstupu rozhodnout zvlášť a s odstupem."

[[pattern.trainer]]
utterance = "Slyším, že vás bolí záda a že se bojíte operace. Můžeme probrat i jiné možnosti, nebo si to nejdřív nechat projít hlavou, jak chcete."
context = "Lékař v ambulanci mluví s pacientem o dalším postupu."
benign = true
marker = "Lékař shrne zkušenost pacienta a nabídne několik cest včetně odkladu; vedení zůstává nabídkou, o níž rozhoduje pacient."
response = "Benigní užití: provázení slouží porozumění a navazující návrh je otevřený, s výslovnou možností nesouhlasit."

