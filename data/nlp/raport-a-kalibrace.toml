benign = true
marker = "Terapeutka nahlas pojmenuje, co dělá, nabídne společné zpomalení dechu a nechá klientovi volbu; cílem je regulace úzkosti."
response = "Benigní užití: dechová regulace je otevřená, dobrovolná a slouží zklidnění, ne vlivu na rozhodnutí."

