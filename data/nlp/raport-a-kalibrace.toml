[[pattern.trainer]]
utterance = "Na kurzu nás učili, že když druhý dýchá, můžete mu do rytmu poklepávat prstem, a on si toho nevšimne, ale bude vám víc věřit."
context = "Absolvent víkendového kurzu vlivu líčí kolegovi, co se naučil."
benign = false
marker = "Provázení jednoho kanálu (dech) jiným kanálem (pohyb prstu) je výslovně popsáno jako skryté a určené ke zvýšení důvěry bez vědomí druhého."
response = "Rozpoznat, že slib skrytého účinku je tvrzení kurzu bez doložení; posuzovat důvěru podle činů a obsahu, ne podle pocitu souladu."

[[pattern.trainer]]
utterance = "Když syn mluví překotně, zpomalím a jen mu rukou naznačím klidný rytmus. Neopičím se po něm, ale dám mu najevo, že ho vnímám."
context = "Rodič popisuje v rodičovské skupině, jak mluví s dospívajícím synem."
benign = true
marker = "Rodič odpovídá na rytmus druhého jiným kanálem otevřeně a s cílem zklidnit, nikoli získat souhlas s něčím."
response = "Benigní užití: přizpůsobení je viditelné, slouží regulaci napětí a syn může rozhovor kdykoli ukončit."

