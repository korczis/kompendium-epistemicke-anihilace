[[pattern.trainer]]
utterance = "Vy jste vizuální typ, to je hned vidět. Proto vám to ukážu v obrazech, a až to uvidíte jasně, sám poznáte, že tahle investice je pro vás."
context = "Finanční poradce na schůzce s klientem, kterého zná deset minut."
benign = false
marker = "Mluvčí z několika slov zařadí druhého do smyslového typu, opakuje zrakové predikáty a vydává sladění řeči za důvod, proč má nabídka sedět."
response = "Rozpoznat, že typologie podle predikátů není doložená; posoudit investici podle čísel a rizik, ne podle toho, jak je podaná."

[[pattern.trainer]]
utterance = "Říkáte, že vám to celé nesedí a že to neumíte uchopit. Co přesně vám na tom nesedí? Zkusím to říct jinými slovy."
context = "Učitelka mluví se studentem, který nerozumí zadání."
benign = true
marker = "Převzetí slov studenta slouží k upřesnění, co mu brání v porozumění, a vede k otázce, ne k závěru."
response = "Benigní užití: převzetí výrazu je běžné aktivní naslouchání a ověřuje porozumění; nic se tím neprodává."

