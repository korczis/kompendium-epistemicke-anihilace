[[pattern.trainer]]
utterance = "Všiml jste si, že sedíme úplně stejně? Takhle rychle si rozumím málokdy. Myslím, že smlouvu můžeme podepsat rovnou dnes."
context = "Obchodní zástupce na první schůzce s potenciálním klientem."
benign = false
marker = "Mluvčí sám upozorňuje na tělesnou shodu a hned ji použije jako důkaz porozumění, ze kterého plyne rozhodnutí bez odkladu."
response = "Oddělit pocit souladu od obsahu nabídky: vyžádat si podmínky písemně a rozhodnout až po čase a s někým mimo rozhovor."

[[pattern.trainer]]
utterance = "Tohle muselo být hodně těžké. Nespěchejte, máme čas, a jestli se vám o něčem mluvit nechce, nemusíte."
context = "Krizová pracovnice mluví tiše a pomalu s rozrušeným člověkem, který se k ní naklonil."
benign = true
marker = "Přizpůsobení tempa a postoje slouží zklidnění a je spojeno s výslovnou svobodou nemluvit; nenásleduje žádná žádost."
response = "Benigní užití: naladění slouží bezpečí člověka, nesměřuje k cíli pomáhající a odmítnutí nemá následky."

