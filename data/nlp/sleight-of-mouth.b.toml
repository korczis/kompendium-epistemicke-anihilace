[[pattern.trainer]]
utterance = "Za deset let si na tuhle hádku ani nevzpomeneš. V celém našem vztahu je to jen drobnost, tak proč z toho děláš problém?"
context = "Partner reaguje na stížnost druhého, že ho opakovaně zesměšňuje před přáteli."
benign = false
marker = "Časový a vztahový rámec se zvětší natolik, že konkrétní a opakované jednání vypadá jako zanedbatelná epizoda; opakování, na které stížnost míří, ze zvětšeného rámce zmizí."
response = "Vrátit se k rámci, ve kterém se jednání děje: jde o opakovaný vzorec, ne o jednu hádku, a jeho dopad se posuzuje v přítomnosti, ne z představy budoucnosti."

[[pattern.trainer]]
utterance = "Dnešní den vypadal jako katastrofa. Když se ale podíváte na celý rok léčby, jsou tam i týdny, kdy se vám dařilo. Obojí je pravda."
context = "Fyzioterapeutka s pacientem po úrazu, který po špatném dni chce rehabilitaci vzdát."
benign = true
marker = "Zvětšení časového rámce doplňuje dnešní zkušenost, nepopírá ji („obojí je pravda“), a opírá se o skutečný průběh, který pacient zná."
response = "Jde o legitimní užití: změna rámce slouží k realistickému pohledu na průběh léčby, ne k odbytí aktuální obtíže."
