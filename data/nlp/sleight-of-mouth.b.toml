[[pattern.trainer]]
utterance = "Říkáš, že na tebe tlačím. Ale teď na mě tlačíš ty, abych přestal. Takže kdo tady koho manipuluje?"
context = "Partner odpovídá na prosbu druhého, aby přestal naléhat na rychlé rozhodnutí."
benign = false
marker = "Výtka se obrátí na toho, kdo ji vyslovil, a samotné vyslovení stížnosti se prohlásí za stejné jednání, jaké popisuje; obsah výtky zůstane neprověřen."
response = "Oddělit výtku od jejího vyslovení: prosba o prostor není nátlak stejného druhu a otázka, zda k naléhání docházelo, se posuzuje podle chování, ne podle obratu."

[[pattern.trainer]]
utterance = "Tvrdíte, že se na žádné studie nedá spolehnout. Opíráte to o nějakou studii? Pokud ano, platí ta výhrada i pro ni."
context = "Vyučující metodologie v semináři diskutuje se studentem tvrzení, že všechny výzkumy jsou zmanipulované."
benign = true
marker = "Kritérium tvrzení se uplatní na tvrzení samo, aby se ukázala jeho nekonzistence, a diskuse pokračuje k tomu, jaké rozlišení mezi studiemi je rozumné."
response = "Jde o legitimní užití: test vnitřní konzistence obecného tvrzení v akademické diskusi, který nesměřuje k zesměšnění mluvčího, ale k přesnější formulaci."

