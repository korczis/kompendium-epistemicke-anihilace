[[pattern.trainer]]
utterance = "Chápu, že je to drahé. Ale opravdu chcete šetřit zrovna na bezpečí svých dětí? Na tom přece cena nehraje roli."
context = "Prodejce zabezpečovacího systému reaguje na námitku rodiče, že je nabídka příliš drahá."
benign = false
marker = "Námitka podle jednoho kritéria (cena) se přebíjí kritériem, které adresát nemůže veřejně odmítnout (bezpečí dětí), aniž by se dokládalo, že produkt to vyšší kritérium vůbec naplňuje."
response = "Rozlišit hodnotu od produktu: bezpečí je důležité, ale otázka zní, zda právě tato nabídka k němu přispívá víc než levnější varianty; rozhodnutí odložit a srovnat."

[[pattern.trainer]]
utterance = "Říkáte, že vás ta práce baví, a zároveň, že nemáte čas na rodinu. Co je pro vás teď důležitější? Nemusíte odpovídat hned."
context = "Koučka s klientem, který zvažuje změnu pracovního úvazku."
benign = true
marker = "Kritéria pojmenovává sám klient a mluvčí jen zviditelňuje jejich střet; pořadí hodnot neurčuje a nechává klientovi čas."
response = "Jde o legitimní užití: vyjasnění vlastních priorit adresáta bez podsouvání kritéria zvenku a bez časového tlaku."

