[[pattern.trainer]]
utterance = "Že máš o naší skupině pochybnosti, není nic jiného než tvoje stará zranění z dětství. Ty pochybnosti mluví z tvé bolesti, ne z reality."
context = "Vedoucí duchovní skupiny odpovídá členovi, který zpochybňuje finanční požadavky skupiny."
benign = false
marker = "Obsah námitky se neposuzuje; místo toho se vysvětlí jako příznak osobní historie mluvčího, takže každá další pochybnost se stává dalším dokladem jeho „zranění“."
response = "Trvat na tom, že původ pochybnosti nerozhoduje o její oprávněnosti, a žádat odpověď na věcnou otázku (kam jdou peníze, kdo o nich rozhoduje), případně ji ověřit mimo skupinu."

[[pattern.trainer]]
utterance = "Všímám si, že pokaždé, když mluvíme o otci, rychle přejdete k tomu, že to bylo v pořádku. Můžeme se na ten přechod chvíli podívat, pokud chcete?"
context = "Terapeut s klientkou v dlouhodobé psychoterapii."
benign = true
marker = "Pozorování o vztahu klientky k vlastnímu tvrzení se nabízí jako hypotéza ke společnému prozkoumání, nepoužívá se k odmítnutí jejího výkladu a klientka může nabídku odmítnout."
response = "Jde o legitimní užití: terapeutická reflexe v bezpečném vztahu, v níž výrok o přesvědčení neruší jeho obsah a rozhodnutí o pokračování zůstává klientce."

