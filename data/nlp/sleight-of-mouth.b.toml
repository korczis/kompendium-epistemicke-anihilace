[[pattern.trainer]]
utterance = "Jestli vám za ty přesčasy zaplatíme, teď vůbec není otázka. Otázka je, jestli chcete patřit k lidem, kteří tým v těžké chvíli nenechají ve štychu."
context = "Vedoucí odpovídá zaměstnanci, který se ptá na proplacení přesčasů."
benign = false
marker = "Konkrétní a oprávněná otázka (odměna) se prohlásí za nepodstatnou a nahradí se jiným cílem (loajalita), na který už původní námitka nedosahuje."
response = "Vrátit rozhovor k původní otázce a trvat na odpovědi na ni; nový cíl lze probrat zvlášť, ale nesmí nahradit odpověď na to, na co se člověk ptal."

[[pattern.trainer]]
utterance = "Rozumím, že chcete tu zkoušku hlavně udělat. Stálo by za to se také zeptat, co si z předmětu chcete odnést, ale o tom, co je pro vás důležitější, rozhodujete vy."
context = "Studijní poradkyně se studentem před opravným termínem."
benign = true
marker = "Nový cíl se nabízí vedle původního, ne místo něj, a volba mezi nimi zůstává výslovně na adresátovi."
response = "Jde o legitimní užití: rozšíření úvahy o další cíl bez zpochybnění původní otázky a bez tlaku na její opuštění."

