[[pattern.trainer]]
utterance = "To, že ti to připadá jako ponižování, je jen tvůj model světa. V mé rodině se takhle normálně mluvilo a nikomu to nevadilo."
context = "Partner reaguje na výtku, že se k druhému chová ponižujícím způsobem."
benign = false
marker = "Zkušenost druhého se relativizuje jako „pouhý model světa“, zatímco mluvčího vlastní model se předkládá jako norma; relativizace slouží k odmítnutí výtky, ne k porozumění."
response = "Trvat na tom, že odlišné modely nemění dopad chování, a hodnotit ho podle toho, co se stalo a co to s člověkem dělá, ne podle toho, co bylo zvykem jinde."

[[pattern.trainer]]
utterance = "Vy to vnímáte jako selhání. Znám lidi, kteří by stejnou situaci popsali jako první pokus. Nemusíte s nimi souhlasit, jen mě zajímá, jestli vám to něco říká."
context = "Psycholog s klientem, který se obviňuje z neúspěšného podnikání."
benign = true
marker = "Jiný model světa se nabízí jako možnost k posouzení, zkušenost klienta se nepopírá a souhlas se výslovně nevyžaduje."
response = "Jde o legitimní užití: rozšíření perspektivy, v němž zůstává klientova zkušenost platná a rozhodnutí o jejím výkladu u něj."

