[[pattern.trainer]]
utterance = "A jak víš, že jsem to opravdu řekl? Vybavuješ si ten obraz, nebo jen pocit? Pocity si přece mozek dotváří, to je dokázané."
context = "Partner zpochybňuje vzpomínku druhého na urážku během hádky."
benign = false
marker = "Otázka nesměřuje k ověření události, ale k rozkladu důvěry ve vlastní paměť: zpochybňuje se způsob vybavování, a to selektivně jen u vzpomínky nepříjemné mluvčímu."
response = "Neodpovídat rozborem vlastních vnitřních procesů, ale navrhnout ověření nezávislými stopami (zprávy, svědci, zápisky) a vlastní záznam vést průběžně."

[[pattern.trainer]]
utterance = "Ten článek tvrdí, že lék způsobuje neplodnost. Podle čeho poznáváte, že je zpráva spolehlivá, a podle čeho byste poznala opak?"
context = "Lékárnice s pacientkou, která se kvůli článku na sociální síti bojí užívat předepsaný lék."
benign = true
marker = "Otázka po kritériích spolehlivosti se uplatňuje na zdroj informace, ne na paměť nebo vnímání člověka, a vede k samostatnému ověřování."
response = "Jde o legitimní užití: podpora mediální gramotnosti, při níž si adresátka sama vyjasní, jak informace posuzuje, a může je ověřit u odborníka."

