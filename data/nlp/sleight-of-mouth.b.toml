[[pattern.trainer]]
utterance = "Pochybnosti o firmě jsou jako strach z létání: letadlo je statisticky nejbezpečnější, a stejně tak náš investiční program. Kdo se bojí, jen nerozumí číslům."
context = "Prodejce investičního produktu na prezentaci pro drobné střadatele."
benign = false
marker = "Přirovnání k jiné oblasti, v níž je strach prokazatelně iracionální, se nabízí místo údajů o samotném produktu; podobnost obou situací se nedokládá, jen předpokládá."
response = "Oddělit přirovnání od tvrzení a žádat údaje o produktu samém: auditované výsledky, rizika, poplatky a regulační dohled, ne o bezpečnosti letadel."

[[pattern.trainer]]
utterance = "Možná je to trochu jako učit se na kole: první týdny padáte a neznamená to, že na to nemáte. Ale jestli to tak u vás je, posoudíte sama."
context = "Terapeutka s klientkou, která po měsíci v nové práci pochybuje o svých schopnostech."
benign = true
marker = "Analogie se nabízí jako jedna z možných perspektiv, mluvčí výslovně nechává posouzení její přiléhavosti na adresátce a netvrdí, že z ní něco plyne."
response = "Jde o legitimní užití: přirovnání rozšiřuje pohled, ale nenahrazuje důkaz a adresátka ho může odmítnout bez následků."

