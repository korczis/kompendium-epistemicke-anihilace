[[pattern.trainer]]
utterance = "Tak dobře, říkáš, že na tebe křičím. Ale v pondělí jsem jen zvýšil hlas, ve středu jsem mluvil normálně a v pátek jsem byl unavený. Kde je tedy to křičení?"
context = "Partner reaguje na výčitku, že se ve vztahu opakovaně objevuje křik."
benign = false
marker = "Opakovaný vzorec se rozloží na jednotlivé epizody, každá se zvlášť zlehčí nebo omluví a celek, na který si druhý stěžoval, ze stolu zmizí."
response = "Trvat na posouzení vzorce jako celku: kolikrát se to stalo, jak dlouho to trvá a co to dělá. Jednotlivé omluvy nemění opakování."

[[pattern.trainer]]
utterance = "Říkáte, že studium nezvládnete. Která část vám připadá nejtěžší, zkoušky, psaní práce, nebo to, jak to skloubit s prací?"
context = "Studijní poradkyně na konzultaci se studentem dálkového studia."
benign = true
marker = "Celkové přesvědčení se rozkládá na konkrétní části, aby se dalo posoudit, kde je skutečný problém; nic se tím nezlehčuje ani neomlouvá."
response = "Benigní užití: rozložení pomáhá najít, co lze změnit, a celkovou obavu studenta bere vážně."

