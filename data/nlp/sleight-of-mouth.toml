[[pattern.trainer]]
utterance = "Klidně si dál mysli, že máš právo na vlastní názor. Jen počítej s tím, že lidi s takovým přístupem tady dlouho nevydrží a nikde jinde je nikdo nevezme."
context = "Vedoucí skupiny odpovídá členovi, který zpochybnil rozhodnutí vedení."
benign = false
marker = "Pozornost se přesouvá od obsahu názoru k údajným důsledkům jeho zastávání; „předpověď“ důsledků je ve skutečnosti skrytá hrozba, kterou mluvčí sám může naplnit."
response = "Oddělit předpověď od hrozby: zeptat se, kdo by ty důsledky způsobil a podle jakého pravidla. Hrozbu dokumentovat a hledat oporu mimo skupinu."

[[pattern.trainer]]
utterance = "Když budete dál věřit, že s nikým nemáte mluvit o tom, co se stalo, co to podle vás udělá s vaší únavou a se spánkem za půl roku?"
context = "Praktická lékařka v rozhovoru s pacientkou po traumatické události."
benign = true
marker = "Otázka po důsledku se týká vlastního zdraví pacientky a nechává odpověď na ní; lékařka nic nehrozí a nic nepodmiňuje."
response = "Benigní užití: zkoumání důsledků přesvědčení pomáhá rozhodnout se, zda ho člověk chce dál držet; rozhodnutí zůstává jeho."

