[[pattern.trainer]]
utterance = "Vím, že tě ta slova ranila, ale on to tak nemyslel. Chce pro tebe jen to nejlepší, proto je na tebe tak přísný."
context = "Matka vysvětluje dospívající dceři otcovy ponižující poznámky."
benign = false
marker = "Pozornost se přesouvá od dopadu chování (zranění) k domnělému dobrému úmyslu, který se nedá ověřit a který chování omlouvá."
response = "Trvat na tom, že dopad je skutečný bez ohledu na úmysl; dobrý úmysl neruší nárok na to, aby ponižování skončilo."

[[pattern.trainer]]
utterance = "Rozumím, že kontrolujete domácí úkoly každý večer, protože chcete, aby to syn ve škole zvládl. Co si myslíte, že to kontrolování dělá s ním?"
context = "Školní psycholog v konzultaci s rodičem."
benign = true
marker = "Záměr rodiče se uzná, ale hned se otevírá otázka dopadu na dítě; záměr nic neomlouvá a chování zůstává předmětem posouzení."
response = "Benigní užití: uznání záměru snižuje obranu rodiče a vede k posouzení účinků, ne k jejich zakrytí."

