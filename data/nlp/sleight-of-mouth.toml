[[pattern.trainer]]
utterance = "Když ses mi neozval hned, znamená to, že ti na mně nezáleží. A protože ti na mně nezáleží, budu ti muset kontrolovat zprávy."
context = "Partner vysvětluje, proč požaduje přístup k telefonu druhého."
benign = false
marker = "Přesvědčení má dvě spojky: chování se ztotožní s významem (neozval se = nezáleží mu) a z významu se vyvodí oprávnění ke kontrole; obě spojky se podávají jako samozřejmé."
response = "Rozlišit, co se stalo (zpráva přišla později), od výkladu a od nároku, který se z výkladu vyvozuje; kontrola cizího telefonu z žádného výkladu nevyplývá."

[[pattern.trainer]]
utterance = "Všimla jsem si, že říkáte, že když se nervózně zakoktáte, znamená to, že jste neschopný. Odkud se vám to spojení vzalo?"
context = "Logopedka v rozhovoru s dospělým klientem, který se připravuje na pracovní pohovor."
benign = true
marker = "Spojení mezi chováním (zakoktání) a významem (neschopnost) se pojmenuje a vrátí klientovi k prozkoumání, nic se mu nevnucuje."
response = "Benigní užití: pojmenování struktury přesvědčení dává klientovi možnost posoudit ho sám; logopedka nenabízí vlastní výklad jako jediný správný."

