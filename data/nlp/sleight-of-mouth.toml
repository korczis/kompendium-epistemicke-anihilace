[[pattern.trainer]]
utterance = "Říkáš, že ti ten kurz nepomohl? To jen ukazuje, jak hluboko je tvůj blok. A kdo nemá odvahu se změnit, vždycky najde důvod, proč to nejde."
context = "Lektor seminářů osobního rozvoje odpovídá účastníkovi, který chce odstoupit od dalšího stupně kurzu."
benign = false
marker = "Námitka se během dvou vět přerámuje několikrát za sebou (z výsledku na symptom, ze symptomu na charakter), aniž by se kdokoli zabýval tím, zda kurz skutečně pomohl."
response = "Vrátit rozhovor k původní otázce: jaký měřitelný výsledek kurz sliboval a zda nastal. Rychlé střídání rámců je důvod zpomalit, ne ustoupit."

[[pattern.trainer]]
utterance = "Myslíte si, že kdo jednou selže, už to nedokáže. Znáte někoho, komu se něco nepovedlo napoprvé a později to zvládl? A co by to přesvědčení znamenalo pro vaše děti?"
context = "Psychoterapeutka v rozhovoru s klientem po ztrátě zaměstnání, který o sobě mluví jako o neschopném."
benign = true
marker = "Otázky nabízejí protipříklad a důsledek, ale nechávají klientovi prostor odpovědět jinak a zkoumají jeho vlastní přesvědčení, ne přesvědčení terapeutky."
response = "Benigní užití: přesvědčení se zkoumá spolu s klientem, cílem je jeho úleva a klient může nabídnutý výklad odmítnout bez následků."

