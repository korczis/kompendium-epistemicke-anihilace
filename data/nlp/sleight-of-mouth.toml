[[pattern.trainer]]
utterance = "Tomu, čemu říkáš izolace, já říkám ochrana. Neodřízl jsem tě od rodiny, jen jsem tě uchránil před lidmi, kteří tě stahují dolů."
context = "Partner reaguje na výčitku, že druhému brání ve stycích s příbuznými."
benign = false
marker = "Slovo označující škodu (izolace) se nahradí slovem s podobným rozsahem, ale opačným hodnocením (ochrana), a s novým slovem se tiše mění i to, kdo je viníkem."
response = "Popsat, co se konkrétně děje (kdo s kým nesmí mluvit a co hrozí, když to udělá); o tom, zda jde o ochranu, rozhoduje ten, koho se omezení týká."

[[pattern.trainer]]
utterance = "Říkáte, že jste v práci selhal. Mohl byste to popsat i jako projekt, který nevyšel? Co se změní, když to nazvete takhle?"
context = "Kouč v rozhovoru s manažerem po neúspěšném projektu."
benign = true
marker = "Alternativní pojmenování se nabízí jako otázka, klient srovnává oba popisy a sám rozhoduje, který lépe odpovídá skutečnosti."
response = "Benigní užití: přejmenování nezakrývá fakta (projekt nevyšel), jen odděluje událost od celkového soudu o člověku."

