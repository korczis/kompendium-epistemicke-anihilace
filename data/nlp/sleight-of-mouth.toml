[[pattern.trainer]]
utterance = "Nejde přece o to, že jsem ti vzal výplatu. Jde o to, jestli věříš naší rodině. A kdo nevěří rodině, nevěří vlastně ničemu."
context = "Manžel odpovídá manželce, která chce mít přístup k vlastnímu účtu."
benign = false
marker = "Konkrétní a ověřitelná stížnost (výplata) se povýší na abstraktní hodnotu (důvěra v rodinu) a dál na soud o celé osobě; konkrétní čin z rozhovoru zmizí."
response = "Vrátit rozhovor ke konkrétnímu činu a jeho důsledkům; souhlas s hodnotou rodiny nevyžaduje vzdát se kontroly nad vlastními penězi."

[[pattern.trainer]]
utterance = "Tvrdíte, že jste nevyšel s jedním kolegou, a proto nemáte na vedení týmu. Co pro vás vedení týmu znamená obecně a jakou roli v tom hraje jeden konflikt?"
context = "Supervizor v rozhovoru s nově jmenovaným vedoucím."
benign = true
marker = "Zobecnění vede k tomu, aby si klient vyjasnil, o jakou hodnotu mu jde, a aby jeden konflikt viděl v širší souvislosti; konkrétní fakt se nepopírá."
response = "Benigní užití: pohyb k obecnější rovině slouží orientaci klienta a nevede k soudu nad ním; ke konkrétnímu konfliktu se lze vrátit."

