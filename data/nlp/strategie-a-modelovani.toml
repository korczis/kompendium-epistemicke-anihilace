benign = false
marker = "Otázky na pořadí vnitřních kroků posledního rozhodnutí nepatří k obsahu nabídky; jejich účelem je zjistit, v jakém sledu podat informace, aby vyvolaly souhlas."
response = "Odpovídat o tom, co od výrobku potřebuji, ne o tom, jak se rozhoduji; trvat na cenách, podmínkách a srovnání s alternativami a rozhodnutí si nechat na později."

