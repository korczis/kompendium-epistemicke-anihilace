[[pattern.trainer]]
utterance = "Než vám ukážu ceník, ještě mě zajímá: když jste naposledy kupoval něco dražšího, co přesně se dělo těsně předtím, než jste si řekl, že je to ono? Spíš jste to viděl, nebo vám to někdo popsal?"
