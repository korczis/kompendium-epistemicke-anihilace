benign = true
marker = "Dotaz na vlastní postup slouží cíli, který si student zvolil, a zjištění zůstává jemu k dispozici; nic se nepoužívá k prosazení cizího zájmu."
response = "Benigní užití: sebepoznání ve službě vlastního cíle, s otevřeným výsledkem a bez skryté nabídky, kterou by měl student přijmout."

