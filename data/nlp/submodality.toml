context = "Terapeut při úvodním sezení zaměřeném na panické ataky."
benign = true
marker = "Otázky na umístění a kvalitu tělesného pocitu slouží porozumění; význam pocitu terapeut nepřepisuje a cíl práce je dohodnutý s klientem."
response = "Neškodné zkoumání, které odpovídá běžné klinické práci s tělesnými příznaky úzkosti."

