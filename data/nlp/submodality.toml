benign = true
marker = "Člověk sám a z vlastní iniciativy popisuje vzdálenost a barevnost představy; nikdo mu kvality nenavrhuje ani nemění."
response = "Neškodný popis prožitku, který může terapeutovi pomoci porozumět; oddálení může být i znakem disociace, a proto si zaslouží citlivé klinické posouzení."

