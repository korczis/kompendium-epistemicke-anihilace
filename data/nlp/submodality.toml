benign = true
marker = "Otázka na kvalitu vzpomínky slouží porozumění prožitku, odpověď je výslovně dobrovolná a nenásleduje žádný návrh změny."
response = "Neškodné zkoumání prožitku v rámci terapeutického kontraktu: klient řídí, co sdělí, a nic se mu nevnucuje."

