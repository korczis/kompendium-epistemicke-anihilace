benign = false
marker = "Tělesný signál úzkosti se přejmenuje na neutrální kvalitu (teplo, rozlití) a jeho význam se přepíše tak, aby podporoval setrvání ve skupině."
response = "Respektovat tělesný signál jako možné varování; rozhodnutí o odchodu nedělat pod tlakem a probrat ho s důvěryhodnou osobou mimo komunitu."

[[pattern.trainer]]
