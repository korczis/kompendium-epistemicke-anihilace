[[pattern.trainer]]
utterance = "Ten hlásek, který ti říká, že tohle není v pořádku, je jen tichý skřípavý zvuk. Ztlum ho a poslouchej jen to, co říkám já."
context = "Mentor v uzavřené skupině mluví s členem, který váhá s finančním závazkem."
benign = false
marker = "Vnitřní hlas, který nese varování, se popisuje jako pouhá zvuková kvalita, kterou lze ztlumit, a nahrazuje se hlasem autority."
response = "Brát vnitřní varování jako informaci, ne jako zvuk k ztlumení; rozhodnutí odložit a probrat ho s někým mimo skupinu."

[[pattern.trainer]]
utterance = "Když se kritizuju, slyším to hlasem, který zní hodně nahlas a hodně zblízka, skoro jako by mi někdo křičel do ucha."
context = "Klientka popisuje v terapii, jak prožívá vlastní sebekritiku."
benign = true
marker = "Klientka sama popisuje hlasitost a blízkost vnitřního hlasu; popis slouží porozumění a nikdo jí nic neurčuje."
response = "Neškodný popis, se kterým lze pracovat v rámci ověřených přístupů ke sebekritice; o cíli případné změny rozhoduje klientka."

