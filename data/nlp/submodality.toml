benign = false
marker = "Kvality představy (velikost, ostrost, poloha) se vydávají za doklad pravdivosti obsahu a slouží k zlehčení pochybnosti."
response = "Oddělit živost představy od její pravdivosti: jasnost obrazu nic nedokazuje, pochybnost se posuzuje podle důvodů a dokladů."

[[pattern.trainer]]
utterance = "Když na tu situaci myslím, vidím ji jakoby zdálky a bez barev, jako by se to stalo někomu jinému."
