benign = true
marker = "Vlastní pozice se nejprve uznává jako výchozí bod a teprve potom se otevírá pohled druhého, bez předem daného závěru."
response = "Benigní užití: uznání první pozice je předpokladem bezpečného rozšíření perspektivy a nikdo nediktuje, k čemu má supervidovaný dojít."

