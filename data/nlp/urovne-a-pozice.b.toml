benign = true
marker = "Představa o pohledu druhého se podává jako hypotéza k ověření a dotyčný ji může opravit; mediátor totéž nabízí i druhé straně."
response = "Benigní užití: druhá pozice slouží porozumění a mediátor si z ní nebere právo rozhodnout, co druhý cítí nebo potřebuje."

