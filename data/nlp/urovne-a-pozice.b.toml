marker = "Vlastní pozice druhého se zakazuje jako nezralost a nahrazuje se hlediskem skupiny, takže vlastní potřeby ztrácejí oprávnění být vysloveny."
response = "Trvat na tom, že vlastní vnímání vyčerpání je platná informace; potřeby jednotlivce a skupiny se nevylučují a o rozsahu závazků lze jednat."

[[pattern.trainer]]
