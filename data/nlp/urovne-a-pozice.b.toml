response = "Odlišit porozumění od omluvy: lze chápat, co druhý prožíval, a přesto trvat na tom, že křik byl nepřijatelný; vcítění je vzájemné, ne jednostranná povinnost."

[[pattern.trainer]]
utterance = "Přesně vím, jak se teď cítíte, byl jsem na vašem místě. A právě proto vím, že tuhle smlouvu potřebujete víc, než si sám přiznáte."
