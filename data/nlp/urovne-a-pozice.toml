benign = true
marker = "Obtíž se nejprve hledá v kontextu, tedy v čase, místě a podmínkách, a ne v osobě."
response = "Benigní užití: úroveň prostředí brání předčasnému soudu o schopnostech nebo identitě a ukazuje změny, které jsou v moci organizace."

