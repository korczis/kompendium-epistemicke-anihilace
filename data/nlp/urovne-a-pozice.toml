benign = false
marker = "Prožitek souladu úrovní se použije jako argument, že otázky prostředí a podmínek jsou pod úrovní poslání a nepatří se je vznášet."
response = "Oddělit prožitek ze cvičení od pracovních podmínek: smlouva, čas a odměna se posuzují samostatně a jejich vznesení nevypovídá nic o loajalitě ani identitě."

[[pattern.trainer]]
utterance = "Říkáte, že vám na rodině záleží nejvíc, a zároveň tři večery v týdnu pracujete. Nechci vám nic vnucovat, jen mě zajímá, jak to vedle sebe vidíte vy."
context = "Psycholožka v konzultaci s klientem, který si stěžuje na vyčerpání."
benign = true
marker = "Rozpor mezi hodnotou a chováním se pojmenuje jako pozorování a klientovi zůstává, zda a jak ho chce řešit."
response = "Benigní užití: nesoulad úrovní slouží jako otázka k reflexi, ne jako tlak na přijetí cizího poslání nebo konkrétního rozhodnutí."

