[[pattern.trainer]]
utterance = "Nemusíte se teď rozhodovat, jen si všimněte, jak se vám s každým dalším slovem sedí pohodlněji, a ta správná odpověď k vám přijde sama."
context = "Řečník na placeném semináři o „skrytém ovlivňování“ mluví k účastníkovi, který váhá s objednávkou dalšího kurzu."
benign = false
marker = "Obchodní rozhovor přechází do hypnotického rejstříku: popis tělesného pocitu se spojuje s rozhodnutím a rozhodnutí se vydává za něco, co přijde samo, bez vědomé úvahy."
response = "Pojmenovat posun rozhovoru, vrátit se k věcným otázkám (cena, obsah, storno) a rozhodnutí odložit mimo místnost a mimo přítomnost mluvčího."

[[pattern.trainer]]
utterance = "Dnešní sezení bude hypnotické, jak jsme se domluvili. Kdykoli budete chtít přestat, stačí otevřít oči a říct to, a probereme, co se dělo."
context = "Klinický psycholog s výcvikem v hypnóze zahajuje předem dohodnuté terapeutické sezení."
benign = true
marker = "Hypnóza je ohlášená, dohodnutá a vratná: klient ví, co se děje, souhlasil s tím a má výslovnou možnost kdykoli skončit."
response = "Legitimní užití: otevřený rámec, informovaný souhlas a klinický kontext jsou přesným opakem skryté konverzační hypnózy."

