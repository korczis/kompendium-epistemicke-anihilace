[[pattern.trainer]]
utterance = "Já bych přece nikdy nekřičel, kdybys mě pořád neprovokovala. Všechno, co dělám, je jen reakce na tebe, takže si za to můžeš sama."
context = "Partner po hádce, ve které druhé vyhrožoval a rozbil jí telefon."
benign = false
marker = "Sled událostí je členěn tak, že každý vlastní čin mluvčího je jen odpovědí a začátek vždy leží u druhé, čímž se odpovědnost za výhrůžky a násilí přesouvá na ni."
response = "Rozlišit členění sledu od odpovědnosti za čin: ať se spor vyvíjel jakkoli, za výhrůžku a rozbitou věc odpovídá ten, kdo to udělal, a otázka, kdo začal, na tom nic nemění."

[[pattern.trainer]]
utterance = "Asi to vidíme každý jinak: já mám pocit, že se stahuješ, a proto naléhám, a ty máš možná pocit, že naléhám, a proto se stahuješ. Zkusme to popsat oba."
context = "Manželé v rozhovoru o opakované hádce, kterou vedou na podobné téma."
benign = true
marker = "Mluvčí pojmenovává, že oba členují týž kruh jinak, a nehledá viníka, ale společný popis vzorce mezi dvěma rovnocennými stranami."
response = "Benigní užití: uznání odlišné interpunkce otevírá rozhovor o vzorci, protože ve vztahu nejde o násilí ani o nerovnou moc."

