[[pattern.trainer]]
utterance = "Tady se neptáš, tady posloucháš. Až budeš rozumět tomu, co já, můžeš mít názor. Do té doby je každá tvoje otázka jen důkaz, jak daleko ještě jsi."
context = "Vedoucí duchovní skupiny k členovi, který se zeptal na hospodaření skupiny."
benign = false
marker = "Komplementární vztah učitele a žáka je vyhlášen za neměnný a jakýkoli pokus o rovnocennou otázku se vykládá jako potvrzení podřízeného postavení."
response = "Otázka na peníze a rozhodování je oprávněná bez ohledu na postavení; vztah, ve kterém ji nelze položit, je rigidní a jeho uzavřenost je sama varovným znakem."

[[pattern.trainer]]
utterance = "V tomhle kurzu vás vedu já, protože to dělám dvacet let. Ale pokud uvidíte něco, co nesedí, řekněte to; v posledním týdnu budete vést sezení vy."
context = "Instruktorka první pomoci na začátku vícedenního výcviku."
benign = true
marker = "Komplementární rozdělení rolí je zdůvodněné, výslovně připouští zpochybnění a počítá s tím, že se postavení během výcviku vyrovná."
response = "Benigní užití: komplementarita slouží učení, je časově omezená a nepožaduje, aby podřízený přestal posuzovat, co se děje."
