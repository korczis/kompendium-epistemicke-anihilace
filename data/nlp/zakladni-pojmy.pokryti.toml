# Rodina NLP-02: Základní pojmy NLP, část pokryti (NLP-02.43 až NLP-02.45).
# Pravidlo project.content-catalogs; schéma v scripts/catalogs.py. Pořadí je pořadí identifikátorů.
# Druhý, třetí a pátý axiom pragmatiky komunikace (Watzlawick, Beavin a Jackson 1967), které NLP
# převzalo; první axiom je heslo nelze-nekomunikovat v rodině předpokladů.

[[pattern]]
id = "NLP-02.43"
slug = "obsah-a-vztah"
type = "concept"
cs = "Obsahová a vztahová rovina sdělení"
en = "Content and relationship aspects"
aliases = ["druhý axiom komunikace", "obsahový a vztahový aspekt", "obsah a vztah"]
use = "dvoji"
risk = "stredni"
broader = ""
related = [
  "nelze-nekomunikovat",
  "inkongruence",
  "kategorie-satirove",
  "kontrola-tonu",
  "personalizace-sporu",
]
kompendium = [
  "kompendium/techniques/ea-3-2-4-metacommunication-skill.md",
  "kompendium/techniques/ea-1-4-1-prosodicka-dominance.md",
  "kompendium/techniques/ea-7-1-4-habermas-communicative-action.md",
]
vaknin = "inferred"
review = "agent"

[[pattern.trainer]]
utterance = "Já jsem ti jen řekl, že ta zpráva má chyby. To, jak se teď tváříš, je tvůj problém. Já mluvím o věci, ty si z toho děláš osobní záležitost."
context = "Vedoucí po poradě, na které podřízeného přede všemi zesměšnil tónem i poznámkami."
benign = false
marker = "Mluvčí se schovává za obsahovou rovinu, kterou nikdo nezpochybnil, a vztahové sdělení, které vyslal tónem a situací, popírá a připisuje reakci druhého jeho přecitlivělosti."
response = "Obě roviny pojmenovat zvlášť: s obsahem výtky lze souhlasit a zároveň trvat na tom, že způsob a místo, kde zazněla, jsou samostatné sdělení, o kterém se dá mluvit."

[[pattern.trainer]]
utterance = "K tomu návrhu mám dost výhrad, ale nechci, aby to vyznělo jako útok na tebe. Můžeme je projít a pak mi řekneš, jestli to tak působilo?"
context = "Kolegyně před připomínkami k projektu, na kterém druhý dlouho pracoval."
benign = true
marker = "Mluvčí výslovně odděluje věcnou kritiku od vztahového sdělení a nabízí druhému, aby vztahovou rovinu sám posoudil."
response = "Benigní užití: metakomunikace o vztahu je otevřená, ověřovaná a nebrání nesouhlasu s obsahem."

