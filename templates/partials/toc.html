{%- if doc.toc | length > 1 %}
<div class="sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto rounded-lg bg-white p-4 shadow sm:p-6 dark:bg-gray-800">
  <h3 class="mb-4 text-sm font-semibold uppercase tracking-wide text-gray-900 dark:text-white">Na této stránce</h3>
  <ul class="space-y-2 text-sm">
    {%- for h in doc.toc %}
    <li><a href="{{ h.permalink | safe }}" class="text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">{{ h.title }}</a>
      {%- if h.children and h.level < 3 %}
      <ul class="mt-2 space-y-2 pl-3">
        {%- for c in h.children %}
        <li><a href="{{ c.permalink | safe }}" class="text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">{{ c.title }}</a></li>
        {%- endfor %}
      </ul>
      {%- endif %}
    </li>
    {%- endfor %}
  </ul>
</div>
{%- endif %}
