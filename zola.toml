base_url = "https://korczis.github.io/kompendium-epistemicke-anihilace"
title = "Kompendium epistemické a kognitivní anihilace"
description = "Defenzivní taxonomie epistemické a kognitivní manipulace: mechanismy, detekční signatury, klinické aplikace, obrana a zotavení."
default_language = "cs"
compile_sass = false
minify_html = false
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
author = "Tomas Korcak"
# Glossary pages whose code examples contain literal {{ }} and are not Tera templates.
skip_content_templating = ["glossary/bounded-context.md", "glossary/graph-theory.md", "glossary/gray-team.md"]

taxonomies = [
  { name = "tags", feed = false, paginate_by = 48 },
  { name = "categories", feed = false, paginate_by = 48 },
]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = false
include_path = true

[markdown]
render_emoji = true
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
smart_punctuation = false

[markdown.highlighting]
style = "class"
theme = "github-dark"
error_on_missing_language = false

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
repo_url = "https://github.com/korczis/kompendium-epistemicke-anihilace"
wiki_url = "https://github.com/korczis/kompendium-epistemicke-anihilace/wiki"
origin_site = "https://prismatic-reality-com.github.io/prismatic-promo"
author = "Tomas Korcak"
licence = "CC BY-NC-SA 4.0"
licence_url = "https://creativecommons.org/licenses/by-nc-sa/4.0/deed.cs"
